<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darkime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Pixelify+Sans:wght@500;700&family=Press+Start+2P&family=Bungee&family=Orbitron:wght@700;900&family=Permanent+Marker&family=Bangers&family=Pacifico&family=Russo+One&family=Creepster&display=swap" rel="stylesheet">
<style id="app-style">
:root{
  /* Layout: retro arcade cabinet at night. Coin "jackpot" + pixel podium on top, highscore table and log below; tabs work like a game menu with a blinking cursor. Pixel-notched panels everywhere. One dark world on purpose. */
  --bg:#0f0b1e;
  --bg-2:#150f2b;
  --panel:#1c1537;
  --panel-2:#2a1f4f;
  --edge:#463a80;
  --ink:#f5f2ff;
  --muted:#aaa1d2;
  --coin:#ffcf3f;
  --coin-dk:#b57400;
  --hp:#ff4f6d;
  --xp:#39d6f2;
  --ok:#4ff08f;
  --shadow:#07050f;
  --silver:#d3dbea;
  --bronze:#e5925a;
  --pixel:"Press Start 2P","Courier New",monospace;
  --display:"Pixelify Sans","Press Start 2P",system-ui,sans-serif;
  --body:"Chakra Petch",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* aliases used by page code */
  --gold:var(--coin);--bad:var(--hp);--good:var(--ok);--surface:var(--panel);--surface-2:var(--panel-2);--line:var(--edge);--gold-soft:rgba(255,207,63,.14);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;background:var(--bg)}
body{margin:0;min-height:100%;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 520px at 50% -220px,rgba(57,214,242,.14),transparent 70%),
    radial-gradient(900px 600px at 105% 110%,rgba(255,79,109,.10),transparent 70%),
    linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px) 0 0/24px 24px,
    linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px) 0 0/24px 24px,
    var(--bg);
  background-attachment:fixed;}
body::before{content:"";position:fixed;left:0;top:0;width:2px;height:2px;pointer-events:none;z-index:0;background:transparent;
  box-shadow:80px 120px #fff,220px 60px #9be7ff,410px 190px #fff,560px 90px #ffd96b,730px 160px #fff,900px 70px #9be7ff,1060px 210px #fff,1230px 110px #ffd96b,1390px 180px #fff,1540px 60px #9be7ff,
    140px 420px #fff,330px 520px #ffd96b,620px 460px #fff,840px 560px #9be7ff,1010px 430px #fff,1290px 520px #fff,1470px 450px #ffd96b,
    60px 760px #9be7ff,280px 860px #fff,520px 720px #fff,760px 900px #ffd96b,980px 780px #fff,1180px 880px #9be7ff,1420px 760px #fff,1600px 900px #fff;
  animation:twinkle 3.2s steps(2) infinite;opacity:.55}
@keyframes twinkle{50%{opacity:.2}}
body.locked{overflow:hidden}
main,header{position:relative;z-index:1}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px dashed var(--xp);outline-offset:4px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}
.ico{display:inline-block;vertical-align:middle;flex:none}
.spin{animation:coinspin 1.4s steps(8) infinite}
@keyframes coinspin{0%,100%{transform:scaleX(1)}25%{transform:scaleX(.35)}50%{transform:scaleX(-1)}75%{transform:scaleX(-.35)}}
@keyframes blink{50%{opacity:0}}
@keyframes bob{50%{transform:translateY(-4px)}}

/* Pixel panel: notched corners + hard drop shadow */
.px,.card,.stage,.board,.feed,.pcard,.qcard,.turn,.modal,.vault{--e:var(--edge);background:var(--panel);margin:4px;
  box-shadow:0 -4px 0 0 var(--e),0 4px 0 0 var(--e),-4px 0 0 0 var(--e),4px 0 0 0 var(--e),0 12px 0 0 rgba(0,0,0,.42)}

/* Header */
header.top{position:sticky;top:0;z-index:20;background:rgba(13,9,27,.93);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 0 var(--shadow),0 8px 0 rgba(70,58,128,.45)}
.top-inner{display:flex;align-items:center;gap:20px;min-height:70px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-txt{display:flex;flex-direction:column;line-height:1;min-width:0}
.brand b{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:3px 3px 0 var(--shadow)}
.brand small{color:var(--muted);font-size:13px;margin-top:6px}
.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;padding:12px 9px;font-family:var(--display);font-weight:700;font-size:17px;text-transform:uppercase;color:var(--muted);white-space:nowrap;letter-spacing:.03em}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--coin);text-shadow:2px 2px 0 var(--shadow)}
.tab[aria-selected="true"]::before{content:"▶";font-size:.7em;margin-right:6px;display:inline-block;animation:blink 1s steps(1) infinite}
.pill{font-family:var(--pixel);font-size:9px;padding:7px 10px;background:var(--bg-2);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:8px;text-transform:uppercase;box-shadow:0 -2px 0 var(--edge),0 2px 0 var(--edge),-2px 0 0 var(--edge),2px 0 0 var(--edge);margin:2px}
.pill::before{content:"";width:8px;height:8px;background:var(--muted)}
.pill.is-ok::before{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pill.is-warn::before{background:var(--coin)}
.gatebar{background:rgba(255,255,255,.025)}
.gb-inner{display:flex;align-items:center;gap:10px 14px;min-height:54px;flex-wrap:wrap;padding-top:8px;padding-bottom:10px}
.gb-dot{width:12px;height:12px;background:var(--hp);flex:none;box-shadow:0 0 10px var(--hp);animation:blink 1.2s steps(1) infinite}
.gatebar.is-open .gb-dot{background:var(--ok);box-shadow:0 0 10px var(--ok);animation:none}
.gatebar.is-cd .gb-dot{background:var(--coin);box-shadow:0 0 10px var(--coin)}
.gb-text{font-size:14px;flex:1 1 240px;color:var(--muted)}
.gb-text b{color:var(--ink);font-family:var(--display);font-size:16px;text-transform:uppercase;letter-spacing:.03em;margin-right:4px}
.gb-actions{display:flex;gap:8px;flex-wrap:wrap}
.gb-pub{display:inline-block;margin-left:8px;font-family:var(--pixel);font-size:8px;text-transform:uppercase;color:var(--ok);vertical-align:1px}
.gb-pub.pending{color:var(--coin)}.gb-pub.off{color:var(--hp)}
@media (max-width:680px){
  .top-inner{gap:4px 12px;padding-top:10px}
  .brand b{font-size:24px}
  .tabs{order:3;width:100%;margin-left:-12px}
  .tabs{gap:0}
  .tab{font-size:14px;padding:10px 6px;letter-spacing:0}
  .tab[aria-selected="true"]::before{margin-right:4px}
  .pill{margin-left:auto}
}

/* Buttons and chips */
.btn{--e:var(--shadow);--f:var(--panel-2);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 16px;min-height:44px;margin:3px;border:0;background:var(--f);color:var(--ink);
  font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.03em;text-transform:uppercase;line-height:1.1;
  box-shadow:0 -3px 0 0 var(--e),0 3px 0 0 var(--e),-3px 0 0 0 var(--e),3px 0 0 0 var(--e),inset 0 -5px 0 0 rgba(0,0,0,.3),inset 0 3px 0 0 rgba(255,255,255,.14);
  transition:transform .06s,filter .15s}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(3px);box-shadow:0 -3px 0 0 var(--e),0 3px 0 0 var(--e),-3px 0 0 0 var(--e),3px 0 0 0 var(--e),inset 0 -2px 0 0 rgba(0,0,0,.3)}
.btn-gold{--f:var(--coin);color:#2b1a00}
.btn-ghost{--f:transparent;--e:var(--edge);box-shadow:0 -3px 0 0 var(--e),0 3px 0 0 var(--e),-3px 0 0 0 var(--e),3px 0 0 0 var(--e)}
.btn-sm{min-height:36px;padding:4px 12px;font-size:14px}
.btn-lg{min-height:58px;font-size:21px;padding:10px 24px}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:grayscale(.6);transform:none}
.btn.danger{color:var(--hp)}
.link{background:none;border:0;padding:0;color:var(--coin);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;border:0;margin:2px;background:var(--bg-2);padding:6px 14px;font-weight:600;font-size:14px;min-height:38px;
  box-shadow:0 -2px 0 var(--edge),0 2px 0 var(--edge),-2px 0 0 var(--edge),2px 0 0 var(--edge)}
.chip:hover{background:var(--panel-2)}
.chip[aria-pressed="true"]{background:rgba(255,207,63,.14);color:var(--coin);box-shadow:0 -2px 0 var(--coin),0 2px 0 var(--coin),-2px 0 0 var(--coin),2px 0 0 var(--coin)}
.chip[aria-pressed="true"]::before{content:"▶";font-size:9px}
.chip.pchip{padding-left:5px}
.chip .dot{width:9px;height:9px;background:var(--lc)}
.x{background:none;border:0;color:var(--muted);font-family:var(--pixel);font-size:14px;line-height:1;width:34px;height:34px;flex:none}
.x:hover{background:var(--panel-2);color:var(--hp)}

/* Inputs */
.input{width:calc(100% - 6px);margin:3px;background:#0b0817;border:0;padding:10px 12px;min-height:44px;outline:none;font-family:var(--body);font-size:16px;
  box-shadow:0 -3px 0 var(--edge),0 3px 0 var(--edge),-3px 0 0 var(--edge),3px 0 0 var(--edge)}
.input:focus{box-shadow:0 -3px 0 var(--coin),0 3px 0 var(--coin),-3px 0 0 var(--coin),3px 0 0 var(--coin)}
textarea.input{resize:vertical;min-height:76px}
.input.mini{width:90px}
.field{display:flex;flex-direction:column;gap:8px}
.lbl,.field>label{font-family:var(--pixel);font-size:10px;line-height:1.6;color:var(--xp);text-transform:uppercase;letter-spacing:.04em}
.field small{color:var(--muted);font-size:13px}

/* Avatars: square portraits */
.av{flex:none;display:inline-grid;place-items:center;font-family:var(--pixel);color:#160f2c;background:var(--c,#888);overflow:hidden;line-height:1;text-transform:uppercase;box-shadow:0 0 0 3px var(--shadow)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.ghost{background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,255,255,.05) 6px 12px);box-shadow:0 0 0 3px var(--edge)}

/* Sections */
.section{margin:30px 0 70px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h2.h{font-family:var(--display);font-weight:700;font-size:34px;text-transform:uppercase;letter-spacing:.03em;line-height:1;text-shadow:3px 3px 0 var(--shadow);display:flex;align-items:center;flex-wrap:wrap;gap:4px 0}
h2.h::before{content:"";width:12px;height:12px;background:var(--coin);box-shadow:4px 4px 0 var(--hp);margin-right:16px;flex:none}
h2.h .count{font-family:var(--pixel);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0;margin-left:14px;text-shadow:none}
.card{padding:22px}
.eyebrow{font-family:var(--pixel);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--xp)}

/* Money */
.mn{font-family:var(--pixel)}
.cur{font-family:var(--display);font-weight:700;margin-left:.18em;font-size:1.15em}

/* Hero: jackpot + podium */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:26px;margin-top:30px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.vault{--e:var(--coin);position:relative;padding:24px 24px 20px;display:flex;flex-direction:column;gap:16px;overflow:hidden;
  background:linear-gradient(180deg,#2c1d07,var(--panel) 62%)}
.vault::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 2px,transparent 2px 4px)}
.vault-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.vault-top .eyebrow{color:var(--coin);font-size:12px}
.prize.long{font-size:clamp(20px,3.3vw,38px)!important}
.prize{color:var(--coin);font-size:clamp(30px,4.6vw,54px);line-height:1.15;text-shadow:4px 4px 0 var(--coin-dk),8px 8px 0 rgba(0,0,0,.4);white-space:nowrap;position:relative;z-index:1}
.split{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;position:relative;z-index:1}
.split li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:2px dashed rgba(255,255,255,.08)}
.split li b{font-size:12px;color:var(--ink);white-space:nowrap}
.split .pct{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.split.many{display:grid;grid-template-columns:1fr 1fr;column-gap:22px}
.split.many li{grid-template-columns:28px 1fr auto}
.split.many .pct{display:none}
@media (max-width:420px){.split.many{grid-template-columns:1fr}}
.medal{width:26px;height:26px;display:inline-grid;place-items:center;font-family:var(--pixel);font-size:10px;color:#1a1030;flex:none;vertical-align:middle;box-shadow:0 0 0 2px var(--shadow)}
.m1{background:var(--coin)}.m2{background:var(--silver)}.m3{background:var(--bronze)}
.m4{background:var(--panel-2);color:var(--muted)}
.vault .link{position:relative;z-index:1}
.stage{padding:20px 20px 0;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.stage-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stage-head h2.h{font-size:28px}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:12px;margin-top:auto}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pod .crown{animation:bob 1.2s steps(2) infinite;margin-bottom:-2px}
.pod-name{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:6px}
.pod-pts{color:var(--muted);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.pod-block{width:100%;margin-top:6px;display:flex;justify-content:center;padding-top:12px;font-family:var(--pixel);font-size:26px;line-height:1;color:var(--muted);
  background:linear-gradient(rgba(0,0,0,.18) 2px,transparent 2px) 0 0/100% 16px,var(--panel-2);box-shadow:inset 0 6px 0 var(--edge),inset 6px 0 0 rgba(255,255,255,.05)}
.pos1 .pod-block{height:136px;color:var(--coin);box-shadow:inset 0 6px 0 var(--coin),inset 6px 0 0 rgba(255,255,255,.06);background:linear-gradient(rgba(0,0,0,.18) 2px,transparent 2px) 0 0/100% 16px,#3a2a12}
.pos2 .pod-block{height:100px;color:var(--silver);box-shadow:inset 0 6px 0 var(--silver)}
.pos3 .pod-block{height:74px;color:var(--bronze);box-shadow:inset 0 6px 0 var(--bronze)}
.pos1 .av{box-shadow:0 0 0 4px var(--coin),0 0 0 7px var(--shadow),0 0 30px rgba(255,207,63,.35)}
.pos2 .av{box-shadow:0 0 0 4px var(--silver),0 0 0 7px var(--shadow)}
.pos3 .av{box-shadow:0 0 0 4px var(--bronze),0 0 0 7px var(--shadow)}
.pod.empty .av{box-shadow:0 0 0 3px var(--edge)}
.pod.empty .pod-name{color:var(--muted)}
.prize-tag{display:inline-flex;align-items:center;gap:6px;font-size:10px;color:var(--coin);background:rgba(255,207,63,.12);padding:5px 8px;white-space:nowrap;box-shadow:0 0 0 2px rgba(255,207,63,.35)}
.prize-tag small{font-family:var(--body);font-size:11px;color:var(--muted);margin-left:2px}

/* Highscore + log */
.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:26px;margin:36px 0 70px}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.board{overflow:hidden;padding:4px 0}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;align-items:center;gap:14px;padding:12px 18px;border-top:2px dashed rgba(255,255,255,.07)}
.board.is-admin .row{grid-template-columns:52px minmax(0,1fr) auto auto 44px}
.row:first-child{border-top:0}
.row.r1{background:linear-gradient(90deg,rgba(255,207,63,.10),transparent 70%)}
.rank{font-family:var(--pixel);font-size:16px;color:var(--muted);text-align:center;line-height:1}
.row.r1 .rank{color:var(--coin);text-shadow:2px 2px 0 var(--coin-dk)}.row.r2 .rank{color:var(--silver)}.row.r3 .rank{color:var(--bronze)}
.who{display:flex;align-items:center;gap:14px;min-width:0}
.who-txt{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.who .nm{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1}
.xpbar{display:block;height:8px;max-width:240px;background:#0b0817;box-shadow:0 0 0 2px var(--shadow)}
.xpbar.wide{max-width:none;width:100%}
.xpbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--xp) 0 6px,#1d9cb8 6px 8px);transition:width .4s steps(8)}
.row.r1 .xpbar i,.pcard.is-top .xpbar i{background:repeating-linear-gradient(90deg,var(--coin) 0 6px,var(--coin-dk) 6px 8px)}
.pts{font-family:var(--pixel);font-size:20px;line-height:1;text-align:right;min-width:3ch;white-space:nowrap}
.pts small{font-family:var(--display);font-size:13px;color:var(--muted);margin-left:6px;text-transform:uppercase}
.plus{width:40px;height:40px;min-height:40px;padding:0;font-size:22px}
@media (max-width:520px){
  .row{gap:10px;padding:10px 12px;grid-template-columns:30px minmax(0,1fr) auto}
  .board.is-admin .row{grid-template-columns:30px minmax(0,1fr) auto 44px}
  .row .prize-col{grid-column:2;grid-row:2;justify-self:start;margin-left:58px}
  .row .prize-col:empty{display:none}
  .rank{font-size:12px}
  .pts{font-size:16px}
  .who .nm{font-size:18px}
}
.feed{list-style:none;margin:4px;padding:6px 0}
.ev{display:grid;grid-template-columns:52px 28px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 14px}
.feed.is-admin .ev{grid-template-columns:52px 28px minmax(0,1fr) auto 34px}
.delta{font-family:var(--pixel);font-size:13px;text-align:right}
.delta.up{color:var(--ok)}.delta.down{color:var(--hp)}
.ev-txt{min-width:0;line-height:1.25}
.ev-txt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--display);font-weight:700;text-transform:uppercase}
.ev-txt span{font-size:13px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev time{font-family:var(--pixel);font-size:8px;color:var(--muted)}
.empty-box{padding:30px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:14px}
.empty-box strong{color:var(--ink);font-family:var(--display);font-size:22px;text-transform:uppercase}

/* Players: character select */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:26px 22px}
.pcard{position:relative;padding:26px 18px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;transition:transform .12s}
.pcard:not(.add):hover{--e:var(--coin);transform:translateY(-4px)}
.ptag{position:absolute;top:10px;left:12px;font-family:var(--pixel);font-size:9px;color:var(--xp)}
.pcrown{position:absolute;top:6px;right:10px}
.pcrown .crown{animation:bob 1.2s steps(2) infinite}
.pcard .pc-av{box-shadow:0 0 0 4px var(--shadow),0 0 0 7px var(--edge);margin:8px 0 6px}
.pcard.is-top .pc-av{box-shadow:0 0 0 4px var(--shadow),0 0 0 7px var(--coin)}
.pc-name{font-family:var(--display);font-weight:700;font-size:28px;text-transform:uppercase;line-height:1;max-width:100%;overflow-wrap:anywhere;text-shadow:3px 3px 0 var(--shadow)}
.pc-meta{color:var(--muted);font-size:14px;font-weight:600}
.pc-actions{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.pcard.add{--e:var(--edge);align-items:stretch;text-align:left;background:repeating-linear-gradient(45deg,var(--panel) 0 14px,#201840 14px 28px)}
.pcard.add .ptag{color:var(--coin)}

details summary{cursor:pointer;font-weight:700;color:var(--coin)}

}
.qcard{padding:24px;display:flex;flex-direction:column;gap:20px;min-height:400px}

.lvltag{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:15px;text-transform:uppercase;color:var(--ink);background:var(--panel-2);padding:4px 10px;box-shadow:0 0 0 2px var(--lc)}

.qtext{font-size:clamp(23px,2.7vw,36px);font-weight:700;line-height:1.2;margin:0}

.hp{display:flex;align-items:center;gap:12px}
.hp-lbl{font-family:var(--pixel);font-size:10px;color:var(--ok)}

.hp-bar .fill{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--ok) 0 10px,#2dbb69 10px 12px);box-shadow:inset 0 4px 0 rgba(255,255,255,.25);transition:width .2s linear}
.hp .num{font-family:var(--pixel);font-size:24px;min-width:3ch;text-align:right;color:var(--ok)}

  box-shadow:0 -3px 0 var(--e),0 3px 0 var(--e),-3px 0 0 var(--e),3px 0 0 var(--e),inset 0 -5px 0 rgba(0,0,0,.25);transition:transform .06s}

/* Quiz board */
.boardcard{gap:18px}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* Lobby / title screen */
.gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:40px 28px;overflow:auto;transition:transform .9s steps(9);
  background:
    radial-gradient(700px 460px at 50% 40%,rgba(57,214,242,.16),transparent 70%),
    linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px) 0 0/24px 24px,
    linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px) 0 0/24px 24px,
    var(--bg)}
.gate::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 4px)}
.gate::after{content:"";position:fixed;inset:14px;pointer-events:none;box-shadow:0 -6px 0 var(--coin),0 6px 0 var(--coin),-6px 0 0 var(--coin),6px 0 0 var(--coin),inset 0 0 120px rgba(0,0,0,.6)}
.gate.lift{transform:translateY(-105%)}

.gate-title{font-family:var(--display);font-weight:700;font-size:clamp(46px,9vw,96px);line-height:.92;text-transform:uppercase;color:var(--coin);
  text-shadow:4px 4px 0 var(--hp),8px 8px 0 var(--shadow);overflow-wrap:anywhere}
.gate-sub{margin:0;font-family:var(--pixel);font-size:clamp(11px,2vw,14px);color:var(--ink);text-transform:uppercase;line-height:1.6}
.load{width:100%;height:26px;background:#0b0817;box-shadow:0 0 0 3px var(--shadow),0 0 0 6px var(--ink);margin-top:14px;padding:4px}
.load i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--coin) 0 14px,transparent 14px 18px);transition:width .3s steps(3)}
.load-meta{width:100%;display:flex;justify-content:space-between;gap:12px;font-family:var(--pixel);font-size:10px;color:var(--muted);text-transform:uppercase;margin-top:4px}
.load-meta b{color:var(--coin);font-weight:400}
.press{margin:8px 0 0;font-family:var(--pixel);font-size:clamp(10px,1.8vw,13px);color:var(--xp);text-transform:uppercase;animation:blink 1s steps(1) infinite;line-height:1.6}
.gate-tip{min-height:3.2em;color:var(--ink);font-weight:600;margin:4px 0 0;font-size:18px;max-width:44ch}
.gate-note{color:var(--muted);font-size:14px;margin:0}
.ready{margin:0;font-family:var(--pixel);font-size:clamp(14px,3vw,22px);color:var(--xp);text-transform:uppercase}
.cd{font-family:var(--pixel);font-size:clamp(110px,26vw,220px);line-height:1;color:var(--coin);text-shadow:8px 8px 0 var(--hp),16px 16px 0 var(--shadow);animation:pop .9s steps(5) both}
.cd.go{font-family:var(--display);font-weight:700;font-size:clamp(110px,24vw,220px);text-transform:uppercase;color:var(--ok);text-shadow:8px 8px 0 var(--xp),16px 16px 0 var(--shadow)}
@keyframes pop{0%{transform:scale(1.8);opacity:0}30%{transform:scale(1);opacity:1}100%{transform:scale(.94);opacity:.95}}
.preview-end{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:2}

/* Modal + toast + loading */

  body.ingame .dsec .dtop{grid-column:2;grid-row:1;margin:0;gap:6px}
  body.ingame .dsec .dtop .qprog{font-size:9px}
  body.ingame .dsec .dtop .dtimer{flex:1 1 100%;max-width:none}
  body.ingame .dsec .dtop .qtools{margin-left:0}
  body.ingame .dsec .dword{grid-column:2;grid-row:2;min-height:0;padding:4px 8px;gap:4px 8px}
  body.ingame .dsec .dw-lbl{font-size:8px}
  body.ingame .dsec .dw-word{font-size:22px}
  body.ingame .dsec .dl{font-size:17px;border-bottom-width:3px}
  body.ingame .dsec .dw-pat{gap:10px}
  body.ingame .dsec .dwrd{gap:3px}
  body.ingame .dsec .dtools{grid-column:2;grid-row:3;gap:6px}
  body.ingame .dsec .dpal{grid-template-columns:repeat(8,minmax(0,1fr));width:100%;gap:4px}
  body.ingame .dsec .dcol{width:100%;height:24px}
  body.ingame .dsec .dsz{width:34px;height:34px}
  body.ingame .dsec .dtb{width:36px;height:36px;font-size:17px}
  body.ingame .dsec .dtb[data-act="dc-undo"]{margin-left:0}
  body.ingame .dsec .dchat{grid-column:2;grid-row:4;padding:8px;gap:6px;max-height:none;position:static}
  body.ingame .dsec .dlog{min-height:60px;max-height:calc(100dvh - 210px)}
  body.ingame .dsec .dlines{font-size:13px}
  body.ingame .dsec .dlines li{padding:2px 4px}
  body.ingame .dsec .dguess .input{min-height:40px;padding:6px 10px}
  body.ingame .dsec .dside{grid-column:2;grid-row:5;padding:6px;position:static}

  body.ingame .dsec .dplist{flex-direction:row;overflow-x:auto;gap:6px;padding:3px}
  body.ingame .dsec .dprow{flex:none;padding:3px 6px;gap:6px}
  body.ingame .dsec .dprow .av{width:24px!important;height:24px!important;font-size:9px!important}
  body.ingame .dsec .dprow .st-rank,body.ingame .dsec .dprow .st-name small{display:none}
  body.ingame .dsec .dprow .st-name b{font-size:13px}
  body.ingame .dsec .dprow .st-pts{font-size:12px}
  body.ingame .dsec #dp-who{grid-column:1 / -1;grid-row:7}
  body.ingame .dover{padding:8px}
  body.ingame .dover-box{gap:6px}
  body.ingame .dover-box h3{font-size:20px}
  body.ingame .dover-box .dreveal{font-size:30px}
  body.ingame .dgains{gap:4px}
  body.ingame .dgains li{padding:3px 8px}

  /* Quiz quer: Spielbrett und Frage groß, rechts wer dran ist und die Punkte */
  body.ingame .qstage3{grid-template-columns:minmax(0,1fr) 190px;grid-template-areas:"center turn" "center stand";gap:8px 10px}
  body.ingame .qstage3 .turn{grid-area:turn;flex-direction:column;flex-wrap:nowrap;align-items:center;text-align:center;padding:8px;gap:4px;position:static}
  body.ingame .qstage3 #slot{flex-direction:column}
  body.ingame .qstage3 .turn .avbig{width:44px!important;height:44px!important;font-size:14px!important}
  body.ingame .qstage3 .slot-name{font-size:19px}
  body.ingame .qstage3 .turn .who-is{order:0;margin:0;font-size:9px}
  body.ingame .qstage3 .turn .motto,body.ingame .turn-next{display:none}
  body.ingame .qcenter{grid-area:center;gap:8px}
  body.ingame .stand{grid-area:stand;padding:8px;max-height:calc(100dvh - 170px);overflow:auto;position:static}
  body.ingame .stand-head{margin-bottom:6px}
  body.ingame .stand-list{gap:6px}
  body.ingame .stand-row{padding:4px 6px;gap:6px}
  body.ingame .stand-row .av{width:24px!important;height:24px!important;font-size:9px!important}
  body.ingame .stand .st-name b{font-size:14px}
  body.ingame .stand .st-name small{display:none}
  body.ingame .stand .st-pts{font-size:14px}
  body.ingame .qsec .qcard{padding:10px 12px;min-height:0;gap:8px}
  body.ingame .qsec .qtext{font-size:19px}
  body.ingame .qsec .answers{gap:6px}
  body.ingame .qsec .ans{font-size:15px;min-height:44px;padding:6px 10px;gap:8px}
  body.ingame .qsec .ans .k{width:28px;height:28px;font-size:11px}
  body.ingame .qsec .boardcard{gap:6px}
  body.ingame .qsec .bprompt{font-size:16px}
  body.ingame .qsec .board5{grid-template-columns:58px repeat(var(--cols,5),minmax(0,1fr));gap:5px}

  body.ingame .qsec .bcat .long{display:none}
  body.ingame .qsec .bcat .short{display:inline}
  body.ingame .qsec .blvl{font-size:9px;gap:2px}
  body.ingame .qsec .bcell{min-height:max(38px,calc((100dvh - 150px) / 5));padding:2px}
  body.ingame .qsec .bcell b{font-size:16px}
  body.ingame .qsec .verdict{font-size:20px}
  body.ingame .qflag img{height:80px}
  body.ingame .est{gap:6px}
  body.ingame .est-scale{margin:40px 8px 44px}
  body.ingame .autonext{font-size:14px}
}

/* Malen: Schwierigkeit */
.dchoice{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:150px;padding:12px 18px;border:0;background:#141026;color:var(--ink);
  box-shadow:0 0 0 4px var(--lc),0 0 0 7px var(--shadow),0 8px 0 4px rgba(0,0,0,.45);margin:6px}
.dchoice:hover{background:#1f1840;transform:translateY(-2px)}
.dchoice small{font-family:var(--pixel);font-size:9px;text-transform:uppercase;color:var(--lc);letter-spacing:.04em}
.dchoice b{font-family:var(--display);font-size:clamp(22px,2vw,30px);text-transform:uppercase;line-height:1.05}
.dchoices{gap:16px}
.dlv{display:inline-block;font-family:var(--pixel);font-size:9px;text-transform:uppercase;color:var(--lc);padding:5px 7px;box-shadow:0 0 0 2px var(--lc);line-height:1.2;white-space:nowrap}
.dover-box.rv{box-shadow:0 0 0 3px var(--shadow),0 0 0 6px var(--lc,var(--coin))}
.dover-box.rv .dreveal{color:var(--lc,var(--coin))}
.dgal figure{box-shadow:0 0 0 3px var(--lc,var(--shadow))}
.dlvchip{box-shadow:inset 0 0 0 2px var(--lc)}
.dlvchip[aria-pressed="true"]{background:var(--lc);color:#120d22}
.dlvchip small{color:inherit;opacity:.7;margin-left:2px}
.dsteps{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
.dstepper{display:flex;align-items:center;gap:10px}
.dstepper b{font-family:var(--pixel);font-size:20px;color:var(--coin);min-width:3.4em;text-align:center}
.dstepper b small{font-size:10px;color:var(--muted)}
.dstep{width:46px;height:46px;border:0;background:var(--panel-2);color:var(--ink);font-family:var(--display);font-size:26px;line-height:1;box-shadow:0 0 0 3px var(--shadow)}
.dstep:hover{background:var(--edge)}
.dstep[disabled]{opacity:.35;cursor:default}
.dwgroup summary{color:var(--lc);font-weight:700}
.dwown{display:flex;flex-direction:column;gap:4px}
@media (max-width:420px){.dsteps{grid-template-columns:1fr}.dchoice{min-width:0;width:100%}}

/* Malen */
.dstage{display:grid;grid-template-columns:minmax(200px,250px) minmax(0,1fr) minmax(250px,320px);gap:22px;align-items:start}
.dtop{margin-bottom:16px}
.dtop .dtimer{flex:1 1 220px;max-width:520px}
.dside{position:sticky;top:14px;padding:16px 12px}
.dplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.dprow{display:flex;align-items:center;gap:10px;padding:7px 9px;background:var(--panel-2);box-shadow:0 0 0 3px var(--shadow)}
.dprow.drawing{box-shadow:0 0 0 3px var(--coin);background:linear-gradient(90deg,rgba(255,207,63,.18),var(--panel-2) 70%)}
.dprow.ok{box-shadow:0 0 0 3px var(--ok);background:linear-gradient(90deg,rgba(79,240,143,.16),var(--panel-2) 70%)}
.dprow.me .st-name small{color:var(--xp)}
.dprow .st-name b{font-size:18px}
.dprow .st-pts{font-size:16px}
.dstage > *{min-width:0}
.dcenter{min-width:0;display:flex;flex-direction:column;gap:14px}
.dword{display:flex;align-items:center;justify-content:center;gap:10px 16px;flex-wrap:wrap;min-height:64px;padding:8px 14px;background:var(--panel);box-shadow:0 0 0 3px var(--shadow),0 0 0 6px var(--edge);text-align:center}
.dw-lbl{font-family:var(--pixel);font-size:9px;text-transform:uppercase;color:var(--xp);letter-spacing:.06em}
.dw-word{font-family:var(--display);font-size:clamp(26px,2.4vw,40px);text-transform:uppercase;color:var(--coin);letter-spacing:.06em;line-height:1}
.dw-word.ok{color:var(--ok)}
.dw-pat{display:inline-flex;gap:18px;flex-wrap:wrap;justify-content:center}
.dwrd{display:inline-flex;gap:6px}
.dl{display:inline-block;width:.95em;text-align:center;font-family:var(--display);font-size:clamp(24px,2.2vw,36px);line-height:1.1;color:var(--ink);text-transform:uppercase;border-bottom:4px solid var(--ink);min-height:1.15em}
.dl.dash{border-bottom-color:transparent}
.dw-len{font-family:var(--pixel);font-size:11px;color:var(--muted)}
.dpaper{position:relative;width:min(calc(100% - 16px),max(420px,calc((100vh - 440px) * 1.3333)));align-self:center;background:#fff;box-shadow:0 0 0 4px var(--shadow),0 0 0 8px var(--edge),0 14px 0 4px rgba(0,0,0,.4);margin:8px}
.draw-slot{line-height:0}
.dcanvas{display:block;width:100%;height:auto;aspect-ratio:4/3;touch-action:auto;-webkit-user-select:none;user-select:none}
.dcanvas.can{touch-action:none;cursor:crosshair}
.dcanvas.can[data-tool="fill"]{cursor:cell}
.dover{position:absolute;inset:0;display:flex;flex-direction:column;overflow:auto;padding:16px;background:rgba(15,11,30,.82);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.dover:empty{display:none}
.dover:has(.rv){background:rgba(15,11,30,.45);backdrop-filter:none;-webkit-backdrop-filter:none}
.dover-box.rv{background:rgba(15,11,30,.9);padding:18px 22px;box-shadow:0 0 0 3px var(--shadow),0 0 0 6px var(--coin)}
.dover-box{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:560px;margin:auto}
.dover-box h3{font-family:var(--display);font-size:clamp(24px,2.4vw,36px);text-transform:uppercase;line-height:1.1;text-shadow:3px 3px 0 var(--shadow);margin:0}
.dover-box .dreveal{color:var(--coin);font-size:clamp(34px,3.6vw,60px)}
.dover-box .muted{margin:0;font-weight:600}
.dchoices{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.dgains{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;min-width:min(320px,80vw)}
.dgains li{display:flex;align-items:center;gap:10px;background:var(--panel);padding:6px 10px;box-shadow:0 0 0 2px var(--shadow)}
.dgains .dg-n{flex:1;text-align:left;font-weight:700}
.dgains li b{font-family:var(--pixel);font-size:14px;color:var(--ok)}
.dgains li.drawer b{color:var(--coin)}
.dtools{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.dtools:empty{display:none}
.dpal{display:grid;grid-template-columns:repeat(8,30px);gap:5px}
.dcol{width:30px;height:30px;border:0;padding:0;background:var(--c);box-shadow:0 0 0 2px var(--shadow)}
.dcol[aria-pressed="true"]{box-shadow:0 0 0 2px var(--shadow),0 0 0 5px var(--coin);position:relative;z-index:1}
.dsizes{display:flex;gap:6px}
.dsz{width:42px;height:42px;border:0;background:var(--bg-2);display:grid;place-items:center;box-shadow:0 0 0 2px var(--shadow)}
.dsz i{width:var(--s);height:var(--s);background:var(--ink);border-radius:50%}
.dsz[aria-pressed="true"]{box-shadow:0 0 0 2px var(--shadow),0 0 0 5px var(--coin)}
.dtl{display:flex;flex-wrap:wrap;gap:6px}
.dtb{width:44px;height:44px;border:0;background:var(--bg-2);color:var(--ink);font-size:20px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--shadow)}
.dtb:hover{background:var(--panel-2)}
.dtb[aria-pressed="true"]{background:rgba(255,207,63,.16);box-shadow:0 0 0 2px var(--shadow),0 0 0 5px var(--coin)}
.dtb[data-act="dc-undo"]{margin-left:8px}
.dchat{position:sticky;top:14px;padding:14px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 120px)}
.dlog{flex:1 1 auto;min-height:220px;max-height:520px;overflow-y:auto;background:#0b0817;box-shadow:inset 0 0 0 2px var(--shadow);padding:8px}
.dlines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:15px}
.dlines li{padding:4px 6px;line-height:1.3;word-break:break-word}
.dlines li:nth-child(odd){background:rgba(255,255,255,.03)}
.dlines li.ok{background:rgba(79,240,143,.14);color:var(--ok);font-weight:700}
.dlines li.ok span{font-family:var(--pixel);font-size:10px;margin-left:4px}
.dlines li.close{color:var(--coin)}
.dlines li.close span{font-weight:700;margin-left:4px}
.dlines li.like{color:#ffb3c4}
.dlines li.sys{color:var(--xp);font-weight:600}
.dform{display:flex;flex-direction:column;gap:8px}
.dguess{display:flex;gap:6px}
.dguess .input{flex:1;width:auto;min-width:0}
.dhint{margin:0;color:var(--muted);font-weight:600}
.dhint.ok{color:var(--ok)}
.dlike{align-self:flex-start}
#dp-who .whoami{margin-top:22px}
.dfin{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:26px;align-items:start}
.dres{display:flex;flex-direction:column;gap:18px}
.dwin{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding-bottom:8px;border-bottom:2px dashed var(--edge)}
.dwin .slot-name{font-family:var(--display);font-size:32px;text-transform:uppercase}
.dgal-card{display:flex;flex-direction:column;gap:16px}
.dgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.dgal figure{margin:0;background:var(--panel-2);padding:6px;box-shadow:0 0 0 3px var(--shadow)}
.dgal img{display:block;width:100%;aspect-ratio:4/3;background:#fff}
.dgal figcaption{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 2px 0;font-size:13px}
.dgal figcaption b{font-family:var(--display);font-size:17px;text-transform:uppercase;color:var(--coin)}
.dgal figcaption span{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dhow{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;color:var(--muted)}
.dhow b{color:var(--ink)}
.dwlist{color:var(--muted);font-size:14px;line-height:1.6}
@media (max-width:1250px){.dstage{grid-template-columns:200px minmax(0,1fr) 260px;gap:16px}}
@media (max-width:1000px){
  .dstage{grid-template-columns:minmax(0,1fr);gap:14px}
  .dpaper{width:calc(100% - 16px)}
  .dside,.dchat{position:static}
  .dcenter{order:1}.dchat{order:2;max-height:none}.dside{order:3}
  .dlog{min-height:140px;max-height:200px}
  .dfin{grid-template-columns:1fr}
}
@media (max-width:640px){
  .dtop{gap:10px}
  .dtop .dtimer{flex-basis:100%;max-width:none}
  .dtop .qtools{width:100%;margin-left:0}
  .dpaper{margin:6px 4px;width:calc(100% - 8px)}
  .dpal{grid-template-columns:repeat(8,minmax(0,1fr));width:100%}
  .dcol{width:100%;height:30px}
  .dtools{gap:10px}
  .dword{min-height:54px}
  .dl{font-size:22px}
  .dw-pat{gap:12px}
  .dwrd{gap:4px}
  .dover-box .btn-lg{min-height:50px;font-size:18px;padding:8px 16px}
  .dgal{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (min-width:681px){.top-inner{gap:0 20px;padding-top:8px}.tabs{order:3;width:100%;margin-left:-9px}.pill{margin-left:auto}}
@media (min-width:681px) and (max-width:1100px){.tab{font-size:15px;padding:12px 6px}}
/* Spielernamen: Schrift und Farbverlauf */
.pn.f-pixel{font-family:"Press Start 2P",monospace;font-size:.6em;line-height:1.6;font-weight:400}
.pn.f-bungee{font-family:"Bungee",sans-serif;font-size:.84em;font-weight:400}
.pn.f-orbitron{font-family:"Orbitron",sans-serif;font-weight:900;font-size:.84em}
.pn.f-bangers{font-family:"Bangers",cursive;letter-spacing:.05em;font-weight:400}
.pn.f-marker{font-family:"Permanent Marker",cursive;text-transform:none;font-size:.9em;font-weight:400}
.pn.f-pacifico{font-family:"Pacifico",cursive;text-transform:none;font-size:.82em;line-height:1.35;font-weight:400}
.pn.f-russo{font-family:"Russo One",sans-serif;font-size:.9em;font-weight:400}
.pn.f-creepster{font-family:"Creepster",cursive;letter-spacing:.05em;font-weight:400}
.pn.is-g{background:var(--gr);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.6))}
.pn.g-regenbogen{background-size:200% 100%;animation:rbtext 4s linear infinite}
@keyframes rbtext{to{background-position:-200% 0}}
.motto{display:block;font-size:13px;font-style:italic;color:var(--muted);text-transform:none;font-family:var(--body);font-weight:600;line-height:1.3;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .motto{white-space:normal;margin-top:-4px}
.turn .motto{white-space:normal;font-size:14px}
/* Avatar-Rahmen */
.av.fr-gold{box-shadow:0 0 0 3px #1a1200,0 0 0 6px #ffcf3f,0 0 16px rgba(255,207,63,.55)!important}
.av.fr-neon{box-shadow:0 0 0 3px var(--c),0 0 14px var(--c),0 0 30px var(--c)!important}
.av.fr-pixel{box-shadow:0 0 0 3px #fff,0 0 0 6px #000,5px 5px 0 6px rgba(0,0,0,.45)!important}
.av.fr-feuer{animation:frfire 1.1s ease-in-out infinite alternate}
.av.fr-regenbogen{animation:frrb 3s linear infinite}
@keyframes frfire{from{box-shadow:0 0 0 3px #ff4f6d,0 0 10px #ff9f5a}to{box-shadow:0 0 0 3px #ffcf3f,0 0 26px #ff4f6d}}
@keyframes frrb{0%,100%{box-shadow:0 0 0 4px #ff4f6d,0 0 16px #ff4f6d}25%{box-shadow:0 0 0 4px #ffcf3f,0 0 16px #ffcf3f}50%{box-shadow:0 0 0 4px #4ff08f,0 0 16px #4ff08f}75%{box-shadow:0 0 0 4px #39d6f2,0 0 16px #39d6f2}}
@media (prefers-reduced-motion:reduce){.av.fr-feuer,.av.fr-regenbogen,.pn.g-regenbogen{animation:none}}
/* Spieler-Formular */
.pf-prev{display:flex;align-items:center;gap:14px;padding:12px;background:#0b0817;box-shadow:0 0 0 2px var(--edge);text-align:left;width:100%;box-sizing:border-box}
.pf-prev-t{min-width:0;display:flex;flex-direction:column;gap:4px}
.pf-prev-name{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;line-height:1.1;text-shadow:2px 2px 0 var(--shadow);overflow-wrap:anywhere}
.pf-sec{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.fchip{font-size:15px;text-transform:none}
.gsw{width:34px;height:34px;border:0;padding:0;margin:2px;background:var(--g);box-shadow:0 0 0 2px var(--shadow);cursor:pointer}

.frchip{gap:10px}
.frchip .av{margin:3px}
/* Foto zuschneiden */
.crop{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.crop-view{position:relative;overflow:hidden;background:#0b0817;cursor:grab;touch-action:none;box-shadow:0 0 0 3px var(--coin);max-width:100%}
.crop-view:active{cursor:grabbing}
.crop-view img{position:absolute;left:50%;top:50%;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.crop-ring{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.crop-zoom{display:flex;align-items:center;gap:10px;font-weight:700;width:min(220px,100%)}
.crop-zoom input{flex:1;accent-color:var(--coin)}
.crop-tip{margin:0;text-align:center;font-size:13px}
/* Hintergrundmusik */
#bgm-root{position:fixed;right:16px;bottom:16px;z-index:140;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
body.locked #bgm-root{bottom:96px}
.bgm-btn{position:relative;width:52px;height:52px;border:0;background:var(--panel);color:var(--muted);font-size:24px;line-height:1;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 3px var(--shadow),0 0 0 5px var(--edge),0 8px 0 rgba(0,0,0,.4)}
.bgm-btn.on{color:var(--coin)}
.bgm-btn.playing{box-shadow:0 0 0 3px var(--shadow),0 0 0 5px var(--coin),0 8px 0 rgba(0,0,0,.4)}
.bgm-btn i{position:absolute;bottom:7px;width:4px;height:4px;background:var(--coin);opacity:0}
.bgm-btn i:nth-of-type(1){left:14px}.bgm-btn i:nth-of-type(2){left:24px}.bgm-btn i:nth-of-type(3){left:34px}
.bgm-btn.playing i{opacity:1;animation:eq .9s steps(3) infinite alternate}
.bgm-btn.playing i:nth-of-type(2){animation-delay:.3s}.bgm-btn.playing i:nth-of-type(3){animation-delay:.6s}
@keyframes eq{from{height:3px}to{height:11px}}
.bgm-pop{background:var(--panel);padding:16px;width:min(300px,calc(100vw - 32px));box-shadow:0 0 0 3px var(--shadow),0 0 0 5px var(--coin),0 10px 0 rgba(0,0,0,.45);display:flex;flex-direction:column;gap:10px}
.bgm-title{font-family:var(--display);font-size:20px;text-transform:uppercase}
.bgm-ctl{display:flex;flex-direction:column;gap:10px}
.bgm-ctl .vol{display:flex;align-items:center;gap:10px;font-weight:700}
.bgm-ctl .vol input{flex:1;accent-color:var(--coin)}
.bgm-pop .m-text{margin:0;font-size:13px}
.bgm-hint{margin:0;color:var(--coin)!important}
/* Fliegende Bilder */
#fly-site{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fly-site .fly-layer{opacity:.2}
.fly-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.fly{position:absolute;left:0;top:var(--y);width:var(--s);height:var(--s);object-fit:contain;animation:fly var(--d) linear var(--dl) infinite;will-change:transform;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.fly.rev{animation-name:flyrev}
@keyframes fly{0%{transform:translate(-30vw,0) rotate(var(--r0))}50%{transform:translate(45vw,-5vh) rotate(calc((var(--r0) + var(--r1)) / 2))}100%{transform:translate(120vw,0) rotate(var(--r1))}}
@keyframes flyrev{0%{transform:translate(120vw,0) rotate(var(--r1))}50%{transform:translate(45vw,5vh) rotate(calc((var(--r0) + var(--r1)) / 2))}100%{transform:translate(-30vw,0) rotate(var(--r0))}}
.foot{position:relative;z-index:1}
.pics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px;margin:12px 0 4px}
.pic{position:relative;aspect-ratio:1;background:#0b0817;box-shadow:0 0 0 2px var(--edge);display:grid;place-items:center;overflow:hidden}
.pic img{max-width:100%;max-height:100%;object-fit:contain}
.pic .x{position:absolute;top:2px;right:2px;background:rgba(10,7,22,.85)}
.pic.add{cursor:pointer;color:var(--muted);font-size:13px;font-weight:700}
.pic.add:hover{box-shadow:0 0 0 2px var(--coin);color:var(--coin)}

.qflag{display:flex;justify-content:center;padding:6px 0}
.qflag img{display:block;height:clamp(120px,22vh,230px);width:auto;max-width:100%;object-fit:contain;box-shadow:0 0 0 3px var(--shadow),0 0 0 6px var(--edge),0 10px 0 rgba(0,0,0,.4);background:#fff}
.cat-flag{height:14px;width:auto;vertical-align:-2px;margin-right:6px;box-shadow:0 0 0 1px rgba(255,255,255,.3)}
.est{display:flex;flex-direction:column;gap:14px;padding:6px 4px}
.est-out{align-self:center;font-family:var(--pixel);font-size:clamp(22px,2.6vw,38px);color:var(--coin);text-shadow:3px 3px 0 var(--coin-dk);padding:6px 16px;background:#0b0817;box-shadow:0 0 0 3px var(--shadow),0 0 0 5px var(--edge)}
.est-range{width:100%;height:44px;accent-color:var(--coin);cursor:pointer}
.est-range[disabled]{cursor:default;opacity:.7}
.est-ends{display:flex;justify-content:space-between;gap:12px;font-family:var(--pixel);font-size:11px;color:var(--muted)}
.est-hint{margin:0;text-align:center;color:var(--muted);font-weight:600}
.est-go{align-self:center;min-width:min(320px,100%)}
.est-scale{position:relative;height:16px;margin:62px 8px 64px;background:#0b0817;box-shadow:0 0 0 3px var(--shadow),0 0 0 5px var(--edge)}
.est-band{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(90deg,rgba(79,240,143,.55) 0 6px,rgba(79,240,143,.3) 6px 8px)}
.est-mk{position:absolute;top:0;bottom:0;width:0}
.est-mk i{position:absolute;left:-3px;top:-12px;width:6px;height:40px;background:var(--ink);box-shadow:0 0 0 2px var(--shadow)}
.est-mk b{position:absolute;left:0;transform:translateX(-50%);white-space:nowrap;font-size:14px;padding:4px 8px;box-shadow:0 0 0 2px var(--shadow)}
.est-mk.edge-l b{transform:translateX(-8px)}
.est-mk.edge-r b{transform:translateX(calc(-100% + 8px))}
.est-mk.is-ans i{background:var(--ok)}
.est-mk.is-ans b{bottom:calc(100% + 16px);color:#06291c;background:var(--ok)}
.est-mk.is-guess b{top:calc(100% + 16px)}
.est-mk.is-guess.ok i{background:var(--xp)}.est-mk.is-guess.no i{background:var(--hp)}
.est-mk.is-guess.no b{color:#fff;background:#8a2338}.est-mk.is-guess.ok b{color:#0b2a33;background:var(--xp)}
.est-done{padding-bottom:4px}
.est-done .est-ends{margin-top:-6px}
.qform .est-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}

function prizeAmounts(st = S.settings) {
  const idx = Array.from({length:st.places}, (_, i) => i);
  return st.mode === 'eur' ? idx.map(i => st.amounts[i] || 0) : idx.map(i => st.prize * (st.split[i] || 0) / 100);
}
function totalPrize(st = S.settings) { return st.mode === 'eur' ? prizeAmounts(st).reduce((t, a) => t + a, 0) : st.prize; }
function standings() {
  const tot = {};
  for (const e of S.points) tot[e.playerId] = (tot[e.playerId] || 0) + e.delta;
  const list = S.players.map(p => ({...p, pts: tot[p.id] || 0}))
    .sort((a, b) => b.pts - a.pts || a.name.localeCompare(b.name, 'de'));
  let rank = 0;
  list.forEach((p, i) => { if (i === 0 || p.pts !== list[i - 1].pts) rank = i + 1; p.rank = rank; });
  const amounts = prizeAmounts();
  const started = S.points.length > 0;
  let i = 0;
  while (i < list.length) {
    let j = i;
    while (j + 1 < list.length && list[j + 1].pts === list[i].pts) j++;
    let pool = 0; for (let k = i; k <= j; k++) pool += amounts[k] || 0;
    const each = pool / (j - i + 1);
    for (let k = i; k <= j; k++) { list[k].prize = started ? each : 0; list[k].shared = started && j > i && pool > 0; }

function allQuestions() {

  BANK.forEach((byLvl, c) => byLvl.forEach((qs, l) => qs.forEach((x, i) => {
    const id = `v3-${c}-${l}-${i}`;
    if (x && x.e) out.push(est(id, c, l, {q:x.e, unit:x.u, min:x.min, max:x.max, ans:x.a, tol:x.t, year:!!x.y, step:estStep(x)}));

  })));

    if (x.type === 'est') { if (x.q) out.push(est('c' + x.id, x.cat, x.lvl, x)); }
    else if (x.q && x.a.length >= 2) out.push({id:'c' + x.id, cat:x.cat, lvl:x.lvl, q:x.q, a:x.a.slice(), c:x.c});

}

async function toLogo(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const w0 = img.naturalWidth, h0 = img.naturalHeight;
    if (!w0 || !h0) throw new Error('empty');
    const sc = Math.min(1, 80 / h0, 260 / w0);
    const w = Math.max(1, Math.round(w0 * sc)), h = Math.max(1, Math.round(h0 * sc));
    const draw = bg => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); if (bg) { x.fillStyle = bg; x.fillRect(0, 0, w, h); } x.drawImage(img, 0, 0, w, h); return c; };
    const c = draw('');
    let out = c.toDataURL('image/webp', .86);
    if (!/^data:image\/webp/.test(out) || out.length > 45000) out = c.toDataURL('image/png');
    if (out.length > 45000) out = draw('#0a0716').toDataURL('image/jpeg', .82);
    if (out.length > 58000) throw new Error('big');
    return out;
  } finally { URL.revokeObjectURL(url); }
}
const tkCopy = () => JSON.parse(JSON.stringify(S.ticker || DEFAULT_TICKER));
function suggestSplit() {
  const s = D.set, preset = PRESETS[s.places];
  if (s.mode === 'pct') { s.split = pad10(preset).map(String); return; }
  let total = totalPrize(draftAsSettings(s));
  if (!total) total = parseNum(s.prize) || 100;
  const amts = preset.map(p => Math.floor(total * p / 100));
  amts[0] += Math.round(total - amts.reduce((t, a) => t + a, 0));
  s.amounts = pad10(amts).map(String);
}

async function toCover(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const w0 = img.naturalWidth, h0 = img.naturalHeight;
    if (!w0 || !h0) throw new Error('empty');
    for (const size of [180, 140, 110]) {
      const c = document.createElement('canvas'); c.width = size; c.height = size;
      const x = c.getContext('2d'), s = Math.min(w0, h0);
      x.fillStyle = '#150f2b'; x.fillRect(0, 0, size, size);
      x.drawImage(img, (w0 - s) / 2, (h0 - s) / 2, s, s, 0, 0, size, size);
      let out = c.toDataURL('image/webp', .82);
      if (!/^data:image\/webp/.test(out)) out = c.toDataURL('image/jpeg', .8);
      if (out.length < 50000) return out;
    }
    throw new Error('big');
  } finally { URL.revokeObjectURL(url); }
}

function tick() {
  bgmSync();
  drawTick();
  if (S.tab === 'start') { updateCountdowns(); const tk = tourState().k; if (tk !== lastTourK) { lastTourK = tk; render(); } }
  renderGate();
  renderGatebar();
  roomBeat();
  if (ctl() && S.quiz && S.quiz.status === 'running' && S.answers && S.answers.length) handleAnswers();
  const q = S.quiz;
  if (!q || q.status !== 'running' || !q.cfg || q.phase === 'ready') return;
  if (q.phase === 'revealed') {
    const left = autoLeft(q);
    const an = document.getElementById('autonext');
    if (an && left != null) {
      const n = an.querySelector('.an-num'); if (n) n.textContent = Math.ceil(left / 1000);
      const f = an.querySelector('.an-bar i'); if (f) f.style.width = (100 - left / AUTO_MS * 100).toFixed(1) + '%';
    }
    if (ctl() && left === 0) { const k = q.id + ':' + (q.step || 0); if (autoKey !== k) { autoKey = k; quizNext(); } }
  }
  const ms = remaining(q);
  const sec = Math.ceil(ms / 1000);
  const el = document.getElementById('timer');
  if (el) {
    const f = ms / (q.cfg.seconds * 1000);
    el.querySelector('.num').textContent = sec;
    el.querySelector('.fill').style.width = (f * 100).toFixed(1) + '%';
    el.className = 'hp ' + hpClass(f, sec);
  }
  if (q.phase === 'asking') {
    if (sec !== lastSec && sec <= 10 && sec > 0 && lastSec !== null) sfx('tick');
    lastSec = sec;
    if (ms <= 0 && ctl()) {
      const k = q.id + ':' + q.cell + ':' + q.startedAt;
      if (timeoutKey !== k) { timeoutKey = k; quizTimeout(); }
    }
  }
}
setInterval(tick, 200);
const AUTO_MS = 5000;
let autoKey = null;
function autoLeft(q) {
  if (!q || q.phase !== 'revealed' || q.hold || !q.revealedAt) return null;
  return Math.max(0, Math.min(AUTO_MS, AUTO_MS - (Date.now() - q.revealedAt)));

function ensureAudio() {

function tone(f, d, type, v, w) {
  if (!actx || muted) return;
  try {
    const t = actx.currentTime + (w || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(v || .12, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);

  } catch (e) {}

/* ---------- Photos ---------- */
async function toAvatar(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(img.naturalWidth, img.naturalHeight);
    if (!s) throw new Error('empty');
    const size = 224, c = document.createElement('canvas');
    c.width = c.height = size;
    const x = c.getContext('2d');
    x.fillStyle = '#1d172a'; x.fillRect(0, 0, size, size);
    x.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
    return c.toDataURL('image/jpeg', .84);
  } finally { URL.revokeObjectURL(url); }
}

function copyFallback(text = SHARE_URL) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, 9999);
    const ok = document.execCommand && document.execCommand('copy');
    ta.remove(); return !!ok;
  } catch (e) { return false; }
}
function copyShareLink() {
  const done = () => toast('Link kopiert. Jetzt kannst du ihn deinen Freunden schicken.');
  const fail = () => { if (copyFallback()) done(); else openModal({type:'link'}); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(SHARE_URL).then(done, fail);
    else fail();
  } catch (e) { fail(); }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.modal) { closeModal(); return; }
  if (!S.modal && S.tab === 'malen' && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && dcCan()) { e.preventDefault(); dcUndo(); return; }
  if (S.modal || S.tab !== 'quiz' || !ctl()) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input', 'textarea', 'select'].includes(tag)) return;
  const q = S.quiz; if (!q || q.status !== 'running') return;
  const k = e.key.toLowerCase();
  const map = {'1':0, '2':1, '3':2, '4':3, a:0, b:1, c:2, d:3};
  const kc = q.board[q.cell] && q.board[q.cell].q;
  const myTurn = myPid() === q.turn;
  if (myTurn && q.phase === 'asking' && kc && kc.type === 'est' && k === 'enter') { e.preventDefault(); quizAnswerEst(estValue(q)); }
  else if (myTurn && q.phase === 'asking' && kc && kc.type !== 'est' && k in map && map[k] < kc.a.length) { e.preventDefault(); quizAnswer(map[k]); }
  else if (q.phase === 'ready' && k === 'z') { e.preventDefault(); quizRandom(); }
  else if ((k === 'enter' || k === ' ') && tag !== 'button' && q.phase === 'revealed') { e.preventDefault(); quizNext(); }
  else if (k === 'p') { if (q.phase === 'asking') quizPause(); else if (q.phase === 'paused') quizResume(); }
});

function normNews(x) {

    title:str(it && it.title, 80), text:str(it && it.text, 600), at:Number(it && it.at) || 0, img:str(it && it.img, 300000)
  })).filter(it => it.title || it.text).slice(0, 30)};
}
function berlinParts(ms) {
  const f = new Intl.DateTimeFormat('en-GB', {timeZone:'Europe/Berlin', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'});
  const o = {}; f.formatToParts(new Date(ms)).forEach(p => { o[p.type] = p.value; });
  return o;
}
function berlinToUtc(dateStr, timeStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const [hh, mi] = (timeStr || '00:00').split(':').map(Number);
  const want = Date.UTC(y, m - 1, d, hh || 0, mi || 0);
  let guess = want;
  for (let k = 0; k < 2; k++) {
    const p = berlinParts(guess);
    const shown = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute);
    guess += want - shown;
  }
  return guess;
}
function fmtBerlin(ms) {
  return new Date(ms).toLocaleString('de-DE', {timeZone:'Europe/Berlin', weekday:'long', day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit'}) + ' Uhr';
}
function cdParts(ms) {
  let s = Math.max(0, Math.floor(ms / 1000));
  const d = Math.floor(s / 86400); s -= d * 86400;
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60); s -= m * 60;
  return {d, h, m, s};
}
const pad2 = n => String(n).padStart(2, '0');
function cdInner(at) {
  const left = at - Date.now();
  if (left <= 0) return `<div class="cd-done">Es ist so weit!</div>`;
  const p = cdParts(left);
  return [[p.d, p.d === 1 ? 'Tag' : 'Tage'], [pad2(p.h), 'Std'], [pad2(p.m), 'Min'], [pad2(p.s), 'Sek']]
    .map(([v, l]) => `<div class="cd-box"><b>${v}</b><span>${l}</span></div>`).join('');
}
function updateCountdowns() {
  document.querySelectorAll('[data-cd]').forEach(el => {
    const html = cdInner(Number(el.dataset.cd));
    if (el.innerHTML !== html) el.innerHTML = html;
  });
}
function newsImg(it) {
  if (it.img === 'builtin:gta6' || (it.id === 'gta6' && !it.img)) return GTA6_IMG;
  return /^data:image\/(png|jpe?g|webp);base64,[A-Za-z0-9+/=]+$/.test(it.img || '') ? it.img : '';
}
function newsCardsHTML() {

/* ---------- Quiz-Musik: MP3 bleibt auf diesem Gerät (IndexedDB) ---------- */
function idb() {
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open('turnier-media', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('files');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
}
async function idbDo(mode, fn) {
  const dbi = await idb();
  return new Promise((res, rej) => {
    const tx = dbi.transaction('files', mode); const st = tx.objectStore('files');
    const r = fn(st); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error);
  });
}

const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

const ROOM_COLLS = ['players', 'points', 'questions', 'answers', 'pics', 'games', 'gvotes', 'dgal', 'lobbies'];
const ROOM_DOCS = ['settings', 'quiz', 'seen', 'gate', 'wheel', 'news', 'ticker', 'deco', 'draw', 'dwords'];
async function changePassword(pw) {
  pw = str(pw, 64);
  if (pw.length < 3) { toast('Das Passwort braucht mindestens 3 Zeichen.'); return; }
  const nr = await roomFor(pw);
  if (nr === room) { toast('Das ist schon das aktuelle Passwort.'); return; }
  const old = room;
  toast('Passwort wird geändert …');
  try {
    const ops2 = [];
    for (const c of ROOM_COLLS) {
      const snap = await fs.collection('rooms/' + old + '/' + c).get();
      snap.docs.forEach(d => ops2.push({path:'rooms/' + nr + '/' + c + '/' + d.id, data:d.data(), del:'rooms/' + old + '/' + c + '/' + d.id}));
    }
    for (const m of ROOM_DOCS) {
      const d = await fs.doc('rooms/' + old + '/meta/' + m).get();
      if (d.exists) ops2.push({path:'rooms/' + nr + '/meta/' + m, data:d.data(), del:'rooms/' + old + '/meta/' + m});
    }
    await fs.doc('rooms/' + nr).set({created:Date.now()});
    const chunks = []; let cur = [], size = 0;
    for (const o of ops2) {
      const n = JSON.stringify(o.data).length;
      if (cur.length && (cur.length >= 200 || size + n > 3000000)) { chunks.push(cur); cur = []; size = 0; }
      cur.push(o); size += n;
    }
    if (cur.length) chunks.push(cur);
    for (const ch of chunks) { const b = fs.batch(); ch.forEach(o => b.set(fs.doc(o.path), o.data)); await b.commit(); }
    await fs.doc('admin/config').set({room:nr, password:pw});
    await fs.doc('rooms/' + old).set({moved:true});
    for (let i = 0; i < ops2.length; i += 200) {
      const b = fs.batch();
      ops2.slice(i, i + 200).forEach(o => b.delete(fs.doc(o.del)));
      await b.commit();
    }
  } catch (e) { toast('Passwort ändern hat nicht geklappt. Versuch es nochmal.'); return; }
  S.secret = {password:pw}; storePass(pw); D.pwNew = '';
  connectRoom(nr);
  toast('Neues Passwort gilt. Alle müssen es einmal neu eingeben.');
}

const DEFAULT_DECO = {bgm:true, flyLobby:true, flySite:true};
const PICS_MAX = 20;
function normDeco(x) { x = x || {}; return {bgm:x.bgm !== false, flyLobby:x.flyLobby !== false, flySite:x.flySite !== false}; }
function picImg(img) { return typeof img === 'string' && img.length < 140000 && /^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(img) ? img : ''; }
function normPic(id, x) { x = x || {}; return {id, img:picImg(x.img), ts:Number(x.ts) || 0}; }
async function toPic(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const w0 = img.naturalWidth, h0 = img.naturalHeight;
    if (!w0 || !h0) throw new Error('empty');
    for (const max of [360, 280, 200]) {
      const sc = Math.min(1, max / Math.max(w0, h0));
      const w = Math.max(1, Math.round(w0 * sc)), h = Math.max(1, Math.round(h0 * sc));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      let out = c.toDataURL('image/webp', .82);
      if (!/^data:image\/webp/.test(out)) out = c.toDataURL('image/png');
      if (out.length > 110000) out = c.toDataURL('image/jpeg', .8);
      if (out.length <= 110000) return out;
    }
    throw new Error('big');
  } finally { URL.revokeObjectURL(url); }
}
function flyHTML(where) {
  const pics = S.pics || [];
  if (!pics.length) return '';
  const lobby = where === 'lobby';
  const n = lobby ? Math.min(12, Math.max(6, pics.length * 2)) : Math.min(4, Math.max(2, pics.length));
  let h = '';
  for (let i = 0; i < n; i++) {
    const p = pics[i % pics.length], r = rngFrom(i * 7919 + pics.length * 131 + (lobby ? 1 : 2));
    const size = Math.round(lobby ? 70 + r() * 90 : 48 + r() * 42);
    const dur = Math.round((lobby ? 15 : 34) + r() * (lobby ? 14 : 22));
    const delay = -(r() * dur).toFixed(1);
    const y = Math.round(lobby ? 6 + r() * 74 : 8 + r() * 80);
    const rot = Math.round(r() * 40 - 20), spin = Math.round(rot + (r() < .5 ? -1 : 1) * (60 + r() * 200));
    h += `<img class="fly ${r() < .5 ? 'rev' : ''}" src="${p.img}" alt="" style="--s:${size}px;--y:${y}vh;--d:${dur}s;--dl:${delay}s;--r0:${rot}deg;--r1:${spin}deg">`;
  }
  return `<div class="fly-layer ${where}" aria-hidden="true">${h}</div>`;
}

/* ---------- Hintergrundmusik: wird live im Browser erzeugt, keine Datei nötig ---------- */
const BGM_STYLES = {
  chill:{label:'Chill', bpm:84, swing:.17, lead:'triangle', arp:'square', arpCut:1500, density:.42, drums:'soft',
    prog:[[53, [0, 4, 7, 11]], [52, [0, 3, 7, 10]], [50, [0, 3, 7, 10]], [48, [0, 4, 7, 11]]]},
  arcade:{label:'Arcade', bpm:118, swing:0, lead:'square', arp:'square', arpCut:2600, density:.58, drums:'beat',
    prog:[[57, [0, 3, 7]], [53, [0, 4, 7]], [48, [0, 4, 7]], [55, [0, 4, 7]]]},
  space:{label:'Weltraum', bpm:72, swing:0, lead:'sine', arp:'triangle', arpCut:1200, density:.3, drums:'none',
    prog:[[50, [0, 7, 14]], [46, [0, 7, 16]], [53, [0, 7, 14]], [48, [0, 7, 16]]]}
};
const PENTA = [0, 2, 4, 7, 9];
const bgm = {
  pref:lsGet('turnier-bgm-on', ''), vol:Math.max(0, Math.min(1, Number(lsGet('turnier-bgm-vol', '0.45')) || 0)),
  style:BGM_STYLES[lsGet('turnier-bgm-style', 'chill')] ? lsGet('turnier-bgm-style', 'chill') : 'chill',
  ctx:null, out:null, echo:null, noise:null, playing:false, unlocked:false, timer:null, next:0, step:0, mel:null, open:false, key:''
};
function bgmOn() { return bgm.pref === '' ? !(S.deco && S.deco.bgm === false) : bgm.pref === '1'; }
function bgmWanted() {
  if (!bgmOn() || bgm.vol <= 0 || document.hidden) return false;
  if (S.mode === 'setup') return false;
  if (typeof music !== 'undefined' && music.el && !music.el.paused) return false;
  return true;
}
function rngFrom(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function bgmMelody(st) {
  const phrase = seed => {
    const r = rngFrom(seed); const out = []; let deg = 2;
    for (let i = 0; i < 32; i++) {
      const strong = i % 8 === 0;
      if (!strong && r() > st.density) { out.push(null); continue; }
      deg = Math.max(0, Math.min(9, deg + Math.round((r() - .5) * 4)));
      const len = r() < .25 ? 2 : 1;
      out.push({n:72 + Math.floor(deg / 5) * 12 + PENTA[deg % 5], len});
      if (len === 2) { out.push(null); i++; }
    }
    return out;
  };
  const A = phrase(7), B = phrase(19), A2 = A.slice(0, 24).concat(phrase(31).slice(24));
  return [...A, ...A2, ...B, ...A];
}
function bgmEnsure() {
  if (bgm.ctx) return true;
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    const c = new AC();
    const out = c.createGain(); out.gain.value = 0;
    const warm = c.createBiquadFilter(); warm.type = 'lowpass'; warm.frequency.value = 7000;
    out.connect(warm); warm.connect(c.destination);
    const echo = c.createDelay(1); const fb = c.createGain(); fb.gain.value = .28; const wet = c.createGain(); wet.gain.value = .22;
    echo.connect(fb); fb.connect(echo); echo.connect(wet); wet.connect(out);
    const len = c.sampleRate * .5, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    Object.assign(bgm, {ctx:c, out, echo, noise:buf});
    return true;
  } catch (e) { return false; }
}
const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);
function bgmTone(t, m, dur, type, vol, cut, echo, attack = .012) {
  const c = bgm.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(midiHz(m), t);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  let n = o;
  if (cut) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cut; o.connect(f); n = f; }
  n.connect(g); g.connect(bgm.out); if (echo) g.connect(bgm.echo);
  o.start(t); o.stop(t + dur + .05);
}
function bgmNoise(t, dur, vol, hp) {
  const c = bgm.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = bgm.noise; f.type = 'highpass'; f.frequency.value = hp;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(bgm.out); s.start(t); s.stop(t + dur + .02);
}
function bgmKick(t, vol) {
  const c = bgm.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + .14);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + .22);
  o.connect(g); g.connect(bgm.out); o.start(t); o.stop(t + .25);
}
function bgmStep(i, t) {
  const st = BGM_STYLES[bgm.style], sd = 60 / st.bpm / 2;
  if (!bgm.mel || bgm.mel.style !== bgm.style) { bgm.mel = bgmMelody(st); bgm.mel.style = bgm.style; }
  const s8 = i % 8, bar = Math.floor(i / 8) % 4, [root, iv] = st.prog[bar];
  if (s8 % 2 === 1) t += st.swing * sd;
  if (s8 === 0) {
    iv.forEach(x => bgmTone(t, root + x, sd * 8, 'triangle', st.drums === 'none' ? .032 : .022, 0, false, .35));
    bgmTone(t, root - 12, sd * 3, 'triangle', .12, 0, false);
  }
  if (st.drums !== 'none' && s8 === 4) bgmTone(t, root - 12 + (st.drums === 'beat' ? 0 : 7), sd * 3, 'triangle', .1, 0, false);
  if (st.drums === 'beat' && s8 % 2 === 1) bgmTone(t, root - 12, sd * .8, 'triangle', .07, 0, false);
  const arpN = iv[(i % iv.length)];

  if (m) bgmTone(t, m.n, sd * (m.len === 2 ? 1.8 : .95), st.lead, st.lead === 'square' ? .035 : .06, st.lead === 'square' ? 2400 : 0, true);

    if (s8 === 4) bgmNoise(t, .14, .07, 1800);
    if (s8 % 2 === 1) bgmNoise(t, .04, .03, 7000);
  } else if (st.drums === 'beat') {
    if (s8 === 0 || s8 === 4) bgmKick(t, .4);
    if (s8 === 2 || s8 === 6) bgmNoise(t, .12, .09, 1500);
    bgmNoise(t, .03, .028, 8000);
  } else if (s8 === 0 && bar === 0) bgmNoise(t, 1.6, .012, 3000);
}
function bgmTick() {
  if (!bgm.playing || !bgm.ctx) return;
  const st = BGM_STYLES[bgm.style], sd = 60 / st.bpm / 2;
  bgm.echo.delayTime.value = sd * 3;
  while (bgm.next < bgm.ctx.currentTime + .25) {
    try { bgmStep(bgm.step, bgm.next); } catch (e) {}
    bgm.next += sd; bgm.step++;

}
function bgmStart() {
  if (!bgmEnsure()) return;
  const c = bgm.ctx;
  try { if (c.state === 'suspended') c.resume(); } catch (e) {}
  bgm.playing = true; bgm.step = 0; bgm.next = c.currentTime + .12;
  bgm.out.gain.cancelScheduledValues(c.currentTime);
  bgm.out.gain.setTargetAtTime(bgm.vol * .9, c.currentTime, .6);
  clearInterval(bgm.timer); bgm.timer = setInterval(bgmTick, 50); bgmTick();
}
function bgmStop() {
  bgm.playing = false;
  clearInterval(bgm.timer); bgm.timer = null;
  if (bgm.ctx) { const c = bgm.ctx; bgm.out.gain.cancelScheduledValues(c.currentTime); bgm.out.gain.setTargetAtTime(0, c.currentTime, .15); }
}
function bgmSync() {
  const want = bgmWanted();
  if (want && !bgm.playing && bgm.unlocked) bgmStart();
  else if (!want && bgm.playing) bgmStop();
  if (bgm.playing && bgm.out) bgm.out.gain.setTargetAtTime(bgm.vol * .9, bgm.ctx.currentTime, .1);
  renderBgm();
}
['pointerdown', 'keydown'].forEach(n => document.addEventListener(n, () => { if (!bgm.unlocked) { bgm.unlocked = true; bgmSync(); } }, true));
document.addEventListener('visibilitychange', () => bgmSync());
function bgmSetPref(on) { bgm.pref = on ? '1' : '0'; lsSet('turnier-bgm-on', bgm.pref); bgm.unlocked = true; bgmSync(); }
function bgmSetStyle(s) { if (!BGM_STYLES[s]) return; bgm.style = s; lsSet('turnier-bgm-style', s); bgm.step = 0; bgmSync(); }
function bgmControlsHTML(idp) {
  const on = bgmOn();
  return `<div class="bgm-ctl">
    <div class="chips"><button class="chip" type="button" data-act="bgm-toggle" aria-pressed="${on}">${on ? '♪ Musik an' : '♪ Musik aus'}</button></div>
    <label class="vol" for="${idp}-vol">Lautstärke <input type="range" id="${idp}-vol" data-bgm-vol="1" min="0" max="1" step="0.05" value="${bgm.vol}"></label>
    <div class="chips" role="group" aria-label="Musikstil">${Object.entries(BGM_STYLES).map(([k, v]) => `<button class="chip" type="button" data-act="bgm-style" data-s="${k}" aria-pressed="${bgm.style === k}">${v.label}</button>`).join('')}</div>
    ${on && !bgm.unlocked ? '<p class="m-text bgm-hint">Tipp einmal irgendwo auf die Seite, dann startet die Musik.</p>' : ''}
  </div>`;
}
function renderBgm() {
  const root = $('#bgm-root'); if (!root) return;
  const on = bgmOn();
  const key = [on, bgm.open, bgm.style, bgm.unlocked, bgm.playing].join('|');
  if (key === bgm.key) return;
  bgm.key = key;
  root.innerHTML = `<button class="bgm-btn ${on ? 'on' : ''} ${bgm.playing ? 'playing' : ''}" type="button" data-act="bgm-open" aria-expanded="${bgm.open}" aria-label="Musik ${on ? 'an' : 'aus'}, Einstellungen öffnen"><span aria-hidden="true">${on ? '♪' : '♪̸'}</span><i aria-hidden="true"></i><i aria-hidden="true"></i><i aria-hidden="true"></i></button>
    ${bgm.open ? `<div class="bgm-pop" role="dialog" aria-label="Musik"><b class="bgm-title">Hintergrundmusik</b>${bgmControlsHTML('bgmp')}<p class="m-text">Gilt nur für dieses Gerät.</p></div>` : ''}`;
}
function bgmCardHTML() {
  const def = !(S.deco && S.deco.bgm === false);
  return `<div class="card share-card">
    <h3>Hintergrundmusik</h3>
    <p class="m-text">Leichte Musik, die die Seite selbst erzeugt. Jeder kann sie auf seinem Gerät über den ♪-Knopf unten rechts lauter, leiser oder stumm schalten. Während deine Quiz-MP3 läuft, pausiert sie automatisch.</p>
    <label class="toggle"><input type="checkbox" id="deco-bgm" ${def ? 'checked' : ''}><span>Bei Gästen standardmäßig an</span></label>

/* ---------- Boot ---------- */
function introEnd() {
  const el = document.getElementById('intro'); if (!el || el.dataset.out) return;
  el.dataset.out = '1';
  el.classList.add('out');
  setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, reduced() ? 320 : 650);
}
function introInit() {
  const el = document.getElementById('intro'); if (!el) return;
  const total = reduced() ? 900 : 2700;
  setTimeout(introEnd, Math.max(0, total - (Date.now() - (window.__introT0 || Date.now()))));
  el.addEventListener('click', introEnd);
  const k = () => { introEnd(); document.removeEventListener('keydown', k); };
  document.addEventListener('keydown', k);
}
function boot() {
  introInit();
  document.body.insertAdjacentHTML('afterbegin', SHELL);
  if (!S.news) S.news = clone(DEFAULT_NEWS);
  if (!S.deco) S.deco = normDeco(null);
  renderBgm();
  const h = (location.hash || '').slice(1);
  if (h) S.tab = ['spiele', 'raum', 'quiz', 'malen'].includes(h) ? 'spiele-pick' : viewFor(h);
  const fc = CFG && CFG.firebase;
  if (!fc || !fc.apiKey || /HIER_EINTRAGEN/.test(fc.apiKey) || /DEIN-PROJEKT/.test(fc.projectId || '') || !window.firebase) {
    S.mode = 'setup'; S.loaded = true;
    if (fc && fc.apiKey && !/HIER_EINTRAGEN/.test(fc.apiKey) && !window.firebase) S.setupErr = 'Firebase konnte nicht geladen werden. Prüf deine Internetverbindung.';
    render(); return;
  }
  try {
    if (!firebase.apps.length) firebase.initializeApp(CFG.firebase);
    fs = firebase.firestore(); fauth = firebase.auth();
    try { fs.settings({ignoreUndefinedProperties:true, merge:true}); } catch (e) {}
  } catch (e) { S.mode = 'setup'; S.loaded = true; S.setupErr = String(e && e.message || e); render(); return; }
  render();
  fauth.onAuthStateChanged(u => {
    S.userEmail = u && u.email || '';
    if (u) adminEnter(u); else guestEnter();
  });
}
boot();
