}
function kCount(s) { return s.deck.length + s.pile.length + Object.values(s.hands).reduce((n, h) => n + h.length, 0); }

/* ---------- Kartenwahn: Raum-Spiel, Spieltisch und Karten ----------
   Im Raum steht uno = {id, status, cfg, players, s, r, transferred}. s ist der Spielstand, den nur das Host-Gerät schreibt.
   Alle anderen schreiben nur ihren eigenen Wunsch in r.<Spieler> = {n, a, c, col, call, t}; der Host prüft ihn mit kApply. */
const K_PLACE_PTS = [3, 2, 1];
const K_STARTS = [5, 7, 10];
const K_TIMES = [[15, '15 s'], [30, '30 s'], [60, '60 s'], [0, 'Ohne']];
const K_DEF_CFG = {start:7, stack:false, drawPlay:false, time:30};
const kl = {n:0, pend:null, seenSeq:0, seqAt:0, armed:false, pick:'', handScroll:0, wasMine:false, animSeq:0, hTurnKey:'', hTurnAt:0, warnSeq:0};

function kNormCfg(c) {
  c = c && typeof c === 'object' ? c : {};
  return {start:K_STARTS.includes(Number(c.start)) ? Number(c.start) : 7, stack:c.stack === true, drawPlay:c.drawPlay === true,
    time:K_TIMES.some(t => t[0] === Number(c.time)) ? Number(c.time) : 30};
}
function kNormState(s) {
  if (!s || typeof s !== 'object' || !Array.isArray(s.order) || !s.hands || typeof s.hands !== 'object') return null;
  const cards = a => Array.isArray(a) ? a.filter(kValid) : [];
  const order = s.order.filter(p => typeof p === 'string' && p.length <= 40).slice(0, ROOM_MAX);
  if (!order.length) return null;
  const hands = {};
  for (const [p, h] of Object.entries(s.hands)) if (typeof p === 'string' && p.length <= 40) hands[p] = cards(h);
  for (const p of order) if (!hands[p]) hands[p] = [];
  const pile = cards(s.pile);
  if (!pile.length) return null;
  const num = (v, d = 0) => Number.isFinite(Number(v)) ? Number(v) : d;
  const obj = v => v && typeof v === 'object' && !Array.isArray(v) ? v : {};
  return {order, hands, deck:cards(s.deck), pile, turn:Math.max(0, Math.min(order.length - 1, Math.round(num(s.turn)))), dir:num(s.dir) < 0 ? -1 : 1,
    color:K_COLORS.includes(s.color) ? s.color : kCol(pile[pile.length - 1]) === 'w' ? 'r' : kCol(pile[pile.length - 1]),
    pend:Math.max(0, Math.round(num(s.pend))), pendT:s.pendT === 'F' ? 'F' : s.pendT === 'D' ? 'D' : '', drewN:s.drewN === true, drew:kValid(s.drew) ? s.drew : '',
    unc:obj(s.unc), seq:Math.round(num(s.seq, 1)), turnAt:num(s.turnAt), log:Array.isArray(s.log) ? s.log.filter(e => e && typeof e === 'object').slice(-8) : [],
    win:typeof s.win === 'string' ? s.win : '', done:obj(s.done)};
}
function kNorm(x) {
  if (!x || typeof x !== 'object' || !['running', 'finished'].includes(x.status)) return null;
  const s = kNormState(x.s); if (!s) return null;
  const r = {};
  for (const [p, q] of Object.entries(x.r && typeof x.r === 'object' ? x.r : {})) if (q && typeof q === 'object' && Number(q.n) > 0) r[p] = q;
  return {id:str(x.id, 40), status:x.status, cfg:kNormCfg(x.cfg), players:Array.isArray(x.players) ? x.players.filter(p => typeof p === 'string').slice(0, ROOM_MAX) : s.order.slice(),
    s, r, transferred:x.transferred === true, early:x.early === true};
}
const kName = pid => esc(ghost(pid).name);
function kIn() { const U = S.uno, me = myPid(), L = lobby(); return !!(U && U.status === 'running' && me && U.s.order.includes(me) && L && L.members[me] && !S.spectate); }
function kMyTurn() { const U = S.uno; return kIn() && kTurnPid(U.s) === myPid() && !U.s.win; }

/* ----- Senden: Host wendet direkt an, alle anderen schreiben ihren Wunsch ----- */
function kSend(a, extra = {}) {
  const U = S.uno, me = myPid(); if (!U || !kIn()) return;
  const turnAct = ['play', 'draw', 'take', 'pass'].includes(a);
  if (turnAct && kl.pend) return;
  const req = {a, ...extra};
  if (ctl()) { if (!kHostApply([[me, req]])) { if (turnAct) toast('Das geht gerade nicht.'); } return; }
  kl.n = Math.max(kl.n, Number(U.r[me] && U.r[me].n) || 0, Number(U.s.done[me]) || 0) + 1;
  if (turnAct) kl.pend = {a, c:extra.c || '', seq:U.s.seq, t:Date.now()};
  roomWrite({['uno.r.' + me]:{n:kl.n, ...req, ts:Date.now()}});
  render();
}
/* Host: Wünsche nacheinander prüfen und den neuen Stand in einem Schreibvorgang speichern */
function kHostApply(list) {
  const U = S.uno; if (!U || U.status !== 'running' || !ctl()) return false;
  let s = U.s, changed = false, okAny = false;
  for (const [pid, req] of list) {
    const s2 = kApply(s, U.cfg, pid, req);
    if (s2) { s = s2; okAny = true; changed = true; }
    // Abgelehnte Wünsche trotzdem als erledigt merken, damit das Gerät seine Karte zurückbekommt
    if (req.n) { if (!s2) { s = JSON.parse(JSON.stringify(s)); s.seq++; } s.done[pid] = req.n; changed = true; }
  }
  if (!changed) return false;

  if (s.win || s.order.length < 2) patch['uno.status'] = 'finished';
  U.s = s; if (patch['uno.status']) U.status = 'finished';
  roomWrite(patch);

}
function kHostTick() {
  const U = S.uno, L = lobby();
  if (!U || U.status !== 'running' || !ctl() || !L) return;
  const list = [];
  // Wünsche der Mitspieler
  for (const [pid, rq] of Object.entries(U.r)) if (Number(rq.n) > (Number(U.s.done[pid]) || 0)) list.push([pid, {...rq, n:Number(rq.n)}]);
  // Wer den Raum verlassen hat, fliegt aus der Runde
  for (const pid of U.s.order) if (!L.members[pid] || !playerById(pid)) list.push([pid, {a:'leave'}]);
  // „Letzte Karte!“ nicht innerhalb von 3 Sekunden gerufen: 2 Strafkarten
  for (const pid of Object.keys(U.s.unc)) if (Date.now() - Number(U.s.unc[pid]) >= K_CALL_MS + 400 && !list.some(x => x[0] === pid)) list.push([pid, {a:'forgot'}]);

  if (U.cfg.time && tp && Date.now() - kl.hTurnAt > U.cfg.time * 1000 + 1200 && !list.some(x => x[0] === tp)) list.push([tp, {a:'timeout'}]);
  if (list.length) kHostApply(list);
}
function kOnSnap() {
  const U = S.uno;
  if (!U) { kl.pend = null; kl.armed = false; kl.pick = ''; return; }
  kOnState();
  if (ctl() && U.status === 'running') kHostTick();
}
function kOnState() {
  const U = S.uno; if (!U) return;
  const s = U.s, me = myPid();
  if (s.seq !== kl.seenSeq) { kl.seenSeq = s.seq; kl.seqAt = Date.now(); }
  if (kl.pend && (s.seq > kl.pend.seq || Date.now() - kl.pend.t > 6000)) {
    if (s.seq <= kl.pend.seq) toast('Keine Antwort vom Host. Prüf die Verbindung.');
    kl.pend = null;
  }
  const mine = kMyTurn();
  if (mine && !kl.wasMine) { try { tone(660, .09, 'triangle', .08); tone(990, .14, 'triangle', .08, .09); if (navigator.vibrate) navigator.vibrate(60); } catch (e) {} }
  kl.wasMine = mine;
  if (!mine) { kl.armed = false; kl.pick = ''; }
  if (me && (s.hands[me] || []).length > 2) kl.armed = false;
}

/* ----- Spiel starten / beenden ----- */
function kStart() {
  if (!ctl()) return;
  if (S.uno && S.uno.status === 'finished' && !S.uno.transferred) kTransfer();
  const L = lobby(), players = roomMembers(L).slice(0, ROOM_MAX);
  if (players.length < 2) { toast('Für Kartenwahn braucht ihr mindestens 2 Spieler im Raum.'); return; }
  const cfg = kNormCfg(D.kcfg || K_DEF_CFG);
  const U = {id:uid(), status:'running', cfg, players, s:kNew(players, cfg), r:{}, transferred:false, early:false};
  kl.pend = null; kl.n = 0; kl.armed = false; kl.pick = ''; kl.handScroll = 0;
  S.lobbies[S.room] = {...L, uno:U}; S.uno = kNorm(U);
  roomWrite({uno:U}); kOnState(); render();
}
function kEnd() {
  const U = S.uno; if (!U || !ctl() || U.status !== 'running') return;
  roomWrite({'uno.status':'finished', 'uno.early':true});
}
function kTransfer() {
  const U = S.uno; if (!ctl() || !U || U.status !== 'finished' || U.transferred) return;
  const entries = U.s.win ? kRank(U.s).filter(r => r.rank <= 3 && playerById(r.id)).map(r => ({playerId:r.id, delta:K_PLACE_PTS[r.rank - 1]})) : [];
  lobbyAward({'uno.transferred':true}, entries);
}

/* ----- Karten zeichnen: Pixel-Karten in den Farben der Seite ----- */
const K_SKIP = '<svg viewBox="0 0 16 16" aria-hidden="true" shape-rendering="crispEdges"><path fill="currentColor" d="M5 1h6v2H5zM3 3h2v2H3zM11 3h2v2h-2zM1 5h2v6H1zM13 5h2v6h-2zM3 11h2v2H3zM11 11h2v2h-2zM5 13h6v2H5zM5 5h2v2H5zM7 7h2v2H7zM9 9h2v2H9z"/></svg>';
const K_REV = '<svg viewBox="0 0 16 16" aria-hidden="true" shape-rendering="crispEdges"><path fill="currentColor" d="M9 1h2v1h1v1h1v1h1v2h-1v1h-1v1h-1v1H9V7H3V4h6zM7 7h0zM5 8h2v2h6v3H7v2H5v-1H4v-1H3v-1H2v-2h1V9h1V8h1z"/></svg>';
function kSym(v, big) {
  if (v === 'S') return K_SKIP;
  if (v === 'R') return K_REV;
  if (v === 'D') return '+2';
  if (v === 'F') return big ? '<span class="kc-wq">' + K_COLORS.map(c => `<i style="background:${K_HEX[c]}"></i>`).join('') + '</span><b class="kc-plus">+4</b>' : '+4';
  if (v === 'W') return big ? '<span class="kc-wq">' + K_COLORS.map(c => `<i style="background:${K_HEX[c]}"></i>`).join('') + '</span>' : '★';
  return v;
}
function kCardName(c) {
  const v = kVal(c);
  if (v === 'W') return 'Farbwahl';

function madHop(pid, i, cells, opts = {}) {

/* Golf: der Bot probiert Schläge mit derselben Physik aus und nimmt den besten, mit etwas Ungenauigkeit */
const bg = {};
function gBotLeft(H, hi, x, y) {

  const lens = c.slice(1).map((p, k) => Math.hypot(p[0] - c[k][0], p[1] - c[k][1]));
  for (let k = c.length - 2; k >= 0; k--) {

    const r = gSimShot(H, x, y, Math.cos(a) * v, Math.sin(a) * v, t, 10);
    const sc = r.r === 'sink' ? -1e9 : (r.r === 'water' || r.r === 'pit') ? 1e9 : gBotLeft(H, hi, r.x, r.y);

}

    if (b.busy || now < b.nextAt) continue;

async function toVgCover(file) {
  const url = URL.createObjectURL(file);

    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const w0 = img.naturalWidth, h0 = img.naturalHeight;
    if (!w0 || !h0) throw new Error('empty');
    // Auf 3:4 zuschneiden (Mitte), oben etwas mehr behalten: dort sind bei Covern meist Gesichter und Titel
    let sw = w0, sh = w0 * 4 / 3;

    const sx = (w0 - sw) / 2, sy = Math.max(0, (h0 - sh) * 0.4);
    for (const [w, q] of [[270, .8], [240, .74], [200, .7], [160, .66]]) {
      const h = Math.round(w * 4 / 3), c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#150f2b'; x.fillRect(0, 0, w, h);
      x.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
      let out = c.toDataURL('image/webp', q);
      if (!/^data:image\/webp/.test(out)) out = c.toDataURL('image/jpeg', q);
      if (out.length < 55000) return out;
    }
    throw new Error('big');
  } finally { URL.revokeObjectURL(url); }
}

async function vgmPlay(id) {

async function vgmDelete(m, list) {

    if (m.k === 'clip') (await db.collection('vgp').where('mid', '==', m.id).get()).docs.forEach(d => refs.push(d.ref));
    await vgmDeleteRefs(g.pid, refs, b => b.update(db.collection('vg').doc(g.id), m.k === 'shot' ? {ms:left('shot')} : {mv:left('clip')}));
    toast('Entfernt.');

}
async function vgDeleteGame(g) {

const GAME_KIND_NAME = {quiz:'Quiz', malen:'Malen', golf:'Minigolf', karten:'Kartenwahn', mad:'Uncle Grandpa ärgere dich'};

/* Erfahrungspunkte und Level aus dem, was ein Spieler eingetragen und gewonnen hat */
function spXp(p, list) {

function tkCheck(d) {
  if (d.step === 1 && !d.type) return 'Wähl aus, was du melden möchtest.';
  if (d.step === 2 && !d.area) return 'Wähl einen Bereich aus.';
  if (d.step === 3) {
    if (str(d.title, 100).length < 4) { setTimeout(() => { const n = $('#tk-title'); if (n) n.focus(); }, 20); return 'Gib einen kurzen Titel ein (mindestens 4 Zeichen).'; }
    if (str(d.desc, 2000).length < 10) { setTimeout(() => { const n = $('#tk-desc'); if (n) n.focus(); }, 20); return 'Beschreib es bitte etwas genauer (mindestens 10 Zeichen).'; }
    if (d.type === 'bug' && !d.sev) return 'Sag noch, wie schlimm der Fehler ist.';
  }
  return '';
}
let tkBusy = false;
async function tkSubmit() {
  const d = D.tkF, me = playerById(myPid()); if (!d || tkBusy) return;
  if (!me || !vgCan(me)) { toast('Um Tickets zu schreiben, brauchst du deinen eigenen Spieler.'); return; }
  for (const s of [1, 2, 3]) { const err = tkCheck({...d, step:s}); if (err) { d.step = s; renderModal(); toast(err); return; } }
  const id = uid(), now = Date.now();
  const doc = {by:me.id, type:d.type, area:d.area, title:str(d.title, 100), desc:str(d.desc, 2000), status:'open', msgs:[], votes:{}, nimg:d.imgs.length, ts:now, up:now, lastBy:'player'};
  if (str(d.sub, 80)) doc.sub = str(d.sub, 80);
  if (d.area === 'golf' && d.hole) doc.hole = d.hole;
  if (d.type === 'bug') { const st = d.steps.map(s => str(s, 200)).filter(Boolean); if (st.length) doc.steps = st; if (str(d.expect, 800)) doc.expect = str(d.expect, 800); if (d.freq) doc.freq = d.freq; if (d.sev) doc.sev = d.sev; }
  if (d.type === 'idea' || d.type === 'improve') { if (str(d.why, 800)) doc.why = str(d.why, 800); if (d.prio) doc.prio = d.prio; }
  if (d.tech) doc.tech = tkTech();
  tkBusy = true; renderModal();
  try {
    await vgCommit(me.id, b => {
      b.set(db.collection('tickets').doc(id), doc);
      d.imgs.forEach((img, i) => b.set(db.collection('tkimg').doc(id + '_' + i), {tid:id, by:me.id, i, img, ts:now}));
    });
    lsSet('turnier-tk-draft', ''); D.tkF = null; D.tkCtx = null; D.tkSeg = 'mine';
    tkMarkSeen({id, up:now});
    closeModal(); render();
    toast(`Danke! Dein Ticket ${tkCode(id)} ist beim Spielleiter.`);
  } catch (e) {
    toast(e && e.code === 'permission-denied' ? 'Tickets sind noch nicht freigeschaltet. Der Spielleiter muss die neuen Datenbank-Regeln veröffentlichen.' : 'Absenden hat nicht geklappt. Prüf die Verbindung und versuch es nochmal.');
  } finally { tkBusy = false; if (S.modal && S.modal.type === 'tknew') renderModal(); }
}
async function tkAddImgs(files) {
  const d = D.tkF; if (!d) return;
  for (const f of files.slice(0, 3 - d.imgs.length)) {
    try {
      const {i, u} = await vgmLoad(f);
      try { let out = ''; for (const max of [1400, 1100, 860, 640]) { out = vgmEncode(vgmCanvas(i, i.naturalWidth, i.naturalHeight, max), 280000, .8); if (out) break; } if (out) d.imgs.push(out); }
      finally { URL.revokeObjectURL(u); }
    } catch (e) { toast('Ein Bild ließ sich nicht öffnen. Versuch ein JPG oder PNG.'); }
  }
  renderModal();
}
async function tkSend(t) {
  const text = str(D.tkReply, 1000), now = Date.now();
  if (S.admin) {
    const st = D.tkSt && D.tkSt !== t.status ? D.tkSt : '';
    if (!st && !text) { toast('Schreib eine Nachricht oder wähl einen neuen Status.'); return; }
    const m = {by:'admin', t:now, text}; if (st) m.st = st;
    try {
      await db.collection('tickets').doc(t.id).update({...(st ? {status:st} : {}), msgs:t.msgs.concat([m]).slice(-80), up:now, lastBy:'admin'});
      D.tkReply = ''; D.tkSt = ''; tkMarkSeen({id:t.id, up:now}); renderModal(); toast(st ? `Status: ${tkL(TK_ST, st)[1]}` : 'Antwort gesendet.');
    } catch (e) { toast('Senden hat nicht geklappt. Versuch es nochmal.'); }
    return;
  }
  if (!text) { toast('Schreib zuerst etwas.'); return; }
  try {
    await vgCommit(t.by, b => b.update(db.collection('tickets').doc(t.id), {msgs:t.msgs.concat([{by:t.by, t:now, text}]).slice(-80), up:now, lastBy:'player'}));
    D.tkReply = ''; tkMarkSeen({id:t.id, up:now}); renderModal(); toast('Nachtrag gesendet.');
  } catch (e) { toast(e && e.code === 'permission-denied' ? 'Das ist noch nicht freigeschaltet. Der Spielleiter muss die neuen Datenbank-Regeln veröffentlichen.' : 'Senden hat nicht geklappt. Versuch es nochmal.'); }
}
async function tkRemove(t) {
  const refs = [db.collection('tickets').doc(t.id)];
  for (let i = 0; i < t.nimg; i++) refs.push(db.collection('tkimg').doc(t.id + '_' + i));
  if (S.admin) { const b = fs.batch(); refs.forEach(r => b.delete(r)); await b.commit(); return; }
  await vgCommit(t.by, b => refs.forEach(r => b.delete(r)));
}

async function toCover(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const w0 = img.naturalWidth, h0 = img.naturalHeight;
    if (!w0 || !h0) throw new Error('empty');
    for (const size of [180, 140, 110]) {
      const c = document.createElement('canvas'); c.width = size; c.height = size;
      const x = c.getContext('2d'), s = Math.min(w0, h0);
      x.fillStyle = '#150f2b'; x.fillRect(0, 0, size, size);
      x.drawImage(img, (w0 - s) / 2, (h0 - s) / 2, s, s, 0, 0, size, size);
      let out = c.toDataURL('image/webp', .82);
      if (!/^data:image\/webp/.test(out)) out = c.toDataURL('image/jpeg', .8);
      if (out.length < 50000) return out;
    }
    throw new Error('big');
  } finally { URL.revokeObjectURL(url); }
}
function saveGameForm() {

function toggleHype(gid) {

    S.gvotes = S.gvotes.filter(v => v.id !== id); render();
    db.collection('gvotes').doc(id).delete().catch(() => toast('Das hat nicht geklappt. Prüf dein Internet.'));
  } else {
    S.gvotes = [...S.gvotes, {id, gid, voter:devId}]; render();
    db.collection('gvotes').doc(id).set({gid, voter:devId, ts:Date.now()}).catch(() => toast('Das hat nicht geklappt. Prüf dein Internet.'));

function tick() {
  bgmSync();
  drawTick();
  if (eventSync()) render();
  if (S.tab === 'start') { updateCountdowns(); const tk = tourState().k; if (tk !== lastTourK) { lastTourK = tk; render(); } }
  renderGate();
  renderGatebar();
  roomBeat();
  golfHostTick();
  kHostTick();
  kTimerTick();
  madHostTick();
  madTimerTick();
  botTick();
  lobbyAutoAward();
  if (ctl() && S.quiz && S.quiz.status === 'running' && S.answers && S.answers.length) handleAnswers();
  const q = S.quiz;
  if (!q || q.status !== 'running' || !q.cfg || q.phase === 'ready') return;
  if (q.phase === 'revealed') {
    const left = autoLeft(q);
    const an = document.getElementById('autonext');
    if (an && left != null) {
      const n = an.querySelector('.an-num'); if (n) n.textContent = Math.ceil(left / 1000);
      const f = an.querySelector('.an-bar i'); if (f) f.style.width = (100 - left / AUTO_MS * 100).toFixed(1) + '%';
    }
    if (ctl() && left === 0) { const k = q.id + ':' + (q.step || 0); if (autoKey !== k) { autoKey = k; quizNext(); } }
  }
  const ms = remaining(q);
  const sec = Math.ceil(ms / 1000);
  const el = document.getElementById('timer');
  if (el) {
    const f = ms / (q.cfg.seconds * 1000);
    el.querySelector('.num').textContent = sec;
    el.querySelector('.fill').style.width = (f * 100).toFixed(1) + '%';
    el.className = 'hp ' + hpClass(f, sec);
  }
  if (q.phase === 'asking') {
    if (sec !== lastSec && sec <= 10 && sec > 0 && lastSec !== null) sfx('tick');
    lastSec = sec;
    if (ms <= 0 && ctl()) {
      const k = q.id + ':' + q.cell + ':' + q.startedAt;
      if (timeoutKey !== k) { timeoutKey = k; quizTimeout(); }
    }
  }
}

function autoLeft(q) {

let actx = null, muted = false;
try { muted = localStorage.getItem('spieleturnier-muted') === '1'; } catch (e) {}
function ensureAudio() {
  try {
    if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
    if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
  } catch (e) { actx = null; }
}
function tone(f, d, type, v, w) {
  if (!actx || muted) return;
  try {
    const t = actx.currentTime + (w || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(v || .12, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + .05);
  } catch (e) {}
}

  if (n === 'tick') tone(1046, .06, 'square', .035);
  else if (n === 'pick') tone(420 + Math.random() * 260, .05, 'triangle', .05);
  else if (n === 'chosen') { tone(660, .12, 'triangle', .1); tone(990, .28, 'triangle', .1, .1); }
  else if (n === 'right') { tone(523, .12, 'sine', .14); tone(659, .12, 'sine', .14, .1); tone(784, .32, 'sine', .14, .2); }
  else if (n === 'wrong') { tone(220, .18, 'sawtooth', .07); tone(160, .38, 'sawtooth', .07, .16); }
  else if (n === 'timeout') tone(150, .75, 'sawtooth', .09);
}

/* ---------- Photos ---------- */
async function toAvatar(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(img.naturalWidth, img.naturalHeight);
    if (!s) throw new Error('empty');
    const size = 224, c = document.createElement('canvas');
    c.width = c.height = size;
    const x = c.getContext('2d');
    x.fillStyle = '#1d172a'; x.fillRect(0, 0, size, size);
    x.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
    return c.toDataURL('image/jpeg', .84);
  } finally { URL.revokeObjectURL(url); }
}

  } catch (e) { return false; }
}

  } else if (f === 'settings') {
    const s = D.set; if (!splitValid()) return;
    const cur = S.settings;
    const next = {...draftAsSettings(s), date:cur.date, time:cur.time, status:cur.status, liveAt:cur.liveAt};
    if (next.mode === 'eur') next.prize = totalPrize(next);
    D.set = null;
    ops.saveSettings(next);
    toast('Einstellungen gespeichert.');
  } else if (f === 'tour-status') {
    const t = D.ts; if (!t) return;
    if (t.status === 'plan' && !/^\d{4}-\d{2}-\d{2}$/.test(t.date || '')) { toast('Wähl ein Datum.'); return; }
    if (t.status === 'plan' && berlinToUtc(nextIsoDay(t.date), '06:00') <= Date.now()) { toast('Das Datum ist schon vorbei.'); return; }
    const cur = S.settings;
    const next = {...cur, status:t.status,
      date:t.status === 'none' || t.status === 'soon' ? '' : t.status === 'plan' ? t.date : (p => `${p.year}-${p.month}-${p.day}`)(berlinParts(Date.now())),
      time:t.status === 'plan' ? (t.time || '') : '',
      liveAt:t.status === 'live' ? Date.now() : 0};
    D.tsOpen = false; D.ts = null;
    ops.saveSettings(normSettings(next)); toast('Turnier-Status gespeichert.');
  } else if (f === 'news-add') {
    const n = D.news, title = str(n.title, 80), text = str(n.text, 600);
    if (!title && !text) { toast('Schreib eine Überschrift oder einen Text.'); return; }
    let at = 0;
    if (n.kind === 'countdown') {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(n.date || '')) { toast('Wähl ein Datum für den Countdown.'); return; }
      at = berlinToUtc(n.date, n.time || '00:00');
    }
    const nn = clone(S.news); nn.items.unshift({id:uid(), kind:n.kind, title, text, at, look:n.look === 'none' ? 'none' : 'sunset'});
    D.news = {kind:n.kind, title:'', text:'', date:n.date, time:n.time, look:n.look};
    D.newsOpen = false;
    ops.saveNews(nn); toast('Ankündigung veröffentlicht.');
  } else if (f === 'unlock') {
    tryUnlock(D.pwIn);
  } else if (f === 'game-save') {
    saveGameForm();
  } else if (f === 'draw-guess') {
    drawGuessSubmit();
  } else if (f === 'guest-player') {
    createGuestPlayer();
  } else if (f === 'vg-save') {
    vgSave();
  } else if (f === 'vgm-link') {
    vgmLinkSubmit();
  } else if (f === 'tk-add') {
    const tk = tkCopy();
    const text = str(D.tk.text, 160), img = tickImg(D.tk.img);
    if (!text && !img) { toast('Schreib einen Text oder wähl ein Bild.'); return; }
    if (tk.items.length >= TICKER_MAX) { toast(`Maximal ${TICKER_MAX} Einträge.`); return; }
    tk.items.push({id:uid(), text, img});
    D.tk = {text:'', img:''};
    ops.saveTicker(tk);
    toast('Eintrag hinzugefügt.');
  } else if (f === 'first-run') {
    createTournament(D.pwNew);
  } else if (f === 'admin-login') {
    const mail = str(D.alMail, 200), pw = String(D.alPw || '');
    if (!mail || !pw) { toast('Gib E-Mail und Passwort ein.'); return; }
    fauth.signInWithEmailAndPassword(mail, pw).then(() => { D.alPw = ''; closeModal(); }, e => {
      const c = e && e.code || '';
      toast(authMsg(c, 'E-Mail oder Passwort stimmt nicht.'));
    });
  } else if (f === 'wheel-add') {
    const label = str(D.wnew, 40);
    if (!label) { toast('Schreib zuerst ein Spiel in das Feld.'); return; }
    const w = clone(S.wheel);
    if (w.items.some(x => x.label.toLowerCase() === label.toLowerCase())) { toast(`„${label}“ ist schon im Rad.`); return; }
    if (w.items.length >= 40) { toast('Mehr als 40 Spiele passen nicht ins Rad.'); return; }
    w.items.push({id:uid(), label});
    D.wnew = '';
    ops.saveWheel(w);
    setTimeout(() => { const n = $('#w-new'); if (n) n.focus(); }, 30);
  } else if (f === 'add-question' && D.qq.cat === 4) {
    const qtext = str(D.qq.q, 300);
    if (!qtext) { toast('Schreib zuerst die Frage.'); return; }
    const n = v => Number(String(v ?? '').trim().replace(',', '.'));
    const min = n(D.qq.min), max = n(D.qq.max), ans = n(D.qq.ans), tol = n(D.qq.tol);
    if (![min, max, ans, tol].every(v => isFinite(v)) || String(D.qq.min).trim() === '' || String(D.qq.max).trim() === '' || String(D.qq.ans).trim() === '' || String(D.qq.tol).trim() === '') { toast('Füll Skala, richtige Zahl und Abweichung aus.'); return; }
    if (!(min < max)) { toast('„Skala von“ muss kleiner sein als „Skala bis“.'); return; }
    if (ans < min || ans > max) { toast('Die richtige Zahl muss auf der Skala liegen.'); return; }
    if (!(tol > 0)) { toast('Die erlaubte Abweichung muss größer als 0 sein.'); return; }
    const q = {id:uid(), q:qtext, type:'est', unit:str(D.qq.unit, 16), min, max, ans, tol, cat:4, lvl:D.qq.lvl, createdAt:Date.now(), cv:2};
    D.qq = {...D.qq, q:'', min:'', max:'', ans:'', tol:''};
    ops.addQuestion(q);
    toast(`Schätzfrage gespeichert: ${LEVELS[q.lvl]}.`);
  } else if (f === 'add-question') {
    const qtext = str(D.qq.q, 300);
    const raw = D.qq.a.map(a => str(a, 120));
    if (!qtext) { toast('Schreib zuerst die Frage.'); return; }
    if (!raw[D.qq.c]) { toast('Die als richtig markierte Antwort ist leer.'); return; }
    const filled = raw.map((a, i) => ({a, i})).filter(x => x.a);
    if (filled.length < 2) { toast('Gib mindestens zwei Antworten ein.'); return; }
    const q = {id:uid(), q:qtext, a:filled.map(x => x.a), c:filled.findIndex(x => x.i === D.qq.c), cat:D.qq.cat, lvl:D.qq.lvl, createdAt:Date.now(), cv:2};
    D.qq = {...D.qq, q:'', a:['', '', '', ''], c:0};
    ops.addQuestion(q);
    toast(`Frage gespeichert: ${CATS[q.cat]}, ${LEVELS[q.lvl]}.`);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.modal) { closeModal(); return; }
  if (!S.modal && S.tab === 'malen' && (e.ctrlKey || e.metaKey) && dcCan()) {
    const k = e.key.toLowerCase();
    if (k === 'z' && !e.shiftKey) { e.preventDefault(); dcUndo(); return; }
    if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); dcRedo(); return; }
  }
  if (S.modal || S.tab !== 'quiz' || !ctl()) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input', 'textarea', 'select'].includes(tag)) return;
  const q = S.quiz; if (!q || q.status !== 'running') return;
  const k = e.key.toLowerCase();
  const map = {'1':0, '2':1, '3':2, '4':3, a:0, b:1, c:2, d:3};
  const kc = q.board[q.cell] && q.board[q.cell].q;
  const myTurn = myPid() === q.turn;
  if (myTurn && q.phase === 'asking' && kc && kc.type === 'est' && k === 'enter') { e.preventDefault(); quizAnswerEst(estValue(q)); }
  else if (myTurn && q.phase === 'asking' && kc && kc.type !== 'est' && k in map && map[k] < kc.a.length) { e.preventDefault(); quizAnswer(map[k]); }
  else if (q.phase === 'ready' && k === 'z') { e.preventDefault(); quizRandom(); }
  else if ((k === 'enter' || k === ' ') && tag !== 'button' && q.phase === 'revealed') { e.preventDefault(); quizNext(); }
  else if (k === 'p') { if (q.phase === 'asking') quizPause(); else if (q.phase === 'paused') quizResume(); }
});
window.addEventListener('hashchange', () => { const h = (location.hash || '').slice(1); if (h && h !== S.tab) { S.tab = viewFor(h); render(); } });

function normNews(x) {
  if (!x || !Array.isArray(x.items)) return clone(DEFAULT_NEWS);
  return {items:x.items.map(it => ({
    id:str(it && it.id, 40) || uid(), kind:it && it.kind === 'countdown' ? 'countdown' : 'text',
    title:str(it && it.title, 80), text:str(it && it.text, 600), at:Number(it && it.at) || 0, img:str(it && it.img, 300000),
    look:it && it.look === 'none' ? 'none' : 'sunset'

}
function berlinParts(ms) {
  const f = new Intl.DateTimeFormat('en-GB', {timeZone:'Europe/Berlin', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'});
  const o = {}; f.formatToParts(new Date(ms)).forEach(p => { o[p.type] = p.value; });
  return o;
}
function berlinToUtc(dateStr, timeStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const [hh, mi] = (timeStr || '00:00').split(':').map(Number);
  const want = Date.UTC(y, m - 1, d, hh || 0, mi || 0);
  let guess = want;
  for (let k = 0; k < 2; k++) {
    const p = berlinParts(guess);
    const shown = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute);
    guess += want - shown;
  }
  return guess;
}
function fmtBerlin(ms) {
  return new Date(ms).toLocaleString(LOC, {timeZone:'Europe/Berlin', weekday:'long', day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit'}) + (EN ? '' : ' Uhr');

function cdParts(ms) {
  let s = Math.max(0, Math.floor(ms / 1000));
  const d = Math.floor(s / 86400); s -= d * 86400;
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60); s -= m * 60;
  return {d, h, m, s};
}
const pad2 = n => String(n).padStart(2, '0');
function cdInner(at) {

/* ---------- Quiz-Musik: MP3 bleibt auf diesem Gerät (IndexedDB) ---------- */
function idb() {
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open('turnier-media', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('files');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
}
async function idbDo(mode, fn) {
  const dbi = await idb();
  return new Promise((res, rej) => {
    const tx = dbi.transaction('files', mode); const st = tx.objectStore('files');
    const r = fn(st); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error);
  });
}
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const music = {el:null, url:'', name:'', size:0, ready:false, blocked:false, preview:false, resumeAt:0,
  on: lsGet('turnier-music-on', '1') === '1', auto: lsGet('turnier-music-auto', '1') === '1', vol: Number(lsGet('turnier-music-vol', '0.6')) || 0.6, failed:false};
function musicEl() {
  if (!music.el) { music.el = new Audio(); music.el.loop = true; music.el.preload = 'auto'; music.el.volume = music.vol; }
  return music.el;
}
async function loadMusic() {
  try {
    const rec = await idbDo('readonly', st => st.get('music'));
    if (rec && rec.blob) {
      if (music.url) URL.revokeObjectURL(music.url);
      music.url = URL.createObjectURL(rec.blob); music.name = rec.name || 'Musik'; music.size = rec.size || rec.blob.size;
      const el = musicEl(); el.src = music.url;
      if (music.resumeAt) { const t = music.resumeAt; el.addEventListener('loadedmetadata', () => { try { el.currentTime = t % (el.duration || 1e9); } catch (e) {} }, {once:true}); music.resumeAt = 0; }
      music.ready = true;
    } else { music.ready = false; music.name = ''; }
  } catch (e) { music.failed = true; }

}
async function saveMusicFile(file) {

  try {

}

setInterval(presBeat, PRES_MS);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { presBeat(); return; }
  if (S.mode === 'db' && db) db.collection('presence').doc(devId).delete().catch(() => {});

const ROOM_COLLS = ['players', 'points', 'questions', 'answers', 'pics', 'games', 'gvotes', 'dgal', 'lobbies'];
const ROOM_DOCS = ['settings', 'quiz', 'seen', 'gate', 'wheel', 'news', 'ticker', 'deco', 'draw', 'dwords'];
async function changePassword(pw) {
  pw = str(pw, 64);
  if (pw.length < 3) { toast('Das Passwort braucht mindestens 3 Zeichen.'); return; }
  const nr = await roomFor(pw);
  if (nr === room) { toast('Das ist schon das aktuelle Passwort.'); return; }
  const old = room;
  toast('Passwort wird geändert …');
  try {
    const ops2 = [];
    for (const c of ROOM_COLLS) {
      const snap = await fs.collection('rooms/' + old + '/' + c).get();
      snap.docs.forEach(d => ops2.push({path:'rooms/' + nr + '/' + c + '/' + d.id, data:d.data(), del:'rooms/' + old + '/' + c + '/' + d.id}));
    }
    for (const m of ROOM_DOCS) {
      const d = await fs.doc('rooms/' + old + '/meta/' + m).get();
      if (d.exists) ops2.push({path:'rooms/' + nr + '/meta/' + m, data:d.data(), del:'rooms/' + old + '/meta/' + m});
    }
    await fs.doc('rooms/' + nr).set({created:Date.now()});
    const chunks = []; let cur = [], size = 0;
    for (const o of ops2) {
      const n = JSON.stringify(o.data).length;
      if (cur.length && (cur.length >= 200 || size + n > 3000000)) { chunks.push(cur); cur = []; size = 0; }
      cur.push(o); size += n;
    }
    if (cur.length) chunks.push(cur);
    for (const ch of chunks) { const b = fs.batch(); ch.forEach(o => b.set(fs.doc(o.path), o.data)); await b.commit(); }
    await fs.doc('admin/config').set({room:nr, password:pw});
    // Der Dauerlink zeigt ab jetzt auf den neuen Server
    try { const iv = await fs.doc('admin/invite').get(); const ic = iv.exists ? str((iv.data() || {}).code, 64) : ''; if (ic) await fs.doc('invites/' + ic).update({r:nr}); } catch (e) {}
    await fs.doc('rooms/' + old).set({moved:true});
    for (let i = 0; i < ops2.length; i += 200) {
      const b = fs.batch();
      ops2.slice(i, i + 200).forEach(o => b.delete(fs.doc(o.del)));
      await b.commit();
    }
  } catch (e) { toast('Passwort ändern hat nicht geklappt. Versuch es nochmal.'); return; }
  S.secret = {password:pw}; storePass(pw); D.pwNew = '';
  connectRoom(nr);
  toast('Neues Passwort gilt. Alle müssen es einmal neu eingeben.');
}

/* ---------- Eigenen Spieler bearbeiten ----------
   Beim Erstellen bekommt ein Spieler einen geheimen Schlüssel, den nur dieses Gerät kennt. In der Datenbank steht nur
   sein SHA-256-Wert (kh). Zum Ändern zeigt das Gerät den Schlüssel vor (kp) und legt gleichzeitig einen neuen fest,
   der alte ist damit verbraucht. So kann nur dieses Gerät (und der Spielleiter) den Spieler ändern. */
const PKEYS = 'darkime-pkeys';
function pkeyAll() { try { return JSON.parse(lsGet(PKEYS, '{}')) || {}; } catch (e) { return {}; } }
const pkeyOf = id => pkeyAll()[id] || [];
function pkeyPut(id, keys) { const o = pkeyAll(); if (keys && keys.length) o[id] = keys; else delete o[id]; lsSet(PKEYS, JSON.stringify(o)); }
function newKey() { const a = new Uint8Array(24); crypto.getRandomValues(a); return [...a].map(b => b.toString(16).padStart(2, '0')).join(''); }
async function sha256hex(t) { const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join(''); }
/* own: Schlüssel liegt auf diesem Gerät. claim: älterer Gast-Spieler ohne Schlüssel, dieses Gerät ist dieser Spieler. */
function ownEdit(p) {
  if (!p || S.admin || S.mode !== 'db') return '';
  if (p.kh && pkeyOf(p.id).length) return 'own';
  if (p.byGuest && !p.kh && lsGet('turnier-me', '') === p.id) return 'claim';
  return '';
}
async function saveOwnPlayer(d) {
  const old = playerById(d.id), how = ownEdit(old);
  if (!how || !db) { toast('Diesen Spieler kann nur der Spielleiter ändern.'); return; }
  const name = str(d.name, 40);
  const fields = {name, color:d.color || old.color, avatar:await shrinkImg(d.avatar || '', 120, .7), ...styleFields(d)};
  const ref = db.collection('players').doc(d.id);
  try {
    let keys = pkeyOf(d.id);
    if (how === 'claim') {
      const k = newKey(); pkeyPut(d.id, [k]);
      await ref.update({kh:await sha256hex(k)});
      keys = [k];
    }
    // Neuen Schlüssel vorher merken: Kommt die Antwort nicht an, obwohl gespeichert wurde, klappt es beim nächsten Mal damit.
    const next = newKey();
    let ok = false;
    for (const k of keys) {
      pkeyPut(d.id, [k, next]);
      try { await ref.update({...fields, kp:k, kh:await sha256hex(next)}); ok = true; break; }
      catch (e) { if (!e || e.code !== 'permission-denied') throw e; }
    }
    if (!ok) { pkeyPut(d.id, keys); toast('Diesen Spieler kann nur der Spielleiter ändern.'); return; }
    pkeyPut(d.id, [next]);
    await pbnSave(d);
    closeModal(); toast('Gespeichert.');
  } catch (e) { toast('Speichern hat nicht geklappt. Prüfe die Verbindung und versuch es nochmal.'); }
}

const DEFAULT_DECO = {bgm:true, flyLobby:true, flySite:true};
const PICS_MAX = 20;
function normDeco(x) { x = x || {}; return {bgm:x.bgm !== false, flyLobby:x.flyLobby !== false, flySite:x.flySite !== false}; }
function picImg(img) { return typeof img === 'string' && img.length < 140000 && /^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(img) ? img : ''; }
function normPic(id, x) { x = x || {}; return {id, img:picImg(x.img), ts:Number(x.ts) || 0}; }
async function toPic(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const w0 = img.naturalWidth, h0 = img.naturalHeight;
    if (!w0 || !h0) throw new Error('empty');
    for (const max of [360, 280, 200]) {
      const sc = Math.min(1, max / Math.max(w0, h0));
      const w = Math.max(1, Math.round(w0 * sc)), h = Math.max(1, Math.round(h0 * sc));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      let out = c.toDataURL('image/webp', .82);
      if (!/^data:image\/webp/.test(out)) out = c.toDataURL('image/png');
      if (out.length > 110000) out = c.toDataURL('image/jpeg', .8);
      if (out.length <= 110000) return out;
    }
    throw new Error('big');
  } finally { URL.revokeObjectURL(url); }
}
function flyHTML(where) {

    const size = Math.round(lobby ? 70 + r() * 90 : 48 + r() * 42);
    const dur = Math.round((lobby ? 15 : 34) + r() * (lobby ? 14 : 22));
    const delay = -(r() * dur).toFixed(1);
    const y = Math.round(lobby ? 6 + r() * 74 : 8 + r() * 80);
    const rot = Math.round(r() * 40 - 20), spin = Math.round(rot + (r() < .5 ? -1 : 1) * (60 + r() * 200));
    h += `<img class="fly ${r() < .5 ? 'rev' : ''}" src="${p.img}" alt="" style="--s:${size}px;--y:${y}vh;--d:${dur}s;--dl:${delay}s;--r0:${rot}deg;--r1:${spin}deg">`;
  }
