<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alans Turnier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Pixelify+Sans:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style id="app-style">
:root{
  /* Layout: retro arcade cabinet at night. Coin "jackpot" + pixel podium on top, highscore table and log below; tabs work like a game menu with a blinking cursor. Pixel-notched panels everywhere. One dark world on purpose. */
  --bg:#0f0b1e;
  --bg-2:#150f2b;
  --panel:#1c1537;
  --panel-2:#2a1f4f;
  --edge:#463a80;
  --ink:#f5f2ff;
  --muted:#aaa1d2;
  --coin:#ffcf3f;
  --coin-dk:#b57400;
  --hp:#ff4f6d;
  --xp:#39d6f2;
  --ok:#4ff08f;
  --shadow:#07050f;
  --silver:#d3dbea;
  --bronze:#e5925a;
  --pixel:"Press Start 2P","Courier New",monospace;
  --display:"Pixelify Sans","Press Start 2P",system-ui,sans-serif;
  --body:"Chakra Petch",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* aliases used by page code */
  --gold:var(--coin);--bad:var(--hp);--good:var(--ok);--surface:var(--panel);--surface-2:var(--panel-2);--line:var(--edge);--gold-soft:rgba(255,207,63,.14);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;background:var(--bg)}
body{margin:0;min-height:100%;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 520px at 50% -220px,rgba(57,214,242,.14),transparent 70%),
    radial-gradient(900px 600px at 105% 110%,rgba(255,79,109,.10),transparent 70%),
    linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px) 0 0/24px 24px,
    linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px) 0 0/24px 24px,
    var(--bg);
  background-attachment:fixed;}
body::before{content:"";position:fixed;left:0;top:0;width:2px;height:2px;pointer-events:none;z-index:0;background:transparent;
  box-shadow:80px 120px #fff,220px 60px #9be7ff,410px 190px #fff,560px 90px #ffd96b,730px 160px #fff,900px 70px #9be7ff,1060px 210px #fff,1230px 110px #ffd96b,1390px 180px #fff,1540px 60px #9be7ff,
    140px 420px #fff,330px 520px #ffd96b,620px 460px #fff,840px 560px #9be7ff,1010px 430px #fff,1290px 520px #fff,1470px 450px #ffd96b,
    60px 760px #9be7ff,280px 860px #fff,520px 720px #fff,760px 900px #ffd96b,980px 780px #fff,1180px 880px #9be7ff,1420px 760px #fff,1600px 900px #fff;
  animation:twinkle 3.2s steps(2) infinite;opacity:.55}
@keyframes twinkle{50%{opacity:.2}}
body.locked{overflow:hidden}
main,header{position:relative;z-index:1}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px dashed var(--xp);outline-offset:4px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}
.ico{display:inline-block;vertical-align:middle;flex:none}
.spin{animation:coinspin 1.4s steps(8) infinite}
@keyframes coinspin{0%,100%{transform:scaleX(1)}25%{transform:scaleX(.35)}50%{transform:scaleX(-1)}75%{transform:scaleX(-.35)}}
@keyframes blink{50%{opacity:0}}
@keyframes bob{50%{transform:translateY(-4px)}}

/* Pixel panel: notched corners + hard drop shadow */
.px,.card,.stage,.board,.feed,.pcard,.qcard,.turn,.modal,.vault{--e:var(--edge);background:var(--panel);margin:4px;
  box-shadow:0 -4px 0 0 var(--e),0 4px 0 0 var(--e),-4px 0 0 0 var(--e),4px 0 0 0 var(--e),0 12px 0 0 rgba(0,0,0,.42)}

/* Header */
header.top{position:sticky;top:0;z-index:20;background:rgba(13,9,27,.93);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 0 var(--shadow),0 8px 0 rgba(70,58,128,.45)}
.top-inner{display:flex;align-items:center;gap:20px;min-height:70px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-txt{display:flex;flex-direction:column;line-height:1;min-width:0}
.brand b{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:3px 3px 0 var(--shadow)}
.brand small{color:var(--muted);font-size:13px;margin-top:6px}
.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;padding:12px 9px;font-family:var(--display);font-weight:700;font-size:17px;text-transform:uppercase;color:var(--muted);white-space:nowrap;letter-spacing:.03em}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--coin);text-shadow:2px 2px 0 var(--shadow)}
.tab[aria-selected="true"]::before{content:"▶";font-size:.7em;margin-right:6px;display:inline-block;animation:blink 1s steps(1) infinite}
.pill{font-family:var(--pixel);font-size:9px;padding:7px 10px;background:var(--bg-2);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:8px;text-transform:uppercase;box-shadow:0 -2px 0 var(--edge),0 2px 0 var(--edge),-2px 0 0 var(--edge),2px 0 0 var(--edge);margin:2px}
.pill::before{content:"";width:8px;height:8px;background:var(--muted)}
.pill.is-ok::before{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pill.is-warn::before{background:var(--coin)}
.gatebar{background:rgba(255,255,255,.025)}
.gb-inner{display:flex;align-items:center;gap:10px 14px;min-height:54px;flex-wrap:wrap;padding-top:8px;padding-bottom:10px}
.gb-dot{width:12px;height:12px;background:var(--hp);flex:none;box-shadow:0 0 10px var(--hp);animation:blink 1.2s steps(1) infinite}
.gatebar.is-open .gb-dot{background:var(--ok);box-shadow:0 0 10px var(--ok);animation:none}
.gatebar.is-cd .gb-dot{background:var(--coin);box-shadow:0 0 10px var(--coin)}
.gb-text{font-size:14px;flex:1 1 240px;color:var(--muted)}
.gb-text b{color:var(--ink);font-family:var(--display);font-size:16px;text-transform:uppercase;letter-spacing:.03em;margin-right:4px}
.gb-actions{display:flex;gap:8px;flex-wrap:wrap}
.gb-pub{display:inline-block;margin-left:8px;font-family:var(--pixel);font-size:8px;text-transform:uppercase;color:var(--ok);vertical-align:1px}
.gb-pub.pending{color:var(--coin)}.gb-pub.off{color:var(--hp)}
@media (max-width:680px){
  .top-inner{gap:4px 12px;padding-top:10px}
  .brand b{font-size:24px}
  .tabs{order:3;width:100%;margin-left:-12px}
  .tabs{gap:0}
  .tab{font-size:14px;padding:10px 6px;letter-spacing:0}
  .tab[aria-selected="true"]::before{margin-right:4px}
  .pill{margin-left:auto}
}

/* Buttons and chips */
.btn{--e:var(--shadow);--f:var(--panel-2);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 16px;min-height:44px;margin:3px;border:0;background:var(--f);color:var(--ink);
  font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.03em;text-transform:uppercase;line-height:1.1;
  box-shadow:0 -3px 0 0 var(--e),0 3px 0 0 var(--e),-3px 0 0 0 var(--e),3px 0 0 0 var(--e),inset 0 -5px 0 0 rgba(0,0,0,.3),inset 0 3px 0 0 rgba(255,255,255,.14);
  transition:transform .06s,filter .15s}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(3px);box-shadow:0 -3px 0 0 var(--e),0 3px 0 0 var(--e),-3px 0 0 0 var(--e),3px 0 0 0 var(--e),inset 0 -2px 0 0 rgba(0,0,0,.3)}
.btn-gold{--f:var(--coin);color:#2b1a00}
.btn-ghost{--f:transparent;--e:var(--edge);box-shadow:0 -3px 0 0 var(--e),0 3px 0 0 var(--e),-3px 0 0 0 var(--e),3px 0 0 0 var(--e)}
.btn-sm{min-height:36px;padding:4px 12px;font-size:14px}
.btn-lg{min-height:58px;font-size:21px;padding:10px 24px}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:grayscale(.6);transform:none}
.btn.danger{color:var(--hp)}
.link{background:none;border:0;padding:0;color:var(--coin);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;border:0;margin:2px;background:var(--bg-2);padding:6px 14px;font-weight:600;font-size:14px;min-height:38px;
  box-shadow:0 -2px 0 var(--edge),0 2px 0 var(--edge),-2px 0 0 var(--edge),2px 0 0 var(--edge)}
.chip:hover{background:var(--panel-2)}
.chip[aria-pressed="true"]{background:rgba(255,207,63,.14);color:var(--coin);box-shadow:0 -2px 0 var(--coin),0 2px 0 var(--coin),-2px 0 0 var(--coin),2px 0 0 var(--coin)}
.chip[aria-pressed="true"]::before{content:"▶";font-size:9px}
.chip.pchip{padding-left:5px}
.chip .dot{width:9px;height:9px;background:var(--lc)}
.x{background:none;border:0;color:var(--muted);font-family:var(--pixel);font-size:14px;line-height:1;width:34px;height:34px;flex:none}
.x:hover{background:var(--panel-2);color:var(--hp)}

/* Inputs */
.input{width:calc(100% - 6px);margin:3px;background:#0b0817;border:0;padding:10px 12px;min-height:44px;outline:none;font-family:var(--body);font-size:16px;
  box-shadow:0 -3px 0 var(--edge),0 3px 0 var(--edge),-3px 0 0 var(--edge),3px 0 0 var(--edge)}
.input:focus{box-shadow:0 -3px 0 var(--coin),0 3px 0 var(--coin),-3px 0 0 var(--coin),3px 0 0 var(--coin)}
textarea.input{resize:vertical;min-height:76px}
.input.mini{width:90px}
.field{display:flex;flex-direction:column;gap:8px}
.lbl,.field>label{font-family:var(--pixel);font-size:10px;line-height:1.6;color:var(--xp);text-transform:uppercase;letter-spacing:.04em}
.field small{color:var(--muted);font-size:13px}

/* Avatars: square portraits */
.av{flex:none;display:inline-grid;place-items:center;font-family:var(--pixel);color:#160f2c;background:var(--c,#888);overflow:hidden;line-height:1;text-transform:uppercase;box-shadow:0 0 0 3px var(--shadow)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.ghost{background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,255,255,.05) 6px 12px);box-shadow:0 0 0 3px var(--edge)}

/* Sections */
.section{margin:30px 0 70px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h2.h{font-family:var(--display);font-weight:700;font-size:34px;text-transform:uppercase;letter-spacing:.03em;line-height:1;text-shadow:3px 3px 0 var(--shadow);display:flex;align-items:center;flex-wrap:wrap;gap:4px 0}
h2.h::before{content:"";width:12px;height:12px;background:var(--coin);box-shadow:4px 4px 0 var(--hp);margin-right:16px;flex:none}
h2.h .count{font-family:var(--pixel);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0;margin-left:14px;text-shadow:none}
.card{padding:22px}
.eyebrow{font-family:var(--pixel);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--xp)}

/* Money */
.mn{font-family:var(--pixel)}
.cur{font-family:var(--display);font-weight:700;margin-left:.18em;font-size:1.15em}

/* Hero: jackpot + podium */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:26px;margin-top:30px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.vault{--e:var(--coin);position:relative;padding:24px 24px 20px;display:flex;flex-direction:column;gap:16px;overflow:hidden;
  background:linear-gradient(180deg,#2c1d07,var(--panel) 62%)}
.vault::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 2px,transparent 2px 4px)}
.vault-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.vault-top .eyebrow{color:var(--coin);font-size:12px}
.prize.long{font-size:clamp(20px,3.3vw,38px)!important}
.prize{color:var(--coin);font-size:clamp(30px,4.6vw,54px);line-height:1.15;text-shadow:4px 4px 0 var(--coin-dk),8px 8px 0 rgba(0,0,0,.4);white-space:nowrap;position:relative;z-index:1}
.split{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;position:relative;z-index:1}
.split li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:2px dashed rgba(255,255,255,.08)}
.split li b{font-size:12px;color:var(--ink);white-space:nowrap}
.split .pct{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.split.many{display:grid;grid-template-columns:1fr 1fr;column-gap:22px}
.split.many li{grid-template-columns:28px 1fr auto}
.split.many .pct{display:none}
@media (max-width:420px){.split.many{grid-template-columns:1fr}}
.medal{width:26px;height:26px;display:inline-grid;place-items:center;font-family:var(--pixel);font-size:10px;color:#1a1030;flex:none;vertical-align:middle;box-shadow:0 0 0 2px var(--shadow)}
.m1{background:var(--coin)}.m2{background:var(--silver)}.m3{background:var(--bronze)}
.m4{background:var(--panel-2);color:var(--muted)}
.vault .link{position:relative;z-index:1}
.stage{padding:20px 20px 0;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.stage-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stage-head h2.h{font-size:28px}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:12px;margin-top:auto}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pod .crown{animation:bob 1.2s steps(2) infinite;margin-bottom:-2px}
.pod-name{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:6px}
.pod-pts{color:var(--muted);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.pod-block{width:100%;margin-top:6px;display:flex;justify-content:center;padding-top:12px;font-family:var(--pixel);font-size:26px;line-height:1;color:var(--muted);
  background:linear-gradient(rgba(0,0,0,.18) 2px,transparent 2px) 0 0/100% 16px,var(--panel-2);box-shadow:inset 0 6px 0 var(--edge),inset 6px 0 0 rgba(255,255,255,.05)}
.pos1 .pod-block{height:136px;color:var(--coin);box-shadow:inset 0 6px 0 var(--coin),inset 6px 0 0 rgba(255,255,255,.06);background:linear-gradient(rgba(0,0,0,.18) 2px,transparent 2px) 0 0/100% 16px,#3a2a12}
.pos2 .pod-block{height:100px;color:var(--silver);box-shadow:inset 0 6px 0 var(--silver)}
.pos3 .pod-block{height:74px;color:var(--bronze);box-shadow:inset 0 6px 0 var(--bronze)}
.pos1 .av{box-shadow:0 0 0 4px var(--coin),0 0 0 7px var(--shadow),0 0 30px rgba(255,207,63,.35)}
.pos2 .av{box-shadow:0 0 0 4px var(--silver),0 0 0 7px var(--shadow)}
.pos3 .av{box-shadow:0 0 0 4px var(--bronze),0 0 0 7px var(--shadow)}
.pod.empty .av{box-shadow:0 0 0 3px var(--edge)}
.pod.empty .pod-name{color:var(--muted)}
.prize-tag{display:inline-flex;align-items:center;gap:6px;font-size:10px;color:var(--coin);background:rgba(255,207,63,.12);padding:5px 8px;white-space:nowrap;box-shadow:0 0 0 2px rgba(255,207,63,.35)}
.prize-tag small{font-family:var(--body);font-size:11px;color:var(--muted);margin-left:2px}

/* Highscore + log */
.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:26px;margin:36px 0 70px}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.board{overflow:hidden;padding:4px 0}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;align-items:center;gap:14px;padding:12px 18px;border-top:2px dashed rgba(255,255,255,.07)}
.board.is-admin .row{grid-template-columns:52px minmax(0,1fr) auto auto 44px}
.row:first-child{border-top:0}
.row.r1{background:linear-gradient(90deg,rgba(255,207,63,.10),transparent 70%)}
.rank{font-family:var(--pixel);font-size:16px;color:var(--muted);text-align:center;line-height:1}
.row.r1 .rank{color:var(--coin);text-shadow:2px 2px 0 var(--coin-dk)}.row.r2 .rank{color:var(--silver)}.row.r3 .rank{color:var(--bronze)}
.who{display:flex;align-items:center;gap:14px;min-width:0}
.who-txt{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.who .nm{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1}
.xpbar{display:block;height:8px;max-width:240px;background:#0b0817;box-shadow:0 0 0 2px var(--shadow)}
.xpbar.wide{max-width:none;width:100%}
.xpbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--xp) 0 6px,#1d9cb8 6px 8px);transition:width .4s steps(8)}
.row.r1 .xpbar i,.pcard.is-top .xpbar i{background:repeating-linear-gradient(90deg,var(--coin) 0 6px,var(--coin-dk) 6px 8px)}
.pts{font-family:var(--pixel);font-size:20px;line-height:1;text-align:right;min-width:3ch;white-space:nowrap}
.pts small{font-family:var(--display);font-size:13px;color:var(--muted);margin-left:6px;text-transform:uppercase}
.plus{width:40px;height:40px;min-height:40px;padding:0;font-size:22px}
@media (max-width:520px){
  .row{gap:10px;padding:10px 12px;grid-template-columns:30px minmax(0,1fr) auto}
  .board.is-admin .row{grid-template-columns:30px minmax(0,1fr) auto 44px}
  .row .prize-col{grid-column:2;grid-row:2;justify-self:start;margin-left:58px}
  .row .prize-col:empty{display:none}
  .rank{font-size:12px}
  .pts{font-size:16px}
  .who .nm{font-size:18px}
}
.feed{list-style:none;margin:4px;padding:6px 0}
.ev{display:grid;grid-template-columns:52px 28px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 14px}
.feed.is-admin .ev{grid-template-columns:52px 28px minmax(0,1fr) auto 34px}
.delta{font-family:var(--pixel);font-size:13px;text-align:right}
.delta.up{color:var(--ok)}.delta.down{color:var(--hp)}
.ev-txt{min-width:0;line-height:1.25}
.ev-txt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--display);font-weight:700;text-transform:uppercase}
.ev-txt span{font-size:13px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev time{font-family:var(--pixel);font-size:8px;color:var(--muted)}
.empty-box{padding:30px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:14px}
.empty-box strong{color:var(--ink);font-family:var(--display);font-size:22px;text-transform:uppercase}

/* Players: character select */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:26px 22px}
.pcard{position:relative;padding:26px 18px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;transition:transform .12s}
.pcard:not(.add):hover{--e:var(--coin);transform:translateY(-4px)}
.ptag{position:absolute;top:10px;left:12px;font-family:var(--pixel);font-size:9px;color:var(--xp)}
.pcrown{position:absolute;top:6px;right:10px}
.pcrown .crown{animation:bob 1.2s steps(2) infinite}
.pcard .pc-av{box-shadow:0 0 0 4px var(--shadow),0 0 0 7px var(--edge);margin:8px 0 6px}
.pcard.is-top .pc-av{box-shadow:0 0 0 4px var(--shadow),0 0 0 7px var(--coin)}
.pc-name{font-family:var(--display);font-weight:700;font-size:28px;text-transform:uppercase;line-height:1;max-width:100%;overflow-wrap:anywhere;text-shadow:3px 3px 0 var(--shadow)}
.pc-meta{color:var(--muted);font-size:14px;font-weight:600}
.pc-actions{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.pcard.add{--e:var(--edge);align-items:stretch;text-align:left;background:repeating-linear-gradient(45deg,var(--panel) 0 14px,#201840 14px 28px)}
.pcard.add .ptag{color:var(--coin)}

details summary{cursor:pointer;font-weight:700;color:var(--coin)}

.turn{--e:var(--coin);padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;background:linear-gradient(180deg,#2a1d0a,var(--panel) 55%)}

}
.qcard{padding:24px;display:flex;flex-direction:column;gap:20px;min-height:400px}
.qhead{display:flex;flex-direction:column;gap:12px}

.cat{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:15px;text-transform:uppercase;color:#1a1030;background:var(--xp);padding:4px 10px;box-shadow:0 0 0 2px var(--shadow)}
.lvltag{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:15px;text-transform:uppercase;color:var(--ink);background:var(--panel-2);padding:4px 10px;box-shadow:0 0 0 2px var(--lc)}
.lvltag .bstars{display:inline-flex;gap:1px}
.qtext{font-size:clamp(23px,2.7vw,36px);font-weight:700;line-height:1.2;margin:0}
.blur{filter:blur(10px);user-select:none}
.hp{display:flex;align-items:center;gap:12px}
.hp-lbl{font-family:var(--pixel);font-size:10px;color:var(--ok)}
.hp-bar{flex:1;height:22px;background:#0b0817;box-shadow:0 0 0 3px var(--shadow),0 0 0 6px var(--edge);overflow:hidden;margin:0 6px}
.hp-bar .fill{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--ok) 0 10px,#2dbb69 10px 12px);box-shadow:inset 0 4px 0 rgba(255,255,255,.25);transition:width .2s linear}
.hp .num{font-family:var(--pixel);font-size:24px;min-width:3ch;text-align:right;color:var(--ok)}
.hp.mid .hp-lbl,.hp.mid .num{color:var(--coin)}
.hp.mid .fill{background:repeating-linear-gradient(90deg,var(--coin) 0 10px,var(--coin-dk) 10px 12px)}

.hp.low .fill{background:repeating-linear-gradient(90deg,var(--hp) 0 10px,#c42746 10px 12px)}
.hp.low .num{animation:blink .6s steps(1) infinite}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:600px){.answers{grid-template-columns:1fr}}
.ans{--e:var(--edge);display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;margin:3px;border:0;background:var(--panel-2);font-size:19px;font-weight:700;min-height:66px;
  box-shadow:0 -3px 0 var(--e),0 3px 0 var(--e),-3px 0 0 var(--e),3px 0 0 var(--e),inset 0 -5px 0 rgba(0,0,0,.25);transition:transform .06s}

.verdict.good{color:var(--ok);background:rgba(79,240,143,.10);box-shadow:0 0 0 3px var(--ok)}

/* Quiz board */
.boardcard{gap:18px}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

.bcat{font-family:var(--display);font-weight:700;font-size:17px;text-transform:uppercase;line-height:1.05;text-align:center;padding:10px 6px;background:var(--xp);color:#120c26;display:flex;align-items:center;justify-content:center;min-height:68px;overflow-wrap:break-word;min-width:0;box-shadow:0 0 0 3px var(--shadow),inset 0 -5px 0 rgba(0,0,0,.2)}

  box-shadow:0 0 0 3px var(--shadow),inset 0 -6px 0 var(--lc),inset 0 4px 0 rgba(255,255,255,.1);transition:transform .08s}

/* Lobby / title screen */
.gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:40px 28px;overflow:auto;transition:transform .9s steps(9);
  background:
    radial-gradient(700px 460px at 50% 40%,rgba(57,214,242,.16),transparent 70%),
    linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px) 0 0/24px 24px,
    linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px) 0 0/24px 24px,
    var(--bg)}
.gate::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 4px)}
.gate::after{content:"";position:fixed;inset:14px;pointer-events:none;box-shadow:0 -6px 0 var(--coin),0 6px 0 var(--coin),-6px 0 0 var(--coin),6px 0 0 var(--coin),inset 0 0 120px rgba(0,0,0,.6)}
.gate.lift{transform:translateY(-105%)}
.gate-in{position:relative;z-index:1;width:min(640px,100%);display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px}
.gate-title{font-family:var(--display);font-weight:700;font-size:clamp(46px,9vw,96px);line-height:.92;text-transform:uppercase;color:var(--coin);
  text-shadow:4px 4px 0 var(--hp),8px 8px 0 var(--shadow);overflow-wrap:anywhere}
.gate-sub{margin:0;font-family:var(--pixel);font-size:clamp(11px,2vw,14px);color:var(--ink);text-transform:uppercase;line-height:1.6}
.load{width:100%;height:26px;background:#0b0817;box-shadow:0 0 0 3px var(--shadow),0 0 0 6px var(--ink);margin-top:14px;padding:4px}
.load i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--coin) 0 14px,transparent 14px 18px);transition:width .3s steps(3)}
.load-meta{width:100%;display:flex;justify-content:space-between;gap:12px;font-family:var(--pixel);font-size:10px;color:var(--muted);text-transform:uppercase;margin-top:4px}
.load-meta b{color:var(--coin);font-weight:400}
.press{margin:8px 0 0;font-family:var(--pixel);font-size:clamp(10px,1.8vw,13px);color:var(--xp);text-transform:uppercase;animation:blink 1s steps(1) infinite;line-height:1.6}
.gate-tip{min-height:3.2em;color:var(--ink);font-weight:600;margin:4px 0 0;font-size:18px;max-width:44ch}
.gate-note{color:var(--muted);font-size:14px;margin:0}
.ready{margin:0;font-family:var(--pixel);font-size:clamp(14px,3vw,22px);color:var(--xp);text-transform:uppercase}
.cd{font-family:var(--pixel);font-size:clamp(110px,26vw,220px);line-height:1;color:var(--coin);text-shadow:8px 8px 0 var(--hp),16px 16px 0 var(--shadow);animation:pop .9s steps(5) both}
.cd.go{font-family:var(--display);font-weight:700;font-size:clamp(110px,24vw,220px);text-transform:uppercase;color:var(--ok);text-shadow:8px 8px 0 var(--xp),16px 16px 0 var(--shadow)}
@keyframes pop{0%{transform:scale(1.8);opacity:0}30%{transform:scale(1);opacity:1}100%{transform:scale(.94);opacity:.95}}
.preview-end{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:2}
.preview-end:active{transform:translateX(-50%) translateY(3px)}

/* Modal + toast + loading */
.scrim{position:fixed;inset:0;background:rgba(5,3,12,.8);display:grid;place-items:center;z-index:150;padding:18px;overflow:auto}
.modal{--e:var(--ink);width:min(600px,calc(100% - 8px));max-height:calc(100% - 24px);overflow:auto;padding:24px;display:flex;flex-direction:column;gap:20px;background:var(--panel)}
.m-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.m-head h2{font-family:var(--display);font-weight:700;font-size:32px;text-transform:uppercase;line-height:1;text-shadow:3px 3px 0 var(--shadow)}
.m-foot{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.m-text{margin:0;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);background:var(--panel);color:var(--ink);font-weight:700;padding:12px 18px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s steps(3);z-index:170;max-width:calc(100% - 40px);display:flex;align-items:center;gap:12px;
  box-shadow:0 -3px 0 var(--coin),0 3px 0 var(--coin),-3px 0 0 var(--coin),3px 0 0 var(--coin),0 10px 0 rgba(0,0,0,.45)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{display:flex;flex-direction:column;align-items:center;gap:18px;padding:110px 0;color:var(--muted);font-family:var(--pixel);font-size:11px;text-transform:uppercase}
.banner{margin-top:20px;background:rgba(255,207,63,.10);color:var(--ink);padding:10px 14px;font-size:14px;box-shadow:0 0 0 3px rgba(255,207,63,.5)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* TV show waiting screen */
.gate.tv::after{inset:0;box-shadow:inset 0 0 200px rgba(0,0,0,.85)}
.gate.tv{padding:110px 24px 120px}
.spot{position:fixed;bottom:-10vh;width:70vmax;height:130vh;pointer-events:none;transform-origin:50% 100%;
  background:conic-gradient(from -12deg at 50% 100%,transparent 0deg,var(--beam) 7deg,var(--beam) 17deg,transparent 24deg,transparent 360deg);
  animation:sweep 7s ease-in-out infinite alternate;filter:blur(2px)}
.spot-l{--beam:rgba(255,214,110,.17);left:-35vmax;animation-delay:-1s}
.spot-r{--beam:rgba(57,214,242,.15);right:-35vmax;animation-delay:-4.5s;animation-direction:alternate-reverse}
@keyframes sweep{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
.tv-top{position:fixed;top:22px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:2}
.onair{display:inline-flex;align-items:center;gap:10px;font-family:var(--pixel);font-size:11px;text-transform:uppercase;color:#fff;background:#3a0d18;padding:9px 12px;box-shadow:0 0 0 3px var(--hp),0 0 24px rgba(255,79,109,.35)}
.onair i{width:12px;height:12px;background:var(--hp);box-shadow:0 0 12px var(--hp);animation:blink 1s steps(1) infinite}
.onair.on{background:var(--hp)}
.onair.on i{background:#fff;box-shadow:0 0 12px #fff}
.tv-bug{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:16px;color:var(--ink);opacity:.9}
.tv-bug b{font-family:var(--pixel);font-size:12px;font-weight:400;color:var(--coin);margin-left:4px}
.tv-plate{font-family:var(--pixel);font-size:clamp(10px,1.6vw,13px);line-height:1.6;text-transform:uppercase;color:#1a1030;background:var(--coin);padding:10px 16px;box-shadow:0 0 0 3px var(--shadow),6px 6px 0 var(--hp);max-width:100%;overflow-wrap:anywhere}
.tv-title{font-family:var(--display);font-weight:700;font-size:clamp(58px,11vw,132px);line-height:.88;text-transform:uppercase;color:#fff;margin-top:14px;
  text-shadow:4px 4px 0 var(--coin),8px 8px 0 var(--hp),12px 12px 0 var(--shadow);animation:tvpulse 2.6s ease-in-out infinite}
@keyframes tvpulse{50%{transform:scale(1.025)}}
.tv-sub{color:var(--muted);font-size:18px;max-width:40ch;margin:10px 0 0}
.ticker{position:fixed;left:0;right:0;bottom:28px;display:flex;align-items:stretch;height:50px;z-index:2;background:rgba(10,7,22,.94);box-shadow:0 -3px 0 var(--coin),0 3px 0 var(--coin)}
.ticker-tag{flex:none;display:flex;align-items:center;padding:0 16px;background:var(--hp);color:#fff;font-family:var(--pixel);font-size:11px;text-transform:uppercase;white-space:nowrap}
.ticker-track{flex:1;overflow:hidden;display:flex;align-items:center}
.ticker-move{display:inline-flex;white-space:nowrap;gap:22px;align-items:center;padding-left:22px;font-weight:600;font-size:17px;animation:ticker 40s linear infinite}
.ticker-move i{font-style:normal;color:var(--coin);font-family:var(--pixel);font-size:10px}
@keyframes ticker{to{transform:translateX(-50%)}}
.gate.tv .preview-end{bottom:100px}
@media (max-width:560px){
  .tv-name{display:none}
  .onair{font-size:9px;padding:7px 9px}
  .ticker{height:44px;bottom:16px}
  .ticker-tag{font-size:9px;padding:0 10px}
  .ticker-move{font-size:15px}
  .gate.tv .preview-end{bottom:80px}
}

/* Zufallsrad */
.wheel-layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:26px;align-items:start}
@media (max-width:900px){.wheel-layout{grid-template-columns:1fr}}
.wheel-stage{display:flex;flex-direction:column;align-items:center;gap:20px;padding:26px 30px 26px 20px}
.wheel-wrap{position:relative;width:min(500px,100%);aspect-ratio:1}
.wheel{width:100%;height:100%;display:block;filter:drop-shadow(0 12px 0 rgba(0,0,0,.45))}
.wheel text{font-family:var(--display);font-weight:700;fill:#160f2c}
.wheel .win{stroke:#fff;stroke-width:4}
.wheel .bulb{fill:var(--coin)}
.wheel .bulb.b0{animation:blink 1.2s steps(1) infinite}
.wheel .bulb.b1{fill:#fff;animation:blink 1.2s steps(1) infinite .6s}
.wheel-wrap.spinning .bulb{animation-duration:.24s}
.wheel-wrap.spinning .bulb.b1{animation-delay:.12s}
.wheel-pointer{position:absolute;right:-16px;top:50%;transform:translateY(-50%);z-index:2;
  filter:drop-shadow(3px 0 0 #07050f) drop-shadow(-3px 0 0 #07050f) drop-shadow(0 3px 0 #07050f) drop-shadow(0 6px 0 rgba(0,0,0,.4))}
.wheel-hub{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.wheel-msg{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;min-height:80px}
.wm-big{font-family:var(--display);font-weight:700;font-size:clamp(28px,4.2vw,46px);text-transform:uppercase;line-height:1;text-shadow:3px 3px 0 var(--shadow);overflow-wrap:anywhere}
.wheel-msg.win .wm-big{color:var(--coin);text-shadow:3px 3px 0 var(--hp),6px 6px 0 var(--shadow);animation:popsm .4s steps(3) both}
.wheel-btn{min-width:260px}
.wheel-side{display:flex;flex-direction:column;gap:18px}
.wadd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wadd .input{flex:1 1 160px;width:auto;min-width:0}
.witems{display:flex;flex-wrap:wrap;gap:10px}
.wchip{display:inline-flex;align-items:center;gap:8px;background:var(--bg-2);padding:4px 4px 4px 10px;font-weight:600;box-shadow:0 0 0 2px var(--edge);margin:2px;min-height:36px}
.wchip i{width:12px;height:12px;background:var(--c);flex:none;box-shadow:0 0 0 2px var(--shadow)}
.wchip.is-win{box-shadow:0 0 0 2px var(--coin);color:var(--coin)}
.wchip .x{width:28px;height:28px;font-size:11px}
.worder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.worder li{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:19px;text-transform:uppercase}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--coin);flex:none}
.tab .t-short{display:none}
@media (max-width:680px){.tab .t-long{display:none}.tab .t-short{display:inline}}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;padding:30px 16px 44px;color:var(--muted,#a99bc4);font-size:13px;text-align:center}
.foot .link{font-size:13px}
.tv-admin{display:block;margin:16px auto 0;font-size:12px;opacity:.6}
.lock .link{margin-top:14px}
.tips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}
.tips .lbl{font-size:12px;opacity:.75;margin-right:4px}
.tip{display:inline-flex;gap:4px;align-items:center;padding:4px 8px;border:2px solid currentColor;font-size:12px;font-weight:700}
.tip.ok{color:#3fd49c}.tip.no{color:#ff8080}
.tipcount{margin:10px 0 0;font-size:13px}
</style>

/* ---------- Normalise untrusted shared data ---------- */
function normSettings(x) {
  x = x || {};
  const hasSplit = Array.isArray(x.split);
  const split = pad10([]).map((_, i) => num(hasSplit ? x.split[i] : undefined, 0, 100, hasSplit ? 0 : DEFAULT_SETTINGS.split[i]));
  const prize = num(x.prize, 0, 10000000, 100);
  const amounts = pad10([]).map((_, i) => num(Array.isArray(x.amounts) ? x.amounts[i] : undefined, 0, 10000000, Math.round(prize * split[i]) / 100));
  const places = Math.round(num(x.places, 1, MAX_PLACES, 3));
  return {
    title: (str(x.title, 60) || 'Alans Turnier').replace(/^(Spieleturnier|Adams Turnier)$/i, 'Alans Turnier'),
    date: /^\d{4}-\d{2}-\d{2}$/.test(x.date || '') ? x.date : '',
    prize, places, mode: x.mode === 'eur' ? 'eur' : 'pct', split, amounts
  };
}
function normPlayer(id, x) {
  x = x || {};
  return {id, name: str(x.name, 40) || 'Spieler', avatar: safeImg(x.avatar), color: /^#[0-9a-f]{6}$/i.test(x.color || '') ? x.color : COLORS[0], createdAt: Number(x.createdAt) || 0};
}
function normPoint(id, x) {
  x = x || {};
  return {id, playerId: String(x.playerId || ''), delta: num(x.delta, -100000, 100000, 0), reason: str(x.reason, 60), ts: Number(x.ts) || 0};
}
function normQuestion(id, x) {
  x = x || {};
  const a = (Array.isArray(x.a) ? x.a : []).map(s => str(s, 120)).filter(Boolean).slice(0, 4);
  return {id, q: str(x.q, 300), a, c: Math.round(num(x.c, 0, Math.max(0, a.length - 1), 0)),
    cat: Math.round(num(x.cat, 0, 4, 0)), lvl: Math.round(num(x.lvl, 0, 4, 2)), createdAt: Number(x.createdAt) || 0};
}
function quizOk(q) {
  if (!q) return false;
  if (q.status === 'none') return true;

/* ---------- Persistence ---------- */
const chains = new Map();
let wroteOk = false;
function serial(key, fn) {
  const prev = chains.get(key) || Promise.resolve();
  const next = prev.then(fn, fn);
  chains.set(key, next.catch(() => {}));
  return next;
}
function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({settings:S.settings, players:S.players, points:S.points, questions:S.questions, quiz:S.quiz, seen:S.seen, wheel:S.wheel, news:S.news})); } catch (e) {}
}
function loadLocal() {
  try {
    const raw = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (!raw) return;
    S.settings = normSettings(raw.settings);
    S.players = (raw.players || []).map(p => normPlayer(p.id, p));
    S.points = (raw.points || []).map(p => normPoint(p.id, p)).sort((a, b) => b.ts - a.ts);
    S.questions = (raw.questions || []).map(q => normQuestion(q.id, q));
    S.quiz = raw.quiz && quizOk(raw.quiz) ? raw.quiz : null;
    S.seen = Array.isArray(raw.seen) ? raw.seen.filter(s => typeof s === 'string') : [];
    S.wheel = normWheel(raw.wheel);
    if (raw.news) S.news = normNews(raw.news);
  } catch (e) {}
}
function onWriteError(e) {
  const code = e && e.code;
  if (code === 'permission-denied') toast(S.admin ? 'Keine Berechtigung. Prüf die Firebase-Regeln (siehe Anleitung).' : 'Du kannst hier nur zuschauen. Ändern kann nur der Spielleiter.');
  else if (code === 'resource-exhausted') toast('Das kostenlose Tageslimit der Datenbank ist erreicht. Morgen geht es weiter.');
  else toast('Speichern hat nicht geklappt. Prüfe die Verbindung und versuch es nochmal.');
}
function write(path, data) {
  if (S.mode === 'loading') { toast('Einen Moment, die Seite lädt noch.'); return Promise.resolve(); }
  if (S.mode !== 'db') { if (S.mode === 'local') saveLocal(); return Promise.resolve(); }
  return serial(path, async () => {
    if (!db) return;
    const ref = db.doc(path);
    const run = () => data === null ? ref.delete() : ref.set(data);
    try { await run(); wroteOk = true; }
    catch (e) {
      if (e && e.code === 'unavailable') {
        await new Promise(r => setTimeout(r, 400 + Math.random() * 600));
        try { await run(); wroteOk = true; return; } catch (e2) { onWriteError(e2); throw e2; }
      }
      onWriteError(e); throw e;
    }
  });
}
const body = o => { const {id, ...rest} = o; return rest; };

/* ---------- Live subscriptions ---------- */
function subscribe() {
  const need = new Set(['players', 'points', 'questions', 'settings', 'quiz', 'seen', 'gate', 'wheel', 'news']);
  const U = f => { unsubs.push(f); };
  const slowT = setTimeout(() => { S.slow = true; if (!S.loaded) S.loaded = true; render(); }, 10000);
  const got = (key, snap) => {
    need.delete(key);
    if (!need.size && !S.loaded) S.loaded = true;
    if (!need.size && !S.synced) S.synced = true;
    if (snap && snap.metadata && !snap.metadata.fromCache) { clearTimeout(slowT); S.slow = false; }
    render();
  };
  const fail = e => {
    clearTimeout(slowT); S.loaded = true;
    if (!(e && e.code === 'permission-denied' && S.mode !== 'db')) toast('Die Daten konnten nicht geladen werden. Lade die Seite neu.');
    render();
  };
  U(db.collection('players').onSnapshot(s => { S.players = s.docs.map(d => normPlayer(d.id, d.data())); got('players', s); }, fail));
  U(db.collection('points').onSnapshot(s => { S.points = s.docs.map(d => normPoint(d.id, d.data())).sort((a, b) => b.ts - a.ts); got('points', s); }, fail));
  U(db.collection('questions').onSnapshot(s => { S.questions = s.docs.map(d => normQuestion(d.id, d.data())); got('questions', s); }, fail));
  U(db.doc('meta/settings').onSnapshot(d => { S.settings = normSettings(d.exists ? d.data() : null); got('settings', d); }, fail));
  U(db.doc('meta/seen').onSnapshot(d => { const x = d.exists ? d.data() : null; S.seen = Array.isArray(x && x.ids) ? x.ids.filter(s => typeof s === 'string').slice(0, 5000) : []; got('seen', d); }, fail));
  U(db.doc('meta/news').onSnapshot(d => { S.news = normNews(d.exists ? d.data() : null); got('news', d); }, fail));
  U(db.doc('meta/wheel').onSnapshot(d => { S.wheel = normWheel(d.exists ? d.data() : null); got('wheel', d); }, fail));
  U(db.doc('meta/gate').onSnapshot(d => { const g = d.exists ? d.data() : null; S.gate = {open: !!(g && g.open), openAt: Number(g && g.openAt) || 0}; got('gate', d); }, fail));
  U(db.doc('meta/quiz').onSnapshot(d => {
    const q = d.exists ? clone(d.data()) : null;
    if (!q) S.quiz = null;
    else if (!S.quiz || (q.rev || 0) >= (S.quiz.rev || 0)) S.quiz = quizOk(q) ? q : null;
    got('quiz', d);
    handleAnswers();
  }, fail));
  U(db.collection('answers').orderBy('ts', 'desc').limit(40).onSnapshot(s => {
    S.answers = s.docs.map(d => ({id:d.id, ...d.data()}));
    handleAnswers(); render();
  }, () => {}));
}

/* ---------- Derived ---------- */
function prizeAmounts(st = S.settings) {
  const idx = Array.from({length:st.places}, (_, i) => i);
  return st.mode === 'eur' ? idx.map(i => st.amounts[i] || 0) : idx.map(i => st.prize * (st.split[i] || 0) / 100);
}
function totalPrize(st = S.settings) { return st.mode === 'eur' ? prizeAmounts(st).reduce((t, a) => t + a, 0) : st.prize; }
function standings() {
  const tot = {};
  for (const e of S.points) tot[e.playerId] = (tot[e.playerId] || 0) + e.delta;
  const list = S.players.map(p => ({...p, pts: tot[p.id] || 0}))
    .sort((a, b) => b.pts - a.pts || a.name.localeCompare(b.name, 'de'));
  let rank = 0;
  list.forEach((p, i) => { if (i === 0 || p.pts !== list[i - 1].pts) rank = i + 1; p.rank = rank; });
  const amounts = prizeAmounts();
  const started = S.points.length > 0;
  let i = 0;
  while (i < list.length) {
    let j = i;
    while (j + 1 < list.length && list[j + 1].pts === list[i].pts) j++;
    let pool = 0; for (let k = i; k <= j; k++) pool += amounts[k] || 0;
    const each = pool / (j - i + 1);
    for (let k = i; k <= j; k++) { list[k].prize = started ? each : 0; list[k].shared = started && j > i && pool > 0; }
    i = j + 1;
  }
  return list;
}
function allQuestions() {
  const out = [];
  BANK.forEach((byLvl, c) => byLvl.forEach((qs, l) => qs.forEach((x, i) => out.push({id:`v2-${c}${l}${i}`, cat:c, lvl:l, q:x[0], a:x[1].slice(), c:0}))));
  S.questions.forEach(x => { if (x.q && x.a.length >= 2) out.push({id:'c' + x.id, cat:x.cat, lvl:x.lvl, q:x.q, a:x.a.slice(), c:x.c}); });
  return out;
}

function renderGate() {
  const root = $('#gate-root');
  const m = wantedGate();
  if (m === 'lobby' || m === 'countdown') {
    if (gateView !== m || !$('#gate')) {
      clearTimeout(gateTimer);
      if (m === 'lobby') { gateSince = Date.now(); lastTip = -1; }
      lastCd = null;
      root.innerHTML = m === 'lobby' ? lobbyHTML() : countdownHTML();
      gateView = m;
      document.body.classList.add('locked');
    }
    const clk = $('#tv-clock');
    if (clk) { const t = new Date().toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'}); if (clk.textContent !== t) clk.textContent = t; }
    if (m === 'countdown') {
      const n = Math.max(1, Math.ceil((S.gate.openAt - Date.now()) / 1000));
      if (n !== lastCd) { lastCd = n; const box = $('#cd-box'); if (box) box.innerHTML = `<div class="cd">${n}</div>`; }
    }
    return;
  }
  if (gateView === 'lobby' || gateView === 'countdown') {
    gateView = 'revealing';
    if (!$('#gate')) { root.innerHTML = countdownHTML(); document.body.classList.add('locked'); }
    const inner = $('#gate .gate-in');
    if (inner) inner.innerHTML = `<div class="cd go">Los!</div>`;
    const pe = $('#gate .preview-end'); if (pe) pe.remove();
    render();
    clearTimeout(gateTimer);
    gateTimer = setTimeout(() => {
      const g = $('#gate'); if (g) g.classList.add('lift');
      gateTimer = setTimeout(() => { root.innerHTML = ''; gateView = 'none'; document.body.classList.remove('locked'); }, reduced() ? 50 : 950);
    }, reduced() ? 300 : 900);
  }
}
function renderGatebar() {
  const el = $('#gatebar');
  if (S.mode !== 'db' || !S.admin || !S.loaded) { if (gbKey !== '') { el.innerHTML = ''; el.className = ''; gbKey = ''; } return; }
  const g = S.gate, now = Date.now();
  let cls, text, btns;
  if (!g.open) { cls = 'is-closed'; text = `<b>Lobby geschlossen.</b> Deine Freunde sehen den Ladebildschirm, bis du öffnest.`; btns = `<button class="btn btn-sm btn-ghost" type="button" data-act="copy-link">Link kopieren</button><button class="btn btn-sm btn-ghost" type="button" data-act="gate-preview">Vorschau</button><button class="btn btn-sm btn-gold" type="button" data-act="gate-open">Für alle öffnen</button>`; }
  else if (now < g.openAt) { cls = 'is-cd'; text = `<b>Start in ${Math.ceil((g.openAt - now) / 1000)} …</b> Alle Wartenden sehen gerade den Countdown.`; btns = `<button class="btn btn-sm" type="button" data-act="gate-close">Abbrechen</button>`; }
  else { cls = 'is-open'; text = `<b>Lobby offen.</b> Alle mit dem Link sehen die Seite.`; btns = `<button class="btn btn-sm btn-ghost" type="button" data-act="copy-link">Link kopieren</button><button class="btn btn-sm" type="button" data-act="gate-close">Wieder schließen</button>`; }
  const key = cls + text;

  el.innerHTML = `<div class="wrap gb-inner"><span class="gb-dot" aria-hidden="true"></span><span class="gb-text">${text}</span><span class="gb-actions">${btns}</span></div>`;
}

/* ---------- Rendering ---------- */
function patch(el, html) {
  const a = document.activeElement;
  const id = a && a.id && el.contains(a) ? a.id : null;
  let ss = null, se = null;
  try { ss = a.selectionStart; se = a.selectionEnd; } catch (e) {}
  el.innerHTML = html;
  if (id) {
    const n = document.getElementById(id);
    if (n) { n.focus({preventScroll:true}); try { if (ss != null) n.setSelectionRange(ss, se); } catch (e) {} }
  }
}
function render() {
  renderHeader();
  const m = $('#main');
  let html;
  if (S.mode === 'loading' || (S.mode === 'db' && !S.loaded)) html = `<div class="loading">${COIN(48, 'spin')}<p>Lade Turnier …</p></div>`;
  else if (S.mode === 'setup') html = setupHTML();
  else if (S.mode === 'firstrun') html = firstRunHTML();
  else if (S.mode === 'lock') html = lockHTML();
  else if (blocked()) html = `<div style="min-height:70vh"></div>`;
  else html = ({rangliste:viewBoard, spieler:viewPlayers, rad:viewWheel, quiz:viewQuiz, news:viewNews, einstellungen:viewSettings}[S.tab] || viewBoard)();
  patch(m, html);
  renderFoot();
  if (S.modal) renderModal();
  renderGatebar();
  renderGate();
  tick();
  if (S.tab === 'rad') ensureWheelLoop();
  if (S.tab === 'quiz') ensurePickLoop();
  syncMusic();
}
function renderFoot() {
  const el = $('#foot'); if (!el) return;
  const h = S.mode !== 'db' ? '' : S.admin
    ? `<span>Du bist als Spielleiter angemeldet.</span> <button class="link" type="button" data-act="admin-logout">Abmelden</button>`

function renderHeader() {
  if (S.tab === 'einstellungen' && !S.admin && S.mode !== 'loading') S.tab = 'rangliste';
  $('#brand-title').textContent = S.settings.title;
  const parts = [];
  const d = fmtDate(S.settings.date); if (d) parts.push(d);
  parts.push(`${S.players.length} Spieler`);
  $('#brand-sub').textContent = parts.join(' · ');
  document.title = S.settings.title;
  const hideTabs = S.mode === 'loading' || S.mode === 'setup' || S.mode === 'lock' || S.mode === 'firstrun' || (S.mode === 'db' && !S.loaded) || blocked();
  const tabs = hideTabs ? [] : TABS.filter(t => t[0] !== 'einstellungen' || S.admin);
  const live = S.quiz && S.quiz.status === 'running';
  $('#tabs').innerHTML = tabs.map(([k, l]) => `<button class="tab" type="button" data-act="tab" data-tab="${k}" aria-selected="${S.tab === k}">${TAB_SHORT[k] ? `<span class="t-long">${l}</span><span class="t-short">${TAB_SHORT[k]}</span>` : l}${k === 'quiz' && live ? ' <span aria-hidden="true" style="color:var(--hp)">■</span><span class="vh">(läuft)</span>' : ''}</button>`).join('');
  const pill = $('#pill');
  let txt = 'Lädt …', cls = '';
  if (S.mode === 'db') { txt = S.slow ? 'Verbindung langsam' : (S.admin ? 'Gespeichert' : 'Live'); cls = S.slow ? 'is-warn' : 'is-ok'; }

function draftSettings() {
  const st = S.settings;
  return {title:st.title, date:st.date, prize:String(st.prize), places:st.places, mode:st.mode, split:st.split.map(String), amounts:st.amounts.map(String)};
}
const parseNum = v => Number(String(v ?? '').replace(',', '.')) || 0;
function draftAsSettings(s) {
  return normSettings({
    title:s.title, date:s.date, prize:parseNum(s.prize), places:s.places, mode:s.mode,
    split: s.split.map((v, i) => i < s.places ? parseNum(v) : 0),
    amounts: s.amounts.map((v, i) => i < s.places ? parseNum(v) : 0)
  });
}
function splitSum() { const s = D.set; return s.split.slice(0, s.places).reduce((t, v) => t + parseNum(v), 0); }
function splitValid() { return D.set.mode === 'eur' || Math.abs(splitSum() - 100) < 0.001; }
function splitNote() {
  const s = D.set;
  if (s.mode === 'eur') return {bad:false, text:`Zusammen: ${fmtMoney(totalPrize(draftAsSettings(s)))}. Das ist das Preisgeld, das oben angezeigt wird.`};
  const sum = Math.round(splitSum() * 100) / 100;
  return sum === 100 ? {bad:false, text:'Zusammen 100 %.'} : {bad:true, text:`Zusammen ergibt das ${sum} %. Es müssen genau 100 % sein. Tipp: „Vorschlag einsetzen“.`};
}

/* ---------- Photos ---------- */
async function toAvatar(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(img.naturalWidth, img.naturalHeight);
    if (!s) throw new Error('empty');
    const size = 224, c = document.createElement('canvas');
    c.width = c.height = size;
    const x = c.getContext('2d');
    x.fillStyle = '#1d172a'; x.fillRect(0, 0, size, size);
    x.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
    return c.toDataURL('image/jpeg', .84);
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- Link teilen ---------- */
function copyFallback(text = SHARE_URL) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, 9999);
    const ok = document.execCommand && document.execCommand('copy');
    ta.remove(); return !!ok;
  } catch (e) { return false; }
}
function copyShareLink() {
  const done = () => toast('Link kopiert. Jetzt kannst du ihn deinen Freunden schicken.');
  const fail = () => { if (copyFallback()) done(); else openModal({type:'link'}); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(SHARE_URL).then(done, fail);
    else fail();
  } catch (e) { fail(); }
}

    if (!title && !text) { toast('Schreib eine Überschrift oder einen Text.'); return; }
    let at = 0;
    if (n.kind === 'countdown') {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(n.date || '')) { toast('Wähl ein Datum für den Countdown.'); return; }
      at = berlinToUtc(n.date, n.time || '00:00');
    }
    const nn = clone(S.news); nn.items.unshift({id:uid(), kind:n.kind, title, text, at});
    D.news = {kind:n.kind, title:'', text:'', date:n.date, time:n.time};
    ops.saveNews(nn); toast('Ankündigung veröffentlicht.');
  } else if (f === 'unlock') {
    tryUnlock(D.pwIn);
  } else if (f === 'guest-player') {
    createGuestPlayer();
  } else if (f === 'first-run') {
    createTournament(D.pwNew);
  } else if (f === 'admin-login') {
    const mail = str(D.alMail, 200), pw = String(D.alPw || '');
    if (!mail || !pw) { toast('Gib E-Mail und Passwort ein.'); return; }
    fauth.signInWithEmailAndPassword(mail, pw).then(() => { D.alPw = ''; closeModal(); }, e => {
      const c = e && e.code || '';
      toast(authMsg(c, 'E-Mail oder Passwort stimmt nicht.'));
    });
  } else if (f === 'wheel-add') {
    const label = str(D.wnew, 40);
    if (!label) { toast('Schreib zuerst ein Spiel in das Feld.'); return; }
    const w = clone(S.wheel);
    if (w.items.some(x => x.label.toLowerCase() === label.toLowerCase())) { toast(`„${label}“ ist schon im Rad.`); return; }
    if (w.items.length >= 40) { toast('Mehr als 40 Spiele passen nicht ins Rad.'); return; }
    w.items.push({id:uid(), label});
    D.wnew = '';
    ops.saveWheel(w);
    setTimeout(() => { const n = $('#w-new'); if (n) n.focus(); }, 30);
  } else if (f === 'add-question') {
    const qtext = str(D.qq.q, 300);
    const raw = D.qq.a.map(a => str(a, 120));
    if (!qtext) { toast('Schreib zuerst die Frage.'); return; }
    if (!raw[D.qq.c]) { toast('Die als richtig markierte Antwort ist leer.'); return; }
    const filled = raw.map((a, i) => ({a, i})).filter(x => x.a);
    if (filled.length < 2) { toast('Gib mindestens zwei Antworten ein.'); return; }
    const q = {id:uid(), q:qtext, a:filled.map(x => x.a), c:filled.findIndex(x => x.i === D.qq.c), cat:D.qq.cat, lvl:D.qq.lvl, createdAt:Date.now()};
    D.qq = {q:'', a:['', '', '', ''], c:0, cat:D.qq.cat, lvl:D.qq.lvl};
    ops.addQuestion(q);
    toast(`Frage gespeichert: ${CATS[q.cat]}, ${LEVELS[q.lvl]}.`);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.modal) { closeModal(); return; }
  if (S.modal || S.tab !== 'quiz' || !S.admin) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input', 'textarea', 'select'].includes(tag)) return;
  const q = S.quiz; if (!q || q.status !== 'running') return;
  const k = e.key.toLowerCase();
  const map = {'1':0, '2':1, '3':2, '4':3, a:0, b:1, c:2, d:3};
  if (q.phase === 'asking' && k in map && q.board[q.cell] && map[k] < q.board[q.cell].q.a.length) { e.preventDefault(); quizAnswer(map[k]); }
  else if (q.phase === 'ready' && k === 'z') { e.preventDefault(); quizRandom(); }
  else if ((k === 'enter' || k === ' ') && tag !== 'button' && q.phase === 'revealed') { e.preventDefault(); quizNext(); }
  else if (k === 'p') { if (q.phase === 'asking') quizPause(); else if (q.phase === 'paused') quizResume(); }
});
window.addEventListener('hashchange', () => { const h = (location.hash || '').slice(1); if (h && h !== S.tab) { S.tab = TABS.some(t => t[0] === h) ? h : 'rangliste'; render(); } });

function berlinParts(ms) {
  const f = new Intl.DateTimeFormat('en-GB', {timeZone:'Europe/Berlin', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'});
  const o = {}; f.formatToParts(new Date(ms)).forEach(p => { o[p.type] = p.value; });
  return o;
}
function berlinToUtc(dateStr, timeStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const [hh, mi] = (timeStr || '00:00').split(':').map(Number);
  const want = Date.UTC(y, m - 1, d, hh || 0, mi || 0);
  let guess = want;
  for (let k = 0; k < 2; k++) {
    const p = berlinParts(guess);
    const shown = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute);
    guess += want - shown;
  }
  return guess;
}
function fmtBerlin(ms) {

function cdParts(ms) {
  let s = Math.max(0, Math.floor(ms / 1000));

  const h = Math.floor(s / 3600); s -= h * 3600;

}

/* ---------- Quiz-Musik: MP3 bleibt auf diesem Gerät (IndexedDB) ---------- */
function idb() {
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open('turnier-media', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('files');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
}
async function idbDo(mode, fn) {
  const dbi = await idb();
  return new Promise((res, rej) => {
    const tx = dbi.transaction('files', mode); const st = tx.objectStore('files');
    const r = fn(st); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error);
  });
}
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const music = {el:null, url:'', name:'', size:0, ready:false, blocked:false, preview:false, resumeAt:0,
  on: lsGet('turnier-music-on', '1') === '1', auto: lsGet('turnier-music-auto', '1') === '1', vol: Number(lsGet('turnier-music-vol', '0.6')) || 0.6, failed:false};
function musicEl() {
  if (!music.el) { music.el = new Audio(); music.el.loop = true; music.el.preload = 'auto'; music.el.volume = music.vol; }
  return music.el;
}
async function loadMusic() {
  try {
    const rec = await idbDo('readonly', st => st.get('music'));
    if (rec && rec.blob) {
      if (music.url) URL.revokeObjectURL(music.url);
      music.url = URL.createObjectURL(rec.blob); music.name = rec.name || 'Musik'; music.size = rec.size || rec.blob.size;
      const el = musicEl(); el.src = music.url;
      if (music.resumeAt) { const t = music.resumeAt; el.addEventListener('loadedmetadata', () => { try { el.currentTime = t % (el.duration || 1e9); } catch (e) {} }, {once:true}); music.resumeAt = 0; }
      music.ready = true;
    } else { music.ready = false; music.name = ''; }
  } catch (e) { music.failed = true; }
  syncMusic(); if (S.tab === 'einstellungen' || S.tab === 'quiz') render();
}
async function saveMusicFile(file) {
  if (!file) return;
  if (file.size > 40 * 1024 * 1024) { toast('Die Datei ist zu groß. Nimm eine MP3 unter 40 MB.'); return; }
  try {
    await idbDo('readwrite', st => st.put({blob:file, name:file.name, size:file.size}, 'music'));
    toast('Musik gespeichert. Sie läuft während des Quiz auf diesem Gerät.');
    music.resumeAt = 0; await loadMusic();
  } catch (e) { toast('Die Musik konnte auf diesem Gerät nicht gespeichert werden.'); }
}
async function removeMusic() {
  try { await idbDo('readwrite', st => st.delete('music')); } catch (e) {}
  if (music.el) { music.el.pause(); music.el.removeAttribute('src'); }
  if (music.url) URL.revokeObjectURL(music.url);
  music.url = ''; music.ready = false; music.name = ''; music.preview = false;
  render();
}
function musicShouldPlay() {
  if (!music.ready || !S.admin) return false;
  if (music.preview) return true;
  return music.on && music.auto && !!S.quiz && S.quiz.status === 'running';
}
function syncMusic() {
  if (!music.ready || !music.el) return;
  const el = music.el;
  if (musicShouldPlay()) {
    if (el.paused) { const p = el.play(); if (p && p.catch) p.then(() => { music.blocked = false; }, () => { music.blocked = true; }); }
  } else if (!el.paused) el.pause();
}

async function sha256hex(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
}

    img.onerror = () => res('');
    img.src = src;
  });
}

}

/* Connect to a room */
function connectRoom(r) {
  unsubs.forEach(u => { try { u(); } catch (e) {} });
  unsubs = [];
  room = r;
  db = {collection: p => fs.collection('rooms/' + r + '/' + p), doc: p => fs.doc('rooms/' + r + '/' + p)};
  S.mode = 'db'; S.loaded = false; S.synced = false; S.answers = []; S.quiz = null;
  subscribe();
  if (!S.admin) {
    unsubs.push(fs.doc('rooms/' + r).onSnapshot(d => {
      if (room !== r || S.admin || !(d.data() && d.data().moved)) return;
      unsubs.forEach(u => { try { u(); } catch (e) {} });
      unsubs = []; storePass('');
      S.mode = 'lock'; S.lockMsg = 'Das Passwort wurde geändert. Gib das neue Passwort ein.'; render();
    }, () => {}));
  } else {
    loadMusic();
    db.collection('answers').where('ts', '<', Date.now() - 86400000).limit(300).get()
      .then(sn => sn.docs.forEach(d => d.ref.delete().catch(() => {}))).catch(() => {});
  }
  render();
}
async function openRoom(r) {
  try {
    const d = await fs.doc('rooms/' + r).get();
    if (!d.exists) { S.lockMsg = 'Falsches Passwort. Versuch es nochmal.'; return false; }
    if (d.data() && d.data().moved) { S.lockMsg = 'Das Passwort wurde geändert. Gib das neue Passwort ein.'; return false; }
  } catch (e) {
    S.lockMsg = e && e.code === 'permission-denied' ? 'Die Datenbank ist noch nicht freigegeben. Der Spielleiter muss in Firebase die Regeln eintragen.' : 'Keine Verbindung zur Datenbank. Prüf dein Internet und lade neu.';
    return false;
  }
  connectRoom(r);
  return true;
}
async function tryUnlock(pw) {
  pw = str(pw, 64);
  if (!pw) { S.lockMsg = 'Gib das Passwort ein.'; render(); return; }
  if (await openRoom(await roomFor(pw))) { storePass(pw); D.pwIn = ''; S.lockMsg = ''; }
  else { S.mode = 'lock'; render(); setTimeout(() => { const i = $('#pw-in'); if (i) i.focus(); }, 30); }
}
async function guestEnter() {
  S.admin = false; S.secret = null;
  const pw = storedPass();
  if (pw && await openRoom(await roomFor(pw))) return;
  if (pw && S.lockMsg.startsWith('Falsches')) S.lockMsg = 'Das Passwort wurde geändert. Gib das neue Passwort ein.';
  S.mode = 'lock'; S.loaded = true; render();
}
/* The first account that logs in becomes the Spielleiter (admin/owner). Every later account stays a guest. */
async function claimOwner(u) {
  try {
    const o = await fs.doc('admin/owner').get();
    if (o.exists) return o.data() && o.data().uid === u.uid ? 'me' : 'other';
    await fs.doc('admin/owner').set({uid:u.uid});
    return 'me';
  } catch (e) { return e && e.code === 'permission-denied' ? 'rules' : 'offline'; }
}
function rulesMissing() {
  S.mode = 'lock'; S.loaded = true;
  S.lockMsg = 'Die Datenbank-Regeln sind noch nicht eingetragen. Trag in Firebase die Regeln aus firestore.rules ein (Anleitung, Schritt 1.4).';
  render();
}
async function adminEnter(u) {
  let c = null;
  for (let attempt = 0; attempt < 2 && !c; attempt++) {
    try { c = await fs.doc('admin/config').get(); }
    catch (e) {
      if (!(e && e.code === 'permission-denied')) { S.mode = 'lock'; S.loaded = true; S.lockMsg = 'Keine Verbindung zur Datenbank. Prüf dein Internet und lade neu.'; render(); return; }
      const who = attempt === 0 ? await claimOwner(u) : 'rules';
      if (who === 'me') continue;
      if (who === 'other') { toast('Dieses Konto ist nicht der Spielleiter.'); fauth.signOut(); return; }
      if (who === 'rules') { rulesMissing(); return; }
      S.mode = 'lock'; S.loaded = true; S.lockMsg = 'Keine Verbindung zur Datenbank. Prüf dein Internet und lade neu.'; render(); return;
    }
  }
  S.admin = true;
  const x = c.exists ? c.data() : null;
  if (x && x.room) { S.secret = {password:String(x.password || '')}; storePass(S.secret.password); connectRoom(x.room); toast('Du bist als Spielleiter angemeldet.'); return; }

const ROOM_COLLS = ['players', 'points', 'questions', 'answers'];
const ROOM_DOCS = ['settings', 'quiz', 'seen', 'gate', 'wheel', 'news'];
async function changePassword(pw) {
  pw = str(pw, 64);
  if (pw.length < 3) { toast('Das Passwort braucht mindestens 3 Zeichen.'); return; }
  const nr = await roomFor(pw);
  if (nr === room) { toast('Das ist schon das aktuelle Passwort.'); return; }
  const old = room;
  toast('Passwort wird geändert …');
  try {
    const ops2 = [];
    for (const c of ROOM_COLLS) {
      const snap = await fs.collection('rooms/' + old + '/' + c).get();
      snap.docs.forEach(d => ops2.push({path:'rooms/' + nr + '/' + c + '/' + d.id, data:d.data(), del:'rooms/' + old + '/' + c + '/' + d.id}));
    }
    for (const m of ROOM_DOCS) {
      const d = await fs.doc('rooms/' + old + '/meta/' + m).get();
      if (d.exists) ops2.push({path:'rooms/' + nr + '/meta/' + m, data:d.data(), del:'rooms/' + old + '/meta/' + m});
    }
    await fs.doc('rooms/' + nr).set({created:Date.now()});
    for (let i = 0; i < ops2.length; i += 200) {
      const b = fs.batch();
      ops2.slice(i, i + 200).forEach(o => b.set(fs.doc(o.path), o.data));
      await b.commit();
    }
    await fs.doc('admin/config').set({room:nr, password:pw});
    await fs.doc('rooms/' + old).set({moved:true});
    for (let i = 0; i < ops2.length; i += 200) {
      const b = fs.batch();
      ops2.slice(i, i + 200).forEach(o => b.delete(fs.doc(o.del)));
      await b.commit();
    }
  } catch (e) { toast('Passwort ändern hat nicht geklappt. Versuch es nochmal.'); return; }
  S.secret = {password:pw}; storePass(pw); D.pwNew = '';
  connectRoom(nr);
  toast('Neues Passwort gilt. Alle müssen es einmal neu eingeben.');
}

/* Answers and field picks from guests */
function answerFor(qkey, pid) { return (S.answers || []).find(a => a.qkey === qkey && a.pid === pid) || null; }
function sendAnswer(qkey, choice) {
  if (S.mode !== 'db' || !db) return;

  const id = (qkey + '_' + pid).replace(/[^A-Za-z0-9_.:-]/g, '_').slice(0, 140);

}
let applying = false;
function handleAnswers() {
  if (!S.admin || applying) return;
  const q = S.quiz;
  if (!q || q.status !== 'running') return;
  applying = true;
  try {
    if (q.phase === 'asking' && q.cell != null && q.board[q.cell] && q.board[q.cell].q) {
      const a = answerFor(guessKey(q), q.turn);
      if (a && Number.isInteger(a.choice) && a.choice < q.board[q.cell].q.a.length) { quizAnswer(a.choice); toast(`${ghost(q.turn).name} hat ${LETTERS[a.choice]} getippt.`); }
    } else if (q.phase === 'ready' && !pickState(q).animating) {
      const a = answerFor('cell:' + q.id + ':' + (q.step || 0), q.turn);
      if (a && q.board[a.choice] && !q.board[a.choice].used && q.board[a.choice].q) quizPick(a.choice);
    }
  } finally { applying = false; }
}
function guessesHTML(q) {
  const list = (S.answers || []).filter(a => a.qkey === guessKey(q));

  if (q.phase !== 'revealed') return S.admin ? `<p class="muted tipcount">${list.length === 1 ? '1 Tipp' : list.length + ' Tipps'} eingegangen</p>` : '';
  const cur = q.board[q.cell].q;

}

    closeModal(); render();
    toast(`${name} ist dabei!`);
  } catch (e) { toast('Das hat nicht geklappt. Prüf dein Internet und versuch es nochmal.'); }
}

/* ---------- Boot ---------- */
function boot() {
  document.body.insertAdjacentHTML('afterbegin', SHELL);
  if (!S.news) S.news = clone(DEFAULT_NEWS);
  const h = (location.hash || '').slice(1);
  if (TABS.some(t => t[0] === h)) S.tab = h;
  const fc = CFG && CFG.firebase;
  if (!fc || !fc.apiKey || /HIER_EINTRAGEN/.test(fc.apiKey) || /DEIN-PROJEKT/.test(fc.projectId || '') || !window.firebase) {
    S.mode = 'setup'; S.loaded = true;
    if (fc && fc.apiKey && !/HIER_EINTRAGEN/.test(fc.apiKey) && !window.firebase) S.setupErr = 'Firebase konnte nicht geladen werden. Prüf deine Internetverbindung.';
    render(); return;
  }
  try {
    if (!firebase.apps.length) firebase.initializeApp(CFG.firebase);
    fs = firebase.firestore(); fauth = firebase.auth();
    try { fs.settings({ignoreUndefinedProperties:true, merge:true}); } catch (e) {}
  } catch (e) { S.mode = 'setup'; S.loaded = true; S.setupErr = String(e && e.message || e); render(); return; }
  render();
  fauth.onAuthStateChanged(u => {
    S.userEmail = u && u.email || '';
    if (u) adminEnter(u); else guestEnter();
  });
}
boot();
</script>
</body>
</html>
