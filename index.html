<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darkime</title>
<meta name="description" content="Darkime: Turnier, Minispiele und Spieler-Profile für unsere Gruppe. Einfach reinkommen und mitspielen.">
<meta name="theme-color" content="#ffcf3f">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Darkime">
<meta property="og:title" content="Darkime">
<meta property="og:description" content="Turnier, Minispiele und Spieler-Profile. Klick auf den Link und du bist direkt dabei.">
<meta property="og:image" content="https://yuta7124.github.io/Alans-Turnier/og.png">
<meta name="twitter:card" content="summary_large_image">
<script>try{document.documentElement.dataset.design=localStorage.getItem('turnier-design')||'neon'}catch(e){document.documentElement.dataset.design='neon'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Unbounded:wght@400;500;600;700;800&family=Pixelify+Sans:wght@500;700&family=Press+Start+2P&family=Bungee&family=Orbitron:wght@700;900&family=Permanent+Marker&family=Bangers&family=Pacifico&family=Russo+One&family=Creepster&display=swap" rel="stylesheet">
<style id="app-style">
:root{
  /* Layout: retro arcade cabinet at night. Coin "jackpot" + pixel podium on top, highscore table and log below; tabs work like a game menu with a blinking cursor. Pixel-notched panels everywhere. One dark world on purpose. */
  --bg:#0f0b1e;
  --bg-2:#150f2b;
  --panel:#1c1537;
  --panel-2:#2a1f4f;
  --edge:#463a80;
  --ink:#f5f2ff;
  --muted:#aaa1d2;
  --coin:#ffcf3f;
  --coin-dk:#b57400;
  --hp:#ff4f6d;
  --xp:#39d6f2;
  --ok:#4ff08f;
  --shadow:#07050f;
  --silver:#d3dbea;
  --bronze:#e5925a;
  --pixel:"Press Start 2P","Courier New",monospace;
  --display:"Pixelify Sans","Press Start 2P",system-ui,sans-serif;
  --body:"Chakra Petch",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* aliases used by page code */
  --gold:var(--coin);--bad:var(--hp);--good:var(--ok);--surface:var(--panel);--surface-2:var(--panel-2);--line:var(--edge);--gold-soft:rgba(255,207,63,.14);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;background:var(--bg)}
body{margin:0;min-height:100%;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 520px at 50% -220px,rgba(57,214,242,.14),transparent 70%),
    radial-gradient(900px 600px at 105% 110%,rgba(255,79,109,.10),transparent 70%),
    linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px) 0 0/24px 24px,
    linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px) 0 0/24px 24px,
    var(--bg);
  background-attachment:fixed;}
body::before{content:"";position:fixed;left:0;top:0;width:2px;height:2px;pointer-events:none;z-index:0;background:transparent;
  box-shadow:80px 120px #fff,220px 60px #9be7ff,410px 190px #fff,560px 90px #ffd96b,730px 160px #fff,900px 70px #9be7ff,1060px 210px #fff,1230px 110px #ffd96b,1390px 180px #fff,1540px 60px #9be7ff,
    140px 420px #fff,330px 520px #ffd96b,620px 460px #fff,840px 560px #9be7ff,1010px 430px #fff,1290px 520px #fff,1470px 450px #ffd96b,
    60px 760px #9be7ff,280px 860px #fff,520px 720px #fff,760px 900px #ffd96b,980px 780px #fff,1180px 880px #9be7ff,1420px 760px #fff,1600px 900px #fff;
  animation:twinkle 3.2s steps(2) infinite;opacity:.55}
@keyframes twinkle{50%{opacity:.2}}
body.locked{overflow:hidden}
main,header{position:relative;z-index:1}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px dashed var(--xp);outline-offset:4px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}
.ico{display:inline-block;vertical-align:middle;flex:none}
.spin{animation:coinspin 1.4s steps(8) infinite}
@keyframes coinspin{0%,100%{transform:scaleX(1)}25%{transform:scaleX(.35)}50%{transform:scaleX(-1)}75%{transform:scaleX(-.35)}}
@keyframes blink{50%{opacity:0}}
@keyframes bob{50%{transform:translateY(-4px)}}

/* Pixel panel: notched corners + hard drop shadow */
.px,.card,.stage,.board,.feed,.pcard,.qcard,.turn,.modal,.vault{--e:var(--edge);background:var(--panel);margin:4px;
  box-shadow:0 -4px 0 0 var(--e),0 4px 0 0 var(--e),-4px 0 0 0 var(--e),4px 0 0 0 var(--e),0 12px 0 0 rgba(0,0,0,.42)}

/* Header */
header.top{position:sticky;top:0;z-index:20;background:rgba(13,9,27,.93);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 0 var(--shadow),0 8px 0 rgba(70,58,128,.45)}
.top-inner{display:flex;align-items:center;gap:20px;min-height:70px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-txt{display:flex;flex-direction:column;line-height:1;min-width:0}
.brand b{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:3px 3px 0 var(--shadow)}
.brand small{color:var(--muted);font-size:13px;margin-top:6px}
.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;padding:12px 9px;font-family:var(--display);font-weight:700;font-size:17px;text-transform:uppercase;color:var(--muted);white-space:nowrap;letter-spacing:.03em}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--coin);text-shadow:2px 2px 0 var(--shadow)}
.tab[aria-selected="true"]::before{content:"▶";font-size:.7em;margin-right:6px;display:inline-block;animation:blink 1s steps(1) infinite}
.pill{font-family:var(--pixel);font-size:9px;padding:7px 10px;background:var(--bg-2);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:8px;text-transform:uppercase;box-shadow:0 -2px 0 var(--edge),0 2px 0 var(--edge),-2px 0 0 var(--edge),2px 0 0 var(--edge);margin:2px}
.pill::before{content:"";width:8px;height:8px;background:var(--muted)}
.pill.is-ok::before{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pill.is-warn::before{background:var(--coin)}
.gatebar{background:rgba(255,255,255,.025)}
.gb-inner{display:flex;align-items:center;gap:10px 14px;min-height:54px;flex-wrap:wrap;padding-top:8px;padding-bottom:10px}
.gb-dot{width:12px;height:12px;background:var(--hp);flex:none;box-shadow:0 0 10px var(--hp);animation:blink 1.2s steps(1) infinite}
.gatebar.is-open .gb-dot{background:var(--ok);box-shadow:0 0 10px var(--ok);animation:none}
.gatebar.is-cd .gb-dot{background:var(--coin);box-shadow:0 0 10px var(--coin)}
.gb-text{font-size:14px;flex:1 1 240px;color:var(--muted)}
.gb-text b{color:var(--ink);font-family:var(--display);font-size:16px;text-transform:uppercase;letter-spacing:.03em;margin-right:4px}
.gb-actions{display:flex;gap:8px;flex-wrap:wrap}
.gb-pub{display:inline-block;margin-left:8px;font-family:var(--pixel);font-size:8px;text-transform:uppercase;color:var(--ok);vertical-align:1px}
.gb-pub.pending{color:var(--coin)}.gb-pub.off{color:var(--hp)}
@media (max-width:680px){
  .top-inner{gap:4px 12px;padding-top:10px}
  .brand b{font-size:24px}
  .tabs{order:3;width:100%;margin-left:-12px}
  .tabs{gap:0}
  .tab{font-size:14px;padding:10px 6px;letter-spacing:0}
  .tab[aria-selected="true"]::before{margin-right:4px}
  .pill{margin-left:auto}
}

/* Buttons and chips */
.btn{--e:var(--shadow);--f:var(--panel-2);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 16px;min-height:44px;margin:3px;border:0;background:var(--f);color:var(--ink);
  font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.03em;text-transform:uppercase;line-height:1.1;
  box-shadow:0 -3px 0 0 var(--e),0 3px 0 0 var(--e),-3px 0 0 0 var(--e),3px 0 0 0 var(--e),inset 0 -5px 0 0 rgba(0,0,0,.3),inset 0 3px 0 0 rgba(255,255,255,.14);
  transition:transform .06s,filter .15s}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(3px);box-shadow:0 -3px 0 0 var(--e),0 3px 0 0 var(--e),-3px 0 0 0 var(--e),3px 0 0 0 var(--e),inset 0 -2px 0 0 rgba(0,0,0,.3)}
.btn-gold{--f:var(--coin);color:#2b1a00}
.btn-ghost{--f:transparent;--e:var(--edge);box-shadow:0 -3px 0 0 var(--e),0 3px 0 0 var(--e),-3px 0 0 0 var(--e),3px 0 0 0 var(--e)}
.btn-sm{min-height:36px;padding:4px 12px;font-size:14px}
.btn-lg{min-height:58px;font-size:21px;padding:10px 24px}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:grayscale(.6);transform:none}
.btn.danger{color:var(--hp)}
.link{background:none;border:0;padding:0;color:var(--coin);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;border:0;margin:2px;background:var(--bg-2);padding:6px 14px;font-weight:600;font-size:14px;min-height:38px;
  box-shadow:0 -2px 0 var(--edge),0 2px 0 var(--edge),-2px 0 0 var(--edge),2px 0 0 var(--edge)}
.chip:hover{background:var(--panel-2)}
.chip[aria-pressed="true"]{background:rgba(255,207,63,.14);color:var(--coin);box-shadow:0 -2px 0 var(--coin),0 2px 0 var(--coin),-2px 0 0 var(--coin),2px 0 0 var(--coin)}
.chip[aria-pressed="true"]::before{content:"▶";font-size:9px}
.chip.pchip{padding-left:5px}
.chip .dot{width:9px;height:9px;background:var(--lc)}
.x{background:none;border:0;color:var(--muted);font-family:var(--pixel);font-size:14px;line-height:1;width:34px;height:34px;flex:none}
.x:hover{background:var(--panel-2);color:var(--hp)}

/* Inputs */
.input{width:calc(100% - 6px);margin:3px;background:#0b0817;border:0;padding:10px 12px;min-height:44px;outline:none;font-family:var(--body);font-size:16px;
  box-shadow:0 -3px 0 var(--edge),0 3px 0 var(--edge),-3px 0 0 var(--edge),3px 0 0 var(--edge)}
.input:focus{box-shadow:0 -3px 0 var(--coin),0 3px 0 var(--coin),-3px 0 0 var(--coin),3px 0 0 var(--coin)}
textarea.input{resize:vertical;min-height:76px}
.input.mini{width:90px}
.field{display:flex;flex-direction:column;gap:8px}
.lbl,.field>label{font-family:var(--pixel);font-size:10px;line-height:1.6;color:var(--xp);text-transform:uppercase;letter-spacing:.04em}
.field small{color:var(--muted);font-size:13px}

/* Avatars: square portraits */
.av{flex:none;display:inline-grid;place-items:center;font-family:var(--pixel);color:#160f2c;background:var(--c,#888);overflow:hidden;line-height:1;text-transform:uppercase;box-shadow:0 0 0 3px var(--shadow)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.ghost{background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,255,255,.05) 6px 12px);box-shadow:0 0 0 3px var(--edge)}

/* Sections */
.section{margin:30px 0 70px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h2.h{font-family:var(--display);font-weight:700;font-size:34px;text-transform:uppercase;letter-spacing:.03em;line-height:1;text-shadow:3px 3px 0 var(--shadow);display:flex;align-items:center;flex-wrap:wrap;gap:4px 0}
h2.h::before{content:"";width:12px;height:12px;background:var(--coin);box-shadow:4px 4px 0 var(--hp);margin-right:16px;flex:none}
h2.h .count{font-family:var(--pixel);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0;margin-left:14px;text-shadow:none}
.card{padding:22px}
.eyebrow{font-family:var(--pixel);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--xp)}

/* Money */
.mn{font-family:var(--pixel)}
.cur{font-family:var(--display);font-weight:700;margin-left:.18em;font-size:1.15em}

/* Hero: jackpot + podium */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:26px;margin-top:30px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.vault{--e:var(--coin);position:relative;padding:24px 24px 20px;display:flex;flex-direction:column;gap:16px;overflow:hidden;
  background:linear-gradient(180deg,#2c1d07,var(--panel) 62%)}
.vault::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 2px,transparent 2px 4px)}
.vault-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.vault-top .eyebrow{color:var(--coin);font-size:12px}
.prize.long{font-size:clamp(20px,3.3vw,38px)!important}
.prize{color:var(--coin);font-size:clamp(30px,4.6vw,54px);line-height:1.15;text-shadow:4px 4px 0 var(--coin-dk),8px 8px 0 rgba(0,0,0,.4);white-space:nowrap;position:relative;z-index:1}
.split{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;position:relative;z-index:1}
.split li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:2px dashed rgba(255,255,255,.08)}
.split li b{font-size:12px;color:var(--ink);white-space:nowrap}
.split .pct{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.split.many{display:grid;grid-template-columns:1fr 1fr;column-gap:22px}
.split.many li{grid-template-columns:28px 1fr auto}
.split.many .pct{display:none}
@media (max-width:420px){.split.many{grid-template-columns:1fr}}
.medal{width:26px;height:26px;display:inline-grid;place-items:center;font-family:var(--pixel);font-size:10px;color:#1a1030;flex:none;vertical-align:middle;box-shadow:0 0 0 2px var(--shadow)}
.m1{background:var(--coin)}.m2{background:var(--silver)}.m3{background:var(--bronze)}
.m4{background:var(--panel-2);color:var(--muted)}
.vault .link{position:relative;z-index:1}
.stage{padding:20px 20px 0;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.stage-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stage-head h2.h{font-size:28px}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:12px;margin-top:auto}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pod .crown{animation:bob 1.2s steps(2) infinite;margin-bottom:-2px}
.pod-name{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:6px}
.pod-pts{color:var(--muted);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.pod-block{width:100%;margin-top:6px;display:flex;justify-content:center;padding-top:12px;font-family:var(--pixel);font-size:26px;line-height:1;color:var(--muted);
  background:linear-gradient(rgba(0,0,0,.18) 2px,transparent 2px) 0 0/100% 16px,var(--panel-2);box-shadow:inset 0 6px 0 var(--edge),inset 6px 0 0 rgba(255,255,255,.05)}
.pos1 .pod-block{height:136px;color:var(--coin);box-shadow:inset 0 6px 0 var(--coin),inset 6px 0 0 rgba(255,255,255,.06);background:linear-gradient(rgba(0,0,0,.18) 2px,transparent 2px) 0 0/100% 16px,#3a2a12}
.pos2 .pod-block{height:100px;color:var(--silver);box-shadow:inset 0 6px 0 var(--silver)}
.pos3 .pod-block{height:74px;color:var(--bronze);box-shadow:inset 0 6px 0 var(--bronze)}
.pos1 .av{box-shadow:0 0 0 4px var(--coin),0 0 0 7px var(--shadow),0 0 30px rgba(255,207,63,.35)}
.pos2 .av{box-shadow:0 0 0 4px var(--silver),0 0 0 7px var(--shadow)}
.pos3 .av{box-shadow:0 0 0 4px var(--bronze),0 0 0 7px var(--shadow)}
.pod.empty .av{box-shadow:0 0 0 3px var(--edge)}
.pod.empty .pod-name{color:var(--muted)}
.prize-tag{display:inline-flex;align-items:center;gap:6px;font-size:10px;color:var(--coin);background:rgba(255,207,63,.12);padding:5px 8px;white-space:nowrap;box-shadow:0 0 0 2px rgba(255,207,63,.35)}
.prize-tag small{font-family:var(--body);font-size:11px;color:var(--muted);margin-left:2px}

/* Highscore + log */
.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:26px;margin:36px 0 70px}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.board{overflow:hidden;padding:4px 0}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;align-items:center;gap:14px;padding:12px 18px;border-top:2px dashed rgba(255,255,255,.07)}
.board.is-admin .row{grid-template-columns:52px minmax(0,1fr) auto auto 44px}
.row:first-child{border-top:0}
.row.r1{background:linear-gradient(90deg,rgba(255,207,63,.10),transparent 70%)}
.rank{font-family:var(--pixel);font-size:16px;color:var(--muted);text-align:center;line-height:1}
.row.r1 .rank{color:var(--coin);text-shadow:2px 2px 0 var(--coin-dk)}.row.r2 .rank{color:var(--silver)}.row.r3 .rank{color:var(--bronze)}
.who{display:flex;align-items:center;gap:14px;min-width:0}
.who-txt{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.who .nm{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1}
.xpbar{display:block;height:8px;max-width:240px;background:#0b0817;box-shadow:0 0 0 2px var(--shadow)}
.xpbar.wide{max-width:none;width:100%}
.xpbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--xp) 0 6px,#1d9cb8 6px 8px);transition:width .4s steps(8)}
.row.r1 .xpbar i,.pcard.is-top .xpbar i{background:repeating-linear-gradient(90deg,var(--coin) 0 6px,var(--coin-dk) 6px 8px)}
.pts{font-family:var(--pixel);font-size:20px;line-height:1;text-align:right;min-width:3ch;white-space:nowrap}
.pts small{font-family:var(--display);font-size:13px;color:var(--muted);margin-left:6px;text-transform:uppercase}
.plus{width:40px;height:40px;min-height:40px;padding:0;font-size:22px}
@media (max-width:520px){
  .row{gap:10px;padding:10px 12px;grid-template-columns:30px minmax(0,1fr) auto}
  .board.is-admin .row{grid-template-columns:30px minmax(0,1fr) auto 44px}
  .row .prize-col{grid-column:2;grid-row:2;justify-self:start;margin-left:58px}
  .row .prize-col:empty{display:none}
  .rank{font-size:12px}
  .pts{font-size:16px}
  .who .nm{font-size:18px}
}
.feed{list-style:none;margin:4px;padding:6px 0}
.ev{display:grid;grid-template-columns:52px 28px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 14px}
.feed.is-admin .ev{grid-template-columns:52px 28px minmax(0,1fr) auto 34px}
.delta{font-family:var(--pixel);font-size:13px;text-align:right}
.delta.up{color:var(--ok)}.delta.down{color:var(--hp)}
.ev-txt{min-width:0;line-height:1.25}
.ev-txt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--display);font-weight:700;text-transform:uppercase}
.ev-txt span{font-size:13px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev time{font-family:var(--pixel);font-size:8px;color:var(--muted)}
.empty-box{padding:30px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:14px}
.empty-box strong{color:var(--ink);font-family:var(--display);font-size:22px;text-transform:uppercase}

/* Players: character select */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:26px 22px}
.pcard{position:relative;padding:26px 18px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;transition:transform .12s}
.pcard:not(.add):hover{--e:var(--coin);transform:translateY(-4px)}
.ptag{position:absolute;top:10px;left:12px;font-family:var(--pixel);font-size:9px;color:var(--xp)}
.pcrown{position:absolute;top:6px;right:10px}
.pcrown .crown{animation:bob 1.2s steps(2) infinite}
.pcard .pc-av{box-shadow:0 0 0 4px var(--shadow),0 0 0 7px var(--edge);margin:8px 0 6px}
.pcard.is-top .pc-av{box-shadow:0 0 0 4px var(--shadow),0 0 0 7px var(--coin)}
.pc-name{font-family:var(--display);font-weight:700;font-size:28px;text-transform:uppercase;line-height:1;max-width:100%;overflow-wrap:anywhere;text-shadow:3px 3px 0 var(--shadow)}
.langpick{position:fixed;inset:0;z-index:500;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 35%,#2a1760,#0b0620 70%)}
.langpick.out{opacity:.4;pointer-events:none}
.lp-in{display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;max-width:560px}
.lp-sub{margin:0;font-family:var(--pixel);font-size:clamp(10px,2.2vw,14px);color:var(--xp);text-transform:uppercase;letter-spacing:.1em;line-height:1.8}
.lp-btns{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.lp-btn,.lang-btn{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:170px;padding:20px 22px 16px;border:0;cursor:pointer;color:var(--ink);background:var(--panel);font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;
  box-shadow:0 -3px 0 var(--edge),0 3px 0 var(--edge),-3px 0 0 var(--edge),3px 0 0 var(--edge),0 8px 0 3px var(--shadow)}
.lp-btn:hover,.lp-btn:focus-visible,.lang-btn:hover,.lang-btn[aria-pressed="true"]{background:var(--panel-2);box-shadow:0 -3px 0 var(--coin),0 3px 0 var(--coin),-3px 0 0 var(--coin),3px 0 0 var(--coin),0 8px 0 3px var(--shadow)}
.lp-btn .flag,.lang-btn .flag{height:50px;width:auto;display:block;box-shadow:0 0 0 3px var(--shadow)}
.lp-note{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.lang-pick{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 4px}
.lang-btn{min-width:150px;font-size:20px;padding:14px 18px 12px}
.lang-btn .flag{height:36px}
.gsec .g-top{display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap;margin-bottom:12px}
.g-hole{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
.g-hole b{font-family:var(--display);font-size:clamp(22px,2.6vw,34px);text-transform:uppercase;color:#fff}
.g-par{font-family:var(--pixel);font-size:11px;color:var(--coin)}
.g-me{display:flex;align-items:baseline;gap:8px;margin-left:auto}
.g-me small{color:var(--muted);font-size:13px}
.g-me b{font-family:var(--pixel);font-size:22px;color:var(--xp)}
.g-done{margin:0 0 12px;padding:10px 14px;background:rgba(79,240,143,.12);box-shadow:0 0 0 2px #4ff08f;color:#c9ffe0;font-weight:700}
.g-done.spec{background:rgba(57,214,242,.1);box-shadow:0 0 0 2px var(--xp);color:var(--ink)}
.g-done small{color:var(--muted);font-weight:500;margin-left:6px}
.g-main{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px;align-items:start}
.golf-stage{position:relative;min-height:220px;box-shadow:0 0 0 3px var(--edge),0 8px 0 3px var(--shadow);background:#0b0620}
.gcanvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
/* Golf im Spiel: alles auf einem festen Bildschirm, nichts zum Scrollen */
.gsec.gplay{position:fixed;inset:0;z-index:30;margin:0;padding:10px 14px 12px;display:flex;flex-direction:column;gap:10px;background:var(--bg);max-width:none}
.gplay .g-top{margin:0;flex:none;gap:8px 18px;flex-wrap:nowrap}
.gplay .g-hole{flex-wrap:nowrap;min-width:0;overflow:hidden;white-space:nowrap}
.gplay .g-hole b{font-size:clamp(18px,2.2vw,30px);overflow:hidden;text-overflow:ellipsis}
.gplay .g-main{flex:1;min-height:0;align-items:stretch}
.gplay .golf-stage{min-height:0;height:100%}
.gplay .g-side{min-height:0;overflow-y:auto;padding:12px 12px 78px}
.gplay .g-done{margin:0;padding:8px 10px;font-size:14px}
.gplay .g-done small{display:block;margin:4px 0 0}
.gplay .g-help{font-size:12px;margin:4px 0 0;line-height:1.5}
.g-hn-m{display:none}
/* Bots */
.rb-mem.bot{box-shadow:0 0 0 2px #39d6f2}
.rb-lvl{font-family:var(--pixel);font-size:8px;color:#39d6f2;text-transform:uppercase}
.bot-lvls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
@media (max-width:560px){.bot-lvls{grid-template-columns:1fr}}
/* KARTEN-CSS-START */
/* ---------- Kartenwahn: Karten im Pixel-Look der Seite (feste Farben, unabhängig vom Event-Look) ---------- */
.ksec{--edge:#463a80;--panel:#1c1537;--panel-2:#2a1f4f;--muted:#aaa1d2;--coin:#ffcf3f}
.kcard{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;width:var(--w,72px);height:calc(var(--w,72px) * 1.5);
  background:var(--kc);color:#07050f;font-family:var(--pixel);line-height:1;user-select:none;-webkit-user-select:none;
  background-image:linear-gradient(135deg,rgba(255,255,255,.24) 0 16%,transparent 16% 100%);
  box-shadow:0 -3px 0 #07050f,0 3px 0 #07050f,-3px 0 0 #07050f,3px 0 0 #07050f,inset 0 0 0 3px rgba(255,255,255,.32),inset 0 -6px 0 rgba(0,0,0,.2)}
.kc-mid{position:relative;width:70%;height:62%;display:grid;place-items:center;background:#0b0817;color:var(--kc);font-size:calc(var(--w,72px) * .34);
  box-shadow:0 -2px 0 #07050f,0 2px 0 #07050f,-2px 0 0 #07050f,2px 0 0 #07050f;text-shadow:2px 2px 0 rgba(0,0,0,.65);
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 2px,transparent 2px 4px)}
.kc-mid svg{width:58%;height:auto;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.6))}
.kc-act .kc-mid{font-size:calc(var(--w,72px) * .27)}
.kc-i{position:absolute;display:flex;font-size:calc(var(--w,72px) * .15)}
.kc-i svg{width:calc(var(--w,72px) * .18);height:auto}
.kc-i.tl{top:7%;left:9%}
.kc-i.br{bottom:7%;right:9%;transform:rotate(180deg)}
.kc-w{color:#f5f2ff;background-image:linear-gradient(135deg,rgba(255,255,255,.12) 0 16%,transparent 16% 100%)}
.kc-w .kc-mid{color:#f5f2ff}
.kc-wq{display:grid;grid-template-columns:1fr 1fr;width:48%;aspect-ratio:1;gap:3px;transform:rotate(45deg)}
.kc-wq i{display:block;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.kc-plus{position:absolute;font-weight:400;font-size:calc(var(--w,72px) * .2);color:#fff;text-shadow:2px 2px 0 #07050f,-1px -1px 0 #07050f}
.kback{background:#1c1537;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:8px 8px}
.kb-in{display:grid;place-items:center;width:62%;height:46%;background:#2a1f4f;box-shadow:0 0 0 2px #ffcf3f,0 0 0 4px #07050f}
.kb-in svg{width:56%;height:auto}
.kcard.mini{--w:20px;box-shadow:0 -1px 0 #07050f,0 1px 0 #07050f,-1px 0 0 #07050f,1px 0 0 #07050f}
.kcard.mini .kc-i{display:none}
.kcard.mini .kc-mid{font-size:7px;width:76%;height:66%;box-shadow:none;text-shadow:none}
.kcard.mini .kc-mid svg{width:80%}
.kcard.mini .kc-plus{font-size:6px;text-shadow:none}

/* Spieltisch: fester Bildschirm wie bei Golf */
.ksec.kplay{position:fixed;inset:0;z-index:30;margin:0;max-width:none;display:flex;flex-direction:column;gap:6px;padding:10px 14px 10px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 42%,#2a1f4f 0%,#170f30 52%,#0b0817 100%)}
.ksec.kplay::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px) 0 0/24px 24px}
.kplay > *{position:relative}
.k-top{display:flex;align-items:center;gap:12px;flex:none}
.k-head{display:flex;flex-direction:column;min-width:0;flex:0 1 auto}
.k-head b{font-family:var(--display);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-head small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-timer{margin-left:auto;position:relative;flex:none;width:86px;height:20px;background:#0b0817;box-shadow:0 0 0 2px var(--edge);display:flex;align-items:center;justify-content:center;overflow:hidden}
.k-timer i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#39d6f2,#4ff08f);transition:width 1s linear}
.k-timer span{position:relative;font-family:var(--pixel);font-size:10px;color:#fff;text-shadow:1px 1px 0 #000}
.k-timer.low i{background:#ff4f6d}
.k-timer.low.mine{animation:kPulse .5s steps(2) infinite}
.k-top .k-endbtn{flex:none}
.k-top .k-head + .k-endbtn{margin-left:auto}
.k-opps{display:flex;gap:10px;flex:none;overflow-x:auto;padding:5px 4px 7px;justify-content:safe center;scrollbar-width:none}
.k-opps::-webkit-scrollbar{display:none}
.k-opp{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;background:rgba(11,8,23,.78);box-shadow:0 0 0 2px var(--edge);flex:none;transition:box-shadow .2s}
.k-opp.kturn{box-shadow:0 0 0 3px #ffcf3f,0 0 18px rgba(255,207,63,.45)}
.k-opp-av{position:relative;flex:none}
.k-turn-dot{position:absolute;right:-5px;top:-5px;width:12px;height:12px;background:#ffcf3f;box-shadow:0 0 0 2px #07050f;animation:kPulse .8s steps(2) infinite}
.k-opp-info{display:flex;flex-direction:column;min-width:0}
.k-opp-info b{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.k-opp-n{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}
.k-minis{display:inline-flex;padding-left:4px}
.k-minis i{width:9px;height:13px;margin-left:-4px;background:#2a1f4f;box-shadow:0 0 0 1px #ffcf3f}
.k-one{font-family:var(--pixel);font-size:10px;color:#ff4f6d;animation:kPulse .6s steps(2) infinite}
.k-catch{background:#ff4f6d;color:#fff;animation:kAlarm .7s steps(2) infinite}
.k-table{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:clamp(26px,7vw,80px);--w:clamp(64px,14vh,128px)}
.k-ring{position:absolute;left:50%;top:50%;width:min(80vw,44vh,440px);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none}
.k-ring::before{content:"";position:absolute;inset:0;border-radius:50%;border:3px dashed color-mix(in srgb,var(--cc) 50%,transparent);animation:kSpin 16s linear infinite}
.k-ring.ccw::before{animation-direction:reverse}
.k-ring span{position:absolute;left:50%;top:-4px;transform:translateX(-50%);font-size:22px;line-height:1;color:var(--cc);text-shadow:0 0 10px var(--cc)}
.k-deck{position:relative;display:grid;background:none;border:0;padding:0;cursor:pointer}
.k-deck > .kcard{grid-area:1/1;transition:transform .12s}
.k-deck .k-deck2{transform:translate(-4px,4px)}
.k-deck .k-deck3{transform:translate(-8px,8px)}
.k-deck:disabled{cursor:default}
.k-deck:not(:disabled):hover > .kcard:not(.k-deck2):not(.k-deck3){transform:translateY(-6px)}
.kplay.mine .k-deck:not(:disabled) > .kcard:not(.k-deck2):not(.k-deck3){animation:kGlow 1s steps(2) infinite}
.k-deckn{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);font-family:var(--pixel);font-size:10px;color:var(--muted)}
.k-pile{position:relative;display:grid}
.k-pile > .kcard{grid-area:1/1}
.k-pile .u1{transform:rotate(-13deg) translate(-8px,3px)}
.k-pile .u2{transform:rotate(10deg) translate(7px,4px)}
.k-topcard{filter:drop-shadow(0 0 16px color-mix(in srgb,var(--cc) 70%,transparent))}
.k-topcard.drop{animation:kDrop .35s ease-out}
.k-ghost{opacity:.5}
.k-pend{position:absolute;right:-22px;top:-16px;z-index:2;background:#ff4f6d;color:#fff;font-family:var(--pixel);font-size:15px;padding:7px 8px;box-shadow:0 0 0 3px #07050f;animation:kPulse .6s steps(2) infinite}
.k-colorbadge{align-self:center;display:flex;align-items:center;gap:8px;font-family:var(--pixel);font-size:10px;color:#f5f2ff;background:rgba(11,8,23,.85);padding:6px 10px;box-shadow:0 0 0 2px var(--cc);white-space:nowrap}
.k-colorbadge i{width:12px;height:12px;background:var(--cc)}
.k-side{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.k-status{flex:none;text-align:center;font-size:15px;min-height:22px}
.k-status.mine b{color:#ffcf3f;font-family:var(--display);font-size:18px;margin-right:4px}
.k-log{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:36px;font-size:13px;color:#d6d0f2;text-align:center}
.k-log .old{opacity:.55;font-size:12px}
.k-actions{flex:none;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;min-height:44px}
.k-call{background:#ff4f6d;color:#fff}
.k-call.armed{background:#4ff08f;color:#07050f}
.k-hand{flex:none;container-type:inline-size;display:flex;overflow-x:auto;overflow-y:hidden;padding:24px 12px 10px;justify-content:safe center;scrollbar-width:thin;--w:clamp(60px,12vh,98px)}
.kc-btn{position:relative;flex:none;background:none;border:0;padding:0;cursor:pointer;transition:transform .12s;-webkit-tap-highlight-color:transparent}
.kc-btn + .kc-btn{margin-left:max(calc(30px - var(--w)),min(8px,calc((100cqw - 24px - var(--n) * var(--w)) / max(1,var(--n) - 1))))}
.kc-btn.ok{transform:translateY(-14px)}
.kc-btn.ok .kcard{filter:drop-shadow(0 0 7px rgba(255,207,63,.75))}
.kc-btn.no .kcard{filter:brightness(.5) saturate(.7)}
.kc-btn.drawn{transform:translateY(-22px)}
.kc-btn:hover,.kc-btn:focus-visible{z-index:3}
@media (hover:hover){.kc-btn.ok:hover{transform:translateY(-24px)}}
.kc-btn.shake{animation:kWiggle .3s}
.k-pick{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(7,5,15,.72)}
.k-pick-box{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(380px,92vw);padding:20px;background:#1c1537;box-shadow:0 0 0 3px #463a80,0 10px 0 3px #07050f}
.k-pick-box b{font-family:var(--display);font-size:22px}
.k-pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.k-pick-grid button{height:76px;border:0;background:var(--kc);color:#07050f;font-family:var(--pixel);font-size:12px;cursor:pointer;box-shadow:0 0 0 3px #07050f,inset 0 -7px 0 rgba(0,0,0,.22)}
.k-pick-grid button:hover{filter:brightness(1.12)}
/* Fliegende Karten (liegen über allem, außerhalb des Spieltischs) */
.k-fx{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
.k-fly{position:fixed;will-change:transform;filter:drop-shadow(0 10px 14px rgba(0,0,0,.55))}
.k-fly .kcard{display:flex}
.k-wait{opacity:0!important}
.kc-btn.k-flip .kcard{animation:kFlip .32s ease-out}
.kc-btn.k-pop .kcard{animation:kPop .28s ease-out}
.k-fly{perspective:700px}
.k-f3{position:relative;transform-style:preserve-3d;display:grid}
.k-f3 > div{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.k-f3b{transform:rotateY(180deg)}
.k-pile.k-land{animation:kLand .3s ease-out}
.k-pile.k-land::after{content:"";position:absolute;inset:-10px;pointer-events:none;box-shadow:0 0 0 3px var(--cc);opacity:0;animation:kRing .45s ease-out}
.k-call-now{font-size:16px;padding:12px 18px;background:#ff4f6d;color:#fff;animation:kAlarm .5s steps(2) infinite;box-shadow:0 0 0 3px #07050f,0 0 24px rgba(255,79,109,.6)}
.k-uncn{display:inline-grid;place-items:center;min-width:26px;height:26px;margin-left:6px;background:#07050f;color:#ffcf3f;font-family:var(--pixel);font-size:12px}
.k-uncd{animation:kPulse .4s steps(2) infinite}
.k-shout.bad{background:#ff4f6d;color:#fff}
.k-opp.k-got{animation:kBump .35s ease-out}
.k-opp.k-played{animation:kBump .35s ease-out}
.k-shout{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);z-index:5;white-space:nowrap;font-family:var(--pixel);font-size:10px;color:#07050f;background:#ffcf3f;padding:6px 8px;box-shadow:0 0 0 2px #07050f;animation:kShout 1.6s ease-out forwards;pointer-events:none}
.k-opp,.k-actions{position:relative}
@keyframes kFlip{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes kPop{0%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes kLand{0%{transform:scale(1)}35%{transform:scale(.94) translateY(3px)}70%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes kRing{0%{opacity:.9;transform:scale(.9)}100%{opacity:0;transform:scale(1.25)}}
@keyframes kBump{40%{transform:scale(1.08)}}
@keyframes kShout{0%{opacity:0;transform:translate(-50%,-60%) scale(.6)}15%{opacity:1;transform:translate(-50%,-110%) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-150%)}}
@keyframes kPulse{50%{opacity:.4}}
@keyframes kSpin{to{transform:rotate(360deg)}}
@keyframes kDrop{from{transform:translateY(-46px) rotate(-16deg) scale(1.18);opacity:.2}}
@keyframes kWiggle{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes kAlarm{50%{background:#ffcf3f;color:#07050f}}
@keyframes kGlow{50%{filter:drop-shadow(0 0 12px #ffcf3f)}}
@media (prefers-reduced-motion:reduce){.k-ring::before,.k-topcard.drop,.k-catch,.kc-btn.shake,.kc-btn.k-flip .kcard,.k-opp.k-got,.k-opp.k-played,.k-shout{animation:none}}
@media (max-width:760px){
  .ksec.kplay{padding:8px 8px 6px;gap:4px}
  .k-head small{display:none}
  .k-head b{font-size:16px}
  .k-timer{width:64px;height:18px}
  .k-opps{justify-content:flex-start;gap:8px}
  .k-opp{gap:6px;padding:4px 8px 4px 4px}
  .k-opp-info b{max-width:72px;font-size:13px}
  .k-table{--w:clamp(60px,11.5vh,104px);gap:clamp(30px,10vw,56px)}
  .k-status{font-size:14px}
  .k-status.mine b{font-size:16px}
  .k-log{min-height:32px;font-size:12px}
  .k-hand{--w:clamp(58px,10.5vh,86px);padding:22px 8px 8px}
  body.ingame:has(.kplay) #bgm-root{display:none}
  .k-opps.many{gap:5px;padding-top:9px}
  .k-opps.many .k-opp{position:relative;flex-direction:column;gap:2px;width:46px;padding:4px 2px 3px;align-items:center}
  .k-opps.many .k-opp-info{align-items:center}
  .k-opps.many .k-opp-info b{max-width:44px;font-size:10px}
  .k-opps.many .k-minis,.k-opps.many .k-cw{display:none}
  .k-opps.many .k-opp-n{font-family:var(--pixel);font-size:10px;color:#f5f2ff}
  .k-opps.many .k-catch{position:absolute;left:50%;top:-8px;transform:translateX(-50%);z-index:2;padding:3px 6px;font-size:10px;min-height:0;white-space:nowrap}
  .k-opps.many .k-one{position:absolute;right:2px;top:2px;font-size:8px}
}
@media (min-width:761px){.kplay .k-hand{padding-right:84px;padding-left:84px}}
@media (orientation:landscape) and (max-height:540px){
  .k-table{--w:clamp(50px,20vh,90px)}
  .k-hand{--w:clamp(48px,19vh,78px);padding-top:16px}
  .k-log .old{display:none}
}
/* Querformat (Handy quer, Tablet, PC): Gegner links, Tisch in der Mitte, Status und Knöpfe rechts, Hand unten */
@media (orientation:landscape) and (min-width:640px){
  .ksec.kplay{display:grid;grid-template-columns:minmax(150px,20%) minmax(0,1fr) minmax(170px,24%);grid-template-rows:auto minmax(0,1fr) auto;
    grid-template-areas:"top top top" "opps table side" "hand hand hand";column-gap:14px;row-gap:6px}
  .kplay > .k-top{grid-area:top}
  .kplay > .k-opps{grid-area:opps;flex-direction:column;justify-content:safe center;align-items:stretch;overflow-x:hidden;overflow-y:auto;padding:6px 6px 6px 4px;gap:8px;min-height:0}
  .kplay > .k-opps .k-opp{width:100%;min-width:0}
  .kplay > .k-opps .k-opp-info{flex:1}
  .kplay > .k-opps.many .k-opp{flex-direction:row;width:100%;gap:6px;padding:4px 8px 4px 4px;align-items:center}

.load-meta{width:100%;display:flex;justify-content:space-between;gap:12px;font-family:var(--pixel);font-size:10px;color:var(--muted);text-transform:uppercase;margin-top:4px}

@keyframes pop{0%{transform:scale(1.8);opacity:0}30%{transform:scale(1);opacity:1}100%{transform:scale(.94);opacity:.95}}
.preview-end{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:2}
.preview-end:active{transform:translateX(-50%) translateY(3px)}

/* Modal + toast + loading */

/* Malen: Schwierigkeit */
.dchoice{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:150px;padding:12px 18px;border:0;background:#141026;color:var(--ink);
  box-shadow:0 0 0 4px var(--lc),0 0 0 7px var(--shadow),0 8px 0 4px rgba(0,0,0,.45);margin:6px}
.dchoice:hover{background:#1f1840;transform:translateY(-2px)}
.dchoice small{font-family:var(--pixel);font-size:9px;text-transform:uppercase;color:var(--lc);letter-spacing:.04em}
.dchoice b{font-family:var(--display);font-size:clamp(22px,2vw,30px);text-transform:uppercase;line-height:1.05}
.dchoices{gap:16px}
.dlv{display:inline-block;font-family:var(--pixel);font-size:9px;text-transform:uppercase;color:var(--lc);padding:5px 7px;box-shadow:0 0 0 2px var(--lc);line-height:1.2;white-space:nowrap}
.dover-box.rv{box-shadow:0 0 0 3px var(--shadow),0 0 0 6px var(--lc,var(--coin))}
.dover-box.rv .dreveal{color:var(--lc,var(--coin))}
.dgal figure{box-shadow:0 0 0 3px var(--lc,var(--shadow))}

.dlvchip[aria-pressed="true"]{background:var(--lc);color:#120d22}
.dlvchip small{color:inherit;opacity:.7;margin-left:2px}
.dsteps{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
.dstepper{display:flex;align-items:center;gap:10px}
.dstepper b{font-family:var(--pixel);font-size:20px;color:var(--coin);min-width:3.4em;text-align:center}
.dstepper b small{font-size:10px;color:var(--muted)}
.dstep{width:46px;height:46px;border:0;background:var(--panel-2);color:var(--ink);font-family:var(--display);font-size:26px;line-height:1;box-shadow:0 0 0 3px var(--shadow)}
.dstep:hover{background:var(--edge)}
.dstep[disabled]{opacity:.35;cursor:default}
.dwgroup summary{color:var(--lc);font-weight:700}
.dwown{display:flex;flex-direction:column;gap:4px}
@media (max-width:420px){.dsteps{grid-template-columns:1fr}.dchoice{min-width:0;width:100%}}

/* Malen */
.dstage{display:grid;grid-template-columns:minmax(200px,250px) minmax(0,1fr) minmax(250px,320px);gap:22px;align-items:start}
.dtop{margin-bottom:16px}
.dtop .dtimer{flex:1 1 220px;max-width:520px}
.dside{position:sticky;top:14px;padding:16px 12px}
.dplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.dprow{display:flex;align-items:center;gap:10px;padding:7px 9px;background:var(--panel-2);box-shadow:0 0 0 3px var(--shadow)}
.dprow.drawing{box-shadow:0 0 0 3px var(--coin);background:linear-gradient(90deg,rgba(255,207,63,.18),var(--panel-2) 70%)}
.dprow.ok{box-shadow:0 0 0 3px var(--ok);background:linear-gradient(90deg,rgba(79,240,143,.16),var(--panel-2) 70%)}

.dprow .st-pts{font-size:16px}
.dstage > *{min-width:0}
.dcenter{min-width:0;display:flex;flex-direction:column;gap:14px}
.dword{display:flex;align-items:center;justify-content:center;gap:10px 16px;flex-wrap:wrap;min-height:64px;padding:8px 14px;background:var(--panel);box-shadow:0 0 0 3px var(--shadow),0 0 0 6px var(--edge);text-align:center}
.dw-lbl{font-family:var(--pixel);font-size:9px;text-transform:uppercase;color:var(--xp);letter-spacing:.06em}
.dw-word{font-family:var(--display);font-size:clamp(26px,2.4vw,40px);text-transform:uppercase;color:var(--coin);letter-spacing:.06em;line-height:1}

.dw-pat{display:inline-flex;gap:18px;flex-wrap:wrap;justify-content:center}
.dwrd{display:inline-flex;gap:6px}
.dl{display:inline-block;width:.95em;text-align:center;font-family:var(--display);font-size:clamp(24px,2.2vw,36px);line-height:1.1;color:var(--ink);text-transform:uppercase;border-bottom:4px solid var(--ink);min-height:1.15em}
.dl.dash{border-bottom-color:transparent}
.dw-len{font-family:var(--pixel);font-size:11px;color:var(--muted)}
.dpaper{position:relative;width:min(calc(100% - 16px),max(420px,calc((100vh - 440px) * 1.3333)));align-self:center;background:#fff;box-shadow:0 0 0 4px var(--shadow),0 0 0 8px var(--edge),0 14px 0 4px rgba(0,0,0,.4);margin:8px}

.dover-box{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:560px;margin:auto}
.dover-box h3{font-family:var(--display);font-size:clamp(24px,2.4vw,36px);text-transform:uppercase;line-height:1.1;text-shadow:3px 3px 0 var(--shadow);margin:0}
.dover-box .dreveal{color:var(--coin);font-size:clamp(34px,3.6vw,60px)}

.dchoices{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}

.dpal{display:grid;grid-template-columns:repeat(8,30px);gap:5px}

/* Spielernamen: Schrift und Farbverlauf */
.pn.f-pixel{font-family:"Press Start 2P",monospace;font-size:.6em;line-height:1.6;font-weight:400}
.pn.f-bungee{font-family:"Bungee",sans-serif;font-size:.84em;font-weight:400}
.pn.f-orbitron{font-family:"Orbitron",sans-serif;font-weight:900;font-size:.84em}
.pn.f-bangers{font-family:"Bangers",cursive;letter-spacing:.05em;font-weight:400}
.pn.f-marker{font-family:"Permanent Marker",cursive;text-transform:none;font-size:.9em;font-weight:400}
.pn.f-pacifico{font-family:"Pacifico",cursive;text-transform:none;font-size:.82em;line-height:1.35;font-weight:400}
.pn.f-russo{font-family:"Russo One",sans-serif;font-size:.9em;font-weight:400}
.pn.f-creepster{font-family:"Creepster",cursive;letter-spacing:.05em;font-weight:400}
.pn.is-g{background:var(--gr);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.6))}
.pn.g-regenbogen{background-size:200% 100%;animation:rbtext 4s linear infinite}
@keyframes rbtext{to{background-position:-200% 0}}
.motto{display:block;font-size:13px;font-style:italic;color:var(--muted);text-transform:none;font-family:var(--body);font-weight:600;line-height:1.3;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .motto{white-space:normal;margin-top:-4px}
.turn .motto{white-space:normal;font-size:14px}
/* Avatar-Rahmen */
.av.fr-gold{box-shadow:0 0 0 3px #1a1200,0 0 0 6px #ffcf3f,0 0 16px rgba(255,207,63,.55)!important}
.av.fr-neon{box-shadow:0 0 0 3px var(--c),0 0 14px var(--c),0 0 30px var(--c)!important}
.av.fr-pixel{box-shadow:0 0 0 3px #fff,0 0 0 6px #000,5px 5px 0 6px rgba(0,0,0,.45)!important}
.av.fr-feuer{animation:frfire 1.1s ease-in-out infinite alternate}
.av.fr-regenbogen{animation:frrb 3s linear infinite}
@keyframes frfire{from{box-shadow:0 0 0 3px #ff4f6d,0 0 10px #ff9f5a}to{box-shadow:0 0 0 3px #ffcf3f,0 0 26px #ff4f6d}}
@keyframes frrb{0%,100%{box-shadow:0 0 0 4px #ff4f6d,0 0 16px #ff4f6d}25%{box-shadow:0 0 0 4px #ffcf3f,0 0 16px #ffcf3f}50%{box-shadow:0 0 0 4px #4ff08f,0 0 16px #4ff08f}75%{box-shadow:0 0 0 4px #39d6f2,0 0 16px #39d6f2}}
@media (prefers-reduced-motion:reduce){.av.fr-feuer,.av.fr-regenbogen,.pn.g-regenbogen{animation:none}}
/* Spieler-Formular */
.pf-prev{display:flex;align-items:center;gap:14px;padding:12px;background:#0b0817;box-shadow:0 0 0 2px var(--edge);text-align:left;width:100%;box-sizing:border-box}
.pf-prev-t{min-width:0;display:flex;flex-direction:column;gap:4px}
.pf-prev-name{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;line-height:1.1;text-shadow:2px 2px 0 var(--shadow);overflow-wrap:anywhere}
.pf-sec{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.fchip{font-size:15px;text-transform:none}
.gsw{width:34px;height:34px;border:0;padding:0;margin:2px;background:var(--g);box-shadow:0 0 0 2px var(--shadow);cursor:pointer}
.gsw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--shadow),0 0 0 6px var(--coin)}
.frchip{gap:10px}
.frchip .av{margin:3px}
/* Foto zuschneiden */
.crop{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.crop-view{position:relative;overflow:hidden;background:#0b0817;cursor:grab;touch-action:none;box-shadow:0 0 0 3px var(--coin);max-width:100%}
.crop-view:active{cursor:grabbing}
.crop-view img{position:absolute;left:50%;top:50%;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.crop-ring{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.crop-zoom{display:flex;align-items:center;gap:10px;font-weight:700;width:min(220px,100%)}
.crop-zoom input{flex:1;accent-color:var(--coin)}
.crop-tip{margin:0;text-align:center;font-size:13px}
/* Hintergrundmusik */
#bgm-root{position:fixed;right:16px;bottom:16px;z-index:140;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
body.locked #bgm-root{bottom:96px}
.bgm-btn{position:relative;width:52px;height:52px;border:0;background:var(--panel);color:var(--muted);font-size:24px;line-height:1;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 3px var(--shadow),0 0 0 5px var(--edge),0 8px 0 rgba(0,0,0,.4)}
.bgm-btn.on{color:var(--coin)}
.bgm-btn.playing{box-shadow:0 0 0 3px var(--shadow),0 0 0 5px var(--coin),0 8px 0 rgba(0,0,0,.4)}
.bgm-btn i{position:absolute;bottom:7px;width:4px;height:4px;background:var(--coin);opacity:0}
.bgm-btn i:nth-of-type(1){left:14px}.bgm-btn i:nth-of-type(2){left:24px}.bgm-btn i:nth-of-type(3){left:34px}
.bgm-btn.playing i{opacity:1;animation:eq .9s steps(3) infinite alternate}
.bgm-btn.playing i:nth-of-type(2){animation-delay:.3s}.bgm-btn.playing i:nth-of-type(3){animation-delay:.6s}
@keyframes eq{from{height:3px}to{height:11px}}
.bgm-pop{background:var(--panel);padding:16px;width:min(300px,calc(100vw - 32px));box-shadow:0 0 0 3px var(--shadow),0 0 0 5px var(--coin),0 10px 0 rgba(0,0,0,.45);display:flex;flex-direction:column;gap:10px}
.bgm-title{font-family:var(--display);font-size:20px;text-transform:uppercase}
.bgm-ctl{display:flex;flex-direction:column;gap:10px}
.bgm-ctl .vol{display:flex;align-items:center;gap:10px;font-weight:700}
.bgm-ctl .vol input{flex:1;accent-color:var(--coin)}
.bgm-pop .m-text{margin:0;font-size:13px}
.bgm-hint{margin:0;color:var(--coin)!important}
/* Fliegende Bilder */
#fly-site{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fly-site .fly-layer{opacity:.2}
.fly-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.fly{position:absolute;left:0;top:var(--y);width:var(--s);height:var(--s);object-fit:contain;animation:fly var(--d) linear var(--dl) infinite;will-change:transform;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.fly.rev{animation-name:flyrev}
@keyframes fly{0%{transform:translate(-30vw,0) rotate(var(--r0))}50%{transform:translate(45vw,-5vh) rotate(calc((var(--r0) + var(--r1)) / 2))}100%{transform:translate(120vw,0) rotate(var(--r1))}}
@keyframes flyrev{0%{transform:translate(120vw,0) rotate(var(--r1))}50%{transform:translate(45vw,5vh) rotate(calc((var(--r0) + var(--r1)) / 2))}100%{transform:translate(-30vw,0) rotate(var(--r0))}}
.foot{position:relative;z-index:1}
.pics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px;margin:12px 0 4px}
.pic{position:relative;aspect-ratio:1;background:#0b0817;box-shadow:0 0 0 2px var(--edge);display:grid;place-items:center;overflow:hidden}
.pic img{max-width:100%;max-height:100%;object-fit:contain}
.pic .x{position:absolute;top:2px;right:2px;background:rgba(10,7,22,.85)}
.pic.add{cursor:pointer;color:var(--muted);font-size:13px;font-weight:700}
.pic.add:hover{box-shadow:0 0 0 2px var(--coin);color:var(--coin)}
/* Flaggen und Schätzfragen im Quiz */
.qflag{display:flex;justify-content:center;padding:6px 0}
.qflag img{display:block;height:clamp(120px,22vh,230px);width:auto;max-width:100%;object-fit:contain;box-shadow:0 0 0 3px var(--shadow),0 0 0 6px var(--edge),0 10px 0 rgba(0,0,0,.4);background:#fff}
.cat-flag{height:14px;width:auto;vertical-align:-2px;margin-right:6px;box-shadow:0 0 0 1px rgba(255,255,255,.3)}
.est{display:flex;flex-direction:column;gap:14px;padding:6px 4px}
.est-out{align-self:center;font-family:var(--pixel);font-size:clamp(22px,2.6vw,38px);color:var(--coin);text-shadow:3px 3px 0 var(--coin-dk);padding:6px 16px;background:#0b0817;box-shadow:0 0 0 3px var(--shadow),0 0 0 5px var(--edge)}
.est-range{width:100%;height:44px;accent-color:var(--coin);cursor:pointer}
.est-range[disabled]{cursor:default;opacity:.7}
.est-ends{display:flex;justify-content:space-between;gap:12px;font-family:var(--pixel);font-size:11px;color:var(--muted)}
.est-hint{margin:0;text-align:center;color:var(--muted);font-weight:600}
.est-go{align-self:center;min-width:min(320px,100%)}
.est-scale{position:relative;height:16px;margin:62px 8px 64px;background:#0b0817;box-shadow:0 0 0 3px var(--shadow),0 0 0 5px var(--edge)}
.est-band{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(90deg,rgba(79,240,143,.55) 0 6px,rgba(79,240,143,.3) 6px 8px)}
.est-mk{position:absolute;top:0;bottom:0;width:0}
.est-mk i{position:absolute;left:-3px;top:-12px;width:6px;height:40px;background:var(--ink);box-shadow:0 0 0 2px var(--shadow)}
.est-mk b{position:absolute;left:0;transform:translateX(-50%);white-space:nowrap;font-size:14px;padding:4px 8px;box-shadow:0 0 0 2px var(--shadow)}
.est-mk.edge-l b{transform:translateX(-8px)}
.est-mk.edge-r b{transform:translateX(calc(-100% + 8px))}
.est-mk.is-ans i{background:var(--ok)}
.est-mk.is-ans b{bottom:calc(100% + 16px);color:#06291c;background:var(--ok)}
.est-mk.is-guess b{top:calc(100% + 16px)}
.est-mk.is-guess.ok i{background:var(--xp)}.est-mk.is-guess.no i{background:var(--hp)}
.est-mk.is-guess.no b{color:#fff;background:#8a2338}.est-mk.is-guess.ok b{color:#0b2a33;background:var(--xp)}
.est-done{padding-bottom:4px}
.est-done .est-ends{margin-top:-6px}
.qform .est-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}

/* ===== Redesign „Neon-Glas“ (Nov 2026): dunkles Glas, weiche Ecken, Neon-Verläufe. Liegt über dem Pixel-Grundstil, aktiv mit html[data-design="neon"]. Neue Designs: eigener Block mit html[data-design="…"] und Eintrag in DESIGNS. ===== */
html[data-design="neon"]{--bg:#07060f;--bg-2:#100c22;--panel:rgba(24,19,48,.78);--panel-2:#2a2152;--edge:rgba(160,130,255,.26);--muted:#aaa3d4;--shadow:#04030a;
  --head:"Unbounded","Pixelify Sans",system-ui,sans-serif;--display:var(--head);--body:"Unbounded",system-ui,sans-serif;--pixel:"Unbounded",system-ui,sans-serif;--r:18px;--neon:linear-gradient(90deg,#ff4f6d,#ffcf3f 50%,#39d6f2)}
html[data-design="neon"] body{background:
  radial-gradient(900px 600px at 0% -10%,rgba(124,77,255,.28),transparent 65%),
  radial-gradient(800px 520px at 100% 0%,rgba(57,214,242,.18),transparent 65%),
  radial-gradient(900px 700px at 70% 110%,rgba(255,79,109,.16),transparent 65%),
  linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px) 0 0/32px 32px,
  linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px) 0 0/32px 32px,var(--bg);background-attachment:fixed}
html[data-design="neon"] header.top{background:rgba(9,7,20,.72);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);box-shadow:0 10px 30px -12px rgba(0,0,0,.8)}
html[data-design="neon"] header.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--neon);opacity:.85;box-shadow:0 0 14px rgba(255,120,140,.5)}
html[data-design="neon"] .brand b{font-family:var(--head);font-weight:800;letter-spacing:.01em;text-shadow:none;background:linear-gradient(180deg,#fff 30%,#c9bfff);-webkit-background-clip:text;background-clip:text;color:transparent}
html[data-design="neon"] .tab{border-radius:999px;transition:color .15s,background .15s}
html[data-design="neon"] .tab[aria-selected="true"]{background:rgba(255,207,63,.12);text-shadow:0 0 12px rgba(255,207,63,.55);box-shadow:inset 0 0 0 1px rgba(255,207,63,.35)}
html[data-design="neon"] .tab[aria-selected="true"]::before{content:none}
html[data-design="neon"] .px,html[data-design="neon"] .card,html[data-design="neon"] .stage,html[data-design="neon"] .board,html[data-design="neon"] .feed,html[data-design="neon"] .pcard,html[data-design="neon"] .qcard,html[data-design="neon"] .turn,html[data-design="neon"] .modal,html[data-design="neon"] .vault{border-radius:var(--r);background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,0) 40%),var(--panel);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px var(--e),inset 0 1px 0 rgba(255,255,255,.08),0 22px 44px -22px rgba(0,0,0,.85)}
html[data-design="neon"] .modal{border-radius:22px;background:#151030}
html[data-design="neon"] h2.h{font-family:var(--head);font-weight:800;font-size:30px;letter-spacing:0;text-shadow:0 0 22px rgba(124,77,255,.45)}
html[data-design="neon"] h2.h::before{width:6px;height:28px;border-radius:6px;background:linear-gradient(180deg,#ffcf3f,#ff4f6d);box-shadow:0 0 14px rgba(255,79,109,.6)}
html[data-design="neon"] .card h3{font-family:var(--head);font-weight:800;font-size:22px;text-shadow:none}
html[data-design="neon"] .btn{border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0)),var(--f);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 -3px 0 rgba(0,0,0,.28),0 8px 20px -10px rgba(0,0,0,.9)}
html[data-design="neon"] .btn:active{transform:translateY(2px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,0,0,.28)}
html[data-design="neon"] .btn:hover{filter:brightness(1.12)}
html[data-design="neon"] .btn-gold{background:linear-gradient(180deg,#ffe58a,#ffbf2e 55%,#f59e0b);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),inset 0 -3px 0 rgba(120,60,0,.35),0 8px 24px -8px rgba(255,191,46,.7)}
html[data-design="neon"] .btn-ghost{background:rgba(255,255,255,.03);box-shadow:inset 0 0 0 1px var(--edge)}
html[data-design="neon"] .btn-ghost:hover{box-shadow:inset 0 0 0 1px rgba(255,207,63,.6)}
html[data-design="neon"] .chip{border-radius:999px;box-shadow:inset 0 0 0 1px var(--edge)}
html[data-design="neon"] .chip[aria-pressed="true"]{box-shadow:inset 0 0 0 1px var(--coin),0 0 14px -4px rgba(255,207,63,.7)}
html[data-design="neon"] .pill{border-radius:999px;box-shadow:inset 0 0 0 1px var(--edge)}
html[data-design="neon"] .input{border-radius:12px;background:rgba(5,4,14,.7);box-shadow:inset 0 0 0 1px var(--edge)}
html[data-design="neon"] .input:focus{box-shadow:inset 0 0 0 1px var(--coin),0 0 0 4px rgba(255,207,63,.15)}
html[data-design="neon"] .hub-btn{border-radius:16px;background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,0)),var(--panel);box-shadow:inset 0 0 0 1px var(--edge),0 14px 30px -18px rgba(0,0,0,.9);transition:transform .15s,box-shadow .15s}
html[data-design="neon"] .hub-btn:hover{transform:translateY(-2px)}
html[data-design="neon"] .hub-btn[aria-pressed="true"]{box-shadow:inset 0 0 0 1px var(--coin),0 0 24px -6px rgba(255,207,63,.55)}
html[data-design="neon"] .hub-txt b{font-family:var(--head);font-weight:800;font-size:19px}
html[data-design="neon"] .av{border-radius:30%;box-shadow:0 0 0 2px rgba(255,255,255,.12)}

html[data-design="neon"] body{font-size:15px;letter-spacing:-.01em}
html[data-design="neon"] :is(button,select,input,textarea,option){font-family:var(--body)}
html[data-design="neon"] .tab{letter-spacing:-.02em}
html[data-design="neon"] ::selection{background:rgba(255,79,109,.45)}
html[data-design="neon"] *{scrollbar-color:#3a2f6e transparent}
html[data-design="neon"] .start-h{font-family:var(--head);font-weight:800;font-size:22px}

html[data-design="neon"] .toast{border-radius:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px rgba(255,207,63,.5),0 14px 30px -10px rgba(0,0,0,.9)}

.nt-card{--e:var(--coin);margin-bottom:22px;display:flex;flex-direction:column;gap:12px}

const CROP_V = 220;
function cropGeom(c) {
  const s = Math.max(CROP_V / c.w, CROP_V / c.h) * c.z;
  const mx = Math.max(0, (c.w * s - CROP_V) / 2), my = Math.max(0, (c.h * s - CROP_V) / 2);
  c.x = Math.max(-mx, Math.min(mx, c.x)); c.y = Math.max(-my, Math.min(my, c.y));
  return s;
}
function cropStyle(c) {
  const s = cropGeom(c);
  return `width:${(c.w * s).toFixed(1)}px;height:${(c.h * s).toFixed(1)}px;transform:translate(calc(-50% + ${c.x.toFixed(1)}px), calc(-50% + ${c.y.toFixed(1)}px))`;
}
function cropHTML(prefix, c) {
  return `<div class="crop">
    <div class="crop-view" data-crop="${prefix}" style="width:${CROP_V}px;height:${CROP_V}px"><img src="${c.src}" alt="Foto zum Zuschneiden" draggable="false" style="${cropStyle(c)}"><span class="crop-ring" aria-hidden="true"></span></div>
    <label class="crop-zoom">Zoom <input type="range" min="1" max="4" step="0.01" value="${c.z}" data-crop-zoom="${prefix}" aria-label="Zoom"></label>
    <p class="m-text crop-tip">Zieh das Foto mit dem Finger oder der Maus an die richtige Stelle.</p>
    <div class="chips"><button class="btn btn-sm btn-gold" type="button" data-act="crop-apply" data-target="${prefix}">Zuschnitt übernehmen</button><button class="btn btn-sm btn-ghost" type="button" data-act="crop-cancel" data-target="${prefix}">Abbrechen</button></div>
  </div>`;
}
function cropUpdate(prefix) {
  const t = D[prefix]; if (!t || !t.crop) return;
  const img = document.querySelector(`.crop-view[data-crop="${prefix}"] img`);
  if (img) img.setAttribute('style', cropStyle(t.crop));
}
async function loadForCrop(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const w0 = img.naturalWidth, h0 = img.naturalHeight;
    if (!w0 || !h0) throw new Error('empty');
    const sc = Math.min(1, 1200 / Math.max(w0, h0));
    const c = document.createElement('canvas'); c.width = Math.round(w0 * sc); c.height = Math.round(h0 * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return {src:c.toDataURL('image/jpeg', .9), w:c.width, h:c.height, z:1, x:0, y:0};
  } finally { URL.revokeObjectURL(url); }
}
async function applyCrop(prefix) {
  const t = D[prefix]; if (!t || !t.crop) return;
  const c = t.crop;
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = c.src; });
  const s = cropGeom(c);
  const sx = (c.w * s / 2 - CROP_V / 2 - c.x) / s, sy = (c.h * s / 2 - CROP_V / 2 - c.y) / s, sw = CROP_V / s;
  const out = document.createElement('canvas'); out.width = out.height = 224;
  const x = out.getContext('2d'); x.fillStyle = '#1d172a'; x.fillRect(0, 0, 224, 224);
  x.drawImage(img, sx, sy, sw, sw, 0, 0, 224, 224);
  t.avatar = out.toDataURL('image/jpeg', .84); t.crop = null;
  S.modal ? renderModal() : render();
}

const chains = new Map();

}
function saveLocal() {

}

    if (!raw) return;

}

/* ---------- Live subscriptions ---------- */
function subscribe() {
  const need = new Set(['players', 'points', 'questions', 'settings', 'seen', 'gate', 'wheel', 'news', 'ticker', 'pics', 'deco', 'games', 'gvotes', 'lobbies', 'dwords']);
  const U = f => { unsubs.push(f); };
  const slowT = setTimeout(() => { S.slow = true; if (!S.loaded) S.loaded = true; render(); }, 10000);
  const got = (key, snap) => {
    need.delete(key);
    if (!need.size && !S.loaded) S.loaded = true;
    if (!need.size && !S.synced) S.synced = true;
    if (snap && snap.metadata && !snap.metadata.fromCache) { clearTimeout(slowT); S.slow = false; }
    render();
  };
  const fail = e => {
    clearTimeout(slowT); S.loaded = true;
    if (!(e && e.code === 'permission-denied' && S.mode !== 'db')) toast('Die Daten konnten nicht geladen werden. Lade die Seite neu.');
    render();
  };
  U(db.collection('players').onSnapshot(s => { S.players = s.docs.map(d => normPlayer(d.id, d.data())); got('players', s); }, fail));
  U(db.collection('points').onSnapshot(s => { S.points = s.docs.map(d => normPoint(d.id, d.data())).sort((a, b) => b.ts - a.ts); got('points', s); }, fail));
  U(db.collection('questions').onSnapshot(s => { S.questions = s.docs.map(d => normQuestion(d.id, d.data())).filter(q => !q.gone); got('questions', s); }, fail));
  U(db.doc('meta/settings').onSnapshot(d => { S.settings = normSettings(d.exists ? d.data() : null); got('settings', d); }, fail));
  U(db.doc('meta/seen').onSnapshot(d => { const x = d.exists ? d.data() : null; S.seen = Array.isArray(x && x.ids) ? x.ids.filter(s => typeof s === 'string').slice(0, 5000) : []; got('seen', d); }, fail));
  U(db.doc('meta/news').onSnapshot(d => { S.news = normNews(d.exists ? d.data() : null); got('news', d); }, fail));
  U(db.doc('meta/ticker').onSnapshot(d => { S.ticker = normTicker(d.exists ? d.data() : null); got('ticker', d); }, fail));
  U(db.doc('meta/deco').onSnapshot(d => { S.deco = normDeco(d.exists ? d.data() : null); got('deco', d); bgmSync(); }, fail));
  U(db.collection('pics').onSnapshot(sn => { S.pics = sn.docs.map(d => normPic(d.id, d.data())).filter(x => x.img).sort((a, b) => a.ts - b.ts); got('pics', sn); }, fail));
  U(db.collection('games').onSnapshot(sn => { S.games = sn.docs.map(d => normGame(d.id, d.data())).filter(g => g.name); got('games', sn); }, fail));
  U(db.collection('gvotes').onSnapshot(sn => { S.gvotes = sn.docs.map(d => { const x = d.data() || {}; return {id:d.id, gid:str(x.gid, 40), voter:str(x.voter, 40)}; }).filter(v => v.gid); got('gvotes', sn); }, fail));
  U(db.collection('lobbies').onSnapshot(sn => { onLobbies(sn); got('lobbies', sn); }, fail));
  U(db.doc('meta/dwords').onSnapshot(d => { S.dwords = normDwords(d.exists ? d.data() : null); got('dwords', d); }, fail));
  U(db.doc('meta/wheel').onSnapshot(d => { S.wheel = normWheel(d.exists ? d.data() : null); got('wheel', d); }, fail));
  U(db.doc('meta/gate').onSnapshot(d => { const g = d.exists ? d.data() : null; S.gate = {open: !!(g && g.open), openAt: Number(g && g.openAt) || 0}; got('gate', d); }, fail));
  U(db.collection('answers').orderBy('ts', 'desc').limit(40).onSnapshot(s => {
    S.answers = s.docs.map(d => ({id:d.id, ...d.data()}));
    handleAnswers(); render();
  }, () => {}));
}

/* ---------- Derived ---------- */
function prizeAmounts(st = S.settings) {
  const idx = Array.from({length:st.places}, (_, i) => i);
  return st.mode === 'eur' ? idx.map(i => st.amounts[i] || 0) : idx.map(i => st.prize * (st.split[i] || 0) / 100);
}
function totalPrize(st = S.settings) { return st.mode === 'eur' ? prizeAmounts(st).reduce((t, a) => t + a, 0) : st.prize; }
function standings() {
  const tot = {};
  for (const e of S.points) tot[e.playerId] = (tot[e.playerId] || 0) + e.delta;
  const list = S.players.map(p => ({...p, pts: tot[p.id] || 0}))
    .sort((a, b) => b.pts - a.pts || a.name.localeCompare(b.name, 'de'));
  let rank = 0;
  list.forEach((p, i) => { if (i === 0 || p.pts !== list[i - 1].pts) rank = i + 1; p.rank = rank; });
  const amounts = prizeAmounts();
  const started = S.points.length > 0;
  let i = 0;
  while (i < list.length) {
    let j = i;
    while (j + 1 < list.length && list[j + 1].pts === list[i].pts) j++;
    let pool = 0; for (let k = i; k <= j; k++) pool += amounts[k] || 0;
    const each = pool / (j - i + 1);
    for (let k = i; k <= j; k++) { list[k].prize = started ? each : 0; list[k].shared = started && j > i && pool > 0; }
    i = j + 1;
  }
  return list;
}
function allQuestions() {
  const out = [];
  const est = (id, cat, lvl, x) => ({id, cat, lvl, type:'est', q:x.q, unit:x.unit || '', min:x.min, max:x.max, ans:x.ans, tol:x.tol, year:!!x.year, step:x.step || estStep({min:x.min, max:x.max, a:x.ans, t:x.tol, y:x.year})});
  BANK.forEach((byLvl, c) => byLvl.forEach((qs, l) => qs.forEach((x, i) => {
    const id = `v3-${c}-${l}-${i}`;
    if (x && x.e) out.push(est(id, c, l, {q:x.e, unit:x.u, min:x.min, max:x.max, ans:x.a, tol:x.t, year:!!x.y, step:estStep(x)}));
    else out.push({id, cat:c, lvl:l, q:x[0], a:x[1].slice(), c:0, flag:x[2] || ''});
  })));
  S.questions.forEach(x => {
    if (x.type === 'est') { if (x.q) out.push(est('c' + x.id, x.cat, x.lvl, x)); }
    else if (x.q && x.a.length >= 2) out.push({id:'c' + x.id, cat:x.cat, lvl:x.lvl, q:x.q, a:x.a.slice(), c:x.c});
  });
  return out;
}

function tourState() {

  if (st.status === 'live' && now - st.liveAt < LIVE_MAX) return {k:'live', date:fmtDate(st.date)};

const pbnCache = {};
function pbnGet(pid) {
  if (!pid || !db) return '';
  if (pid in pbnCache) return pbnCache[pid] || '';
  pbnCache[pid] = '';
  db.collection('pbn').doc(pid).get().then(d => {
    const img = d.exists ? safeBanner((d.data() || {}).img) : '';
    pbnCache[pid] = img;
    if (img) { if (S.modal && S.modal.type === 'player') renderModal(); else if (S.tab === 'spieler') render(); }
  }).catch(() => {});
  return '';
}
function safeBanner(s) { s = String(s || ''); return /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s) && s.length < 700000 ? s : ''; }
function bannerFromFile(f) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(f), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.naturalWidth, h = img.naturalHeight, max = 1600, q = .8, out = '';
      for (let i = 0; i < 6; i++) {
        const k = Math.min(1, max / Math.max(w, h)), c = document.createElement('canvas');
        c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', q);
        if (out.length < 650000) return res(out);
        max = Math.round(max * .8); q = Math.max(.55, q - .07);
      }
      rej(new Error('big'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
function pbgImgOf(d, games) {
  const cur = pbgNorm(d.pbg);

  if (cur === 'img') return d.pbnImg != null ? d.pbnImg : pbnGet(d.id);
  if (cur.startsWith('g:')) { const g = games.find(x => x.id === cur.slice(2) && x.img); if (g) return g.img; }
  return ((typeof spFav === 'function' && spFav(games.filter(x => x.img))) || games.find(x => x.img) || {}).img || '';

async function pbnSave(d) {

const roomActions = {

/* ---------- Kartenwahn: Regeln (Ablegespiel nach den klassischen Regeln) ----------
   108 Karten: je Farbe (r, y, g, b) eine 0, zweimal 1 bis 9, zweimal Aussetzen (S), Richtungswechsel (R) und +2 (D);
   dazu 4 Farbwahl (wW) und 4 Farbwahl +4 (wF). Eine Karte ist ein kurzer Text, z. B. "r7", "gS", "wF".
   Nur das Gerät des Hosts verändert den Spielstand (kApply); alle anderen schicken Wünsche. */
const K_COLORS = ['r', 'y', 'g', 'b'];
const K_HEX = {r:'#ff4f6d', y:'#ffcf3f', g:'#4ff08f', b:'#39d6f2'};
const K_CNAME = {r:'Rot', y:'Gelb', g:'Grün', b:'Blau'};
const K_TOTAL = 108;
const kCol = c => c[0], kVal = c => c.slice(1), kWild = c => c[0] === 'w';
const kValid = c => typeof c === 'string' && /^([rygb]([0-9]|S|R|D)|w[WF])$/.test(c);
function kDeck() {
  const d = [];
  for (const c of K_COLORS) {
    d.push(c + '0');
    for (const v of ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'S', 'R', 'D']) d.push(c + v, c + v);
  }
  for (let i = 0; i < 4; i++) d.push('wW', 'wF');
  return d;
}
function kShuffle(a, rnd = Math.random) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function kPts(c) { const v = kVal(c); return /^[0-9]$/.test(v) ? Number(v) : kWild(c) ? 50 : 20; }
const kHandPts = h => h.reduce((s, c) => s + kPts(c), 0);
/* Sortierung für die Hand: nach Farbe, dann Zahl, dann Aktion */
const K_ORD = 'rygbw', K_VORD = '0123456789SRDWF';
const kSort = h => h.slice().sort((a, b) => K_ORD.indexOf(a[0]) - K_ORD.indexOf(b[0]) || K_VORD.indexOf(kVal(a)) - K_VORD.indexOf(kVal(b)));
const K_CALL_MS = 3000;
function kTop(s) { return s.pile[s.pile.length - 1]; }
function kTurnPid(s) { return s.order[s.turn]; }

/* Neues Spiel. cfg: {start: Startkarten, stack: +2/+4 stapeln, drawPlay: ziehen bis es passt, time: Sekunden pro Zug (0 = ohne)} */
function kNew(players, cfg, rnd = Math.random, now = Date.now()) {
  const deck = kShuffle(kDeck(), rnd), hands = {};
  for (const p of players) hands[p] = [];
  for (let i = 0; i < cfg.start; i++) for (const p of players) hands[p].push(deck.pop());
  // Startkarte ist immer eine Zahl
  let k = deck.length - 1; while (k >= 0 && !/^[rygb][0-9]$/.test(deck[k])) k--;
  const first = deck.splice(k, 1)[0];
  return {order:players.slice(), hands, deck, pile:[first], turn:Math.floor(rnd() * players.length), dir:1, color:kCol(first), pend:0, pendT:'',
    drewN:false, drew:'', unc:{}, seq:1, turnAt:now, log:[], win:'', done:{}};
}
function kCanPlay(s, cfg, c) {
  if (!kValid(c)) return false;
  const v = kVal(c);
  if (s.pend > 0) return !!cfg.stack && (s.pendT === 'D' ? v === 'D' || v === 'F' : v === 'F');
  if (kWild(c)) return true;
  const top = kTop(s);
  return kCol(c) === s.color || (!kWild(top) && kVal(top) === v);
}
function kPlayable(s, cfg, pid) {
  const h = s.hands[pid] || [];
  if (kTurnPid(s) !== pid || s.win) return [];
  if (s.drewN) return s.drew && h.includes(s.drew) && kCanPlay(s, cfg, s.drew) ? [s.drew] : [];
  return h.filter(c => kCanPlay(s, cfg, c));
}
function kDrawN(s, pid, n, rnd) {
  const got = [];
  for (let i = 0; i < n; i++) {
    if (!s.deck.length) {
      // Ablagestapel (ohne die oberste Karte) neu mischen
      const top = s.pile.pop(); s.deck = kShuffle(s.pile, rnd); s.pile = [top];
      if (!s.deck.length) break;
    }

}
function kLog(s, e) { s.log.push({k:s.seq, ...e}); if (s.log.length > 8) s.log.splice(0, s.log.length - 8); }
function kAdvance(s, steps, now) {

  s.turn = ((s.turn + s.dir * steps) % n + n) % n;

}
function kBestColor(h, rnd) {
  const cnt = {r:0, y:0, g:0, b:0};
  h.forEach(c => { if (!kWild(c)) cnt[kCol(c)]++; });
  const max = Math.max(...Object.values(cnt));
  const best = K_COLORS.filter(c => cnt[c] === max);

}
/* Ein Zug oder eine Aktion. req: {a, c, col, call, t}. Gibt den neuen Stand zurück oder null, wenn es nicht erlaubt ist. */
function kApply(s0, cfg, pid, req, rnd = Math.random, now = Date.now()) {
  if (!s0 || s0.win) return null;
  const s = JSON.parse(JSON.stringify(s0));
  const a = req && req.a, me = s.hands[pid], isTurn = kTurnPid(s) === pid;
  // „Letzte Karte!“: Wer auf eine Karte kommt, ohne zu rufen, hat 3 Sekunden Zeit (s.unc[pid] = Zeitpunkt). Danach zieht der Host 2 Strafkarten.
  const clearUnc = () => {};
  const finishTurn = () => { s.seq++; return s; };
  if (a === 'leave') {
    const i = s.order.indexOf(pid); if (i < 0) return null;
    const wasTurn = i === s.turn;
    s.deck = kShuffle(s.deck.concat(s.hands[pid] || []), rnd);
    delete s.hands[pid]; delete s.unc[pid];
    s.order.splice(i, 1);
    if (s.order.length < 2) { s.win = s.order[0] || ''; kLog(s, {p:pid, a:'leave'}); return finishTurn(); }
    if (i < s.turn) s.turn--;
    if (wasTurn) { if (s.dir < 0) s.turn = (i - 1 + s.order.length) % s.order.length; else s.turn = i % s.order.length; s.drewN = false; s.drew = ''; s.turnAt = now; s.pend = s.pend; }
    s.turn = Math.min(s.turn, s.order.length - 1);
    kLog(s, {p:pid, a:'leave'});
    return finishTurn();
  }
  if (!me) return null;
  if (a === 'call') {
    if (me.length !== 1 || !s.unc[pid]) return null;
    delete s.unc[pid]; kLog(s, {p:pid, a:'call'});
    return finishTurn();
  }
  if (a === 'forgot') {
    if (!s.unc[pid] || now - Number(s.unc[pid]) < K_CALL_MS - 150) return null;
    delete s.unc[pid]; const got = kDrawN(s, pid, 2, rnd); kLog(s, {p:pid, a:'forgot', n:got.length});
    return finishTurn();
  }
  if (a === 'catch') {
    const x = req.t;
    if (!x || x === pid || !s.unc[x] || !s.hands[x]) return null;
    delete s.unc[x]; kDrawN(s, x, 2, rnd); kLog(s, {p:pid, a:'catch', x, n:2});
    return finishTurn();
  }
  if (!isTurn) return null;
  if (a === 'play') {
    const c = req.c;
    if (!me.includes(c) || !kCanPlay(s, cfg, c)) return null;
    if (s.drewN && c !== s.drew) return null;
    clearUnc();
    me.splice(me.indexOf(c), 1); s.pile.push(c);
    s.color = kWild(c) ? (K_COLORS.includes(req.col) ? req.col : kBestColor(me, rnd)) : kCol(c);
    const v = kVal(c), n = s.order.length;
    let skip = 1;
    if (v === 'S') skip = 2;
    if (v === 'R') { if (n === 2) skip = 2; else s.dir *= -1; }
    if (v === 'D') { s.pend += 2; s.pendT = 'D'; }
    if (v === 'F') { s.pend += 4; s.pendT = 'F'; }
    kLog(s, {p:pid, a:'play', c, col:s.color});
    if (me.length === 1) { if (req.call) kLog(s, {p:pid, a:'call'}); else s.unc[pid] = Math.max(1, now); }
    if (!me.length) { s.win = pid; delete s.unc[pid]; s.pend = 0; return finishTurn(); }
    if (s.pend && !cfg.stack) {
      const nx = s.order[((s.turn + s.dir) % n + n) % n];
      const got = kDrawN(s, nx, s.pend, rnd);
      kLog(s, {p:nx, a:'take', n:got.length});
      s.pend = 0; s.pendT = ''; skip = 2;
    }
    kAdvance(s, skip, now);
    return finishTurn();
  }
  if (a === 'take' || (a === 'timeout' && s.pend > 0)) {
    if (!s.pend) return null;
    clearUnc();
    const got = kDrawN(s, pid, s.pend, rnd);
    kLog(s, {p:pid, a:'take', n:got.length, to:a === 'timeout'});
    s.pend = 0; s.pendT = '';
    kAdvance(s, 1, now);
    return finishTurn();
  }
  if (a === 'draw' || (a === 'timeout' && !s.drewN)) {
    if (s.pend || s.drewN) return null;
    clearUnc();
    let got = [];
    do { got = got.concat(kDrawN(s, pid, 1, rnd)); } while (cfg.drawPlay && got.length && !kCanPlay(s, cfg, got[got.length - 1]) && s.deck.length + s.pile.length > 1);
    const last = got[got.length - 1];
    kLog(s, {p:pid, a:'draw', n:got.length, to:a === 'timeout'});
    if (a !== 'timeout' && last && kCanPlay(s, cfg, last)) { s.drewN = true; s.drew = last; s.turnAt = now; return finishTurn(); }
    kAdvance(s, 1, now);

  }

}
/* Rangliste am Ende: Sieger zuerst, dann nach Punkten auf der Hand (weniger ist besser) */
function kRank(s) {
  const rows = Object.keys(s.hands).map(pid => ({id:pid, n:s.hands[pid].length, pts:kHandPts(s.hands[pid]), win:pid === s.win}));
  rows.sort((a, b) => (b.win - a.win) || a.pts - b.pts || a.n - b.n);
  let rank = 0;
  rows.forEach((r, i) => { if (!i || r.win !== rows[i - 1].win || r.pts !== rows[i - 1].pts) rank = i + 1; r.rank = rank; });
